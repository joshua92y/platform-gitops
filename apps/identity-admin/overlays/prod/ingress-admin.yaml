# identity-admin admin Ingress(prod만 — 설계 D6 · 계약 gitops-repo.md §디렉터리 overlays/prod · validate 14.3). host admin.joshuatech.dev(앞에 Access 앱 admin).
#   경로는 Prefix /identity-admin/admin · /identity-admin/static 둘만 연다 — /identity-admin 하나로 열면 admin 호스트로 /webhooks/authentik(HMAC만) ·
#   /healthz · /ready · /api가 열린다(웹훅은 svc DNS 전용). Django admin의 리다이렉트와 정적 경로는 두 접두 안에 있다(forward-auth 경로는 T084가 더한다).
#   router.middlewares = 같은 ns(jt-prod)의 stripPrefix Middleware identity-admin-strip(middleware-admin.yaml)이 /identity-admin을 떼어 pod로 보낸다.
#   spec.tls · router.tls.options · router.priority는 두지 않는다 — TLSOption default(AOP)와 와일드카드 인증서를 그대로 쓴다(같은 호스트에 다른
#   option이 생기면 TLS option 충돌에 닿는다).
#   T084 전에는 사람이 Access를 지나도 admin 페이지는 pod에서 403이다(GitHub IdP JWT에 common_name이 없다). 정적 경로(/identity-admin/static/… — pod에는
#   /static/…)는 pod의 AdminHostMiddleware가 JwtAuth 앞에서 서빙한다 — 운영자 브라우저의 정적 파일 GET 200이 router · stripPrefix · ADMIN_HOST를 함께
#   증명한다(L15).
#   노출 축소는 객체 수정(경로 줄 삭제 등)으로 한다 — prod Application은 prune: false다(설계 D24 · 런북 bootstrap.md §3 T075).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: identity-admin-admin
  labels:
    app.kubernetes.io/name: identity-admin
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.middlewares: jt-prod-identity-admin-strip@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: admin.joshuatech.dev
      http:
        paths:
          - path: /identity-admin/admin
            pathType: Prefix
            backend:
              service:
                name: identity-admin
                port:
                  name: http
          - path: /identity-admin/static
            pathType: Prefix
            backend:
              service:
                name: identity-admin
                port:
                  name: http
