# apps/identity-admin/overlays/dev/ — identity-admin dev(jt-dev). 이 overlay를 쓰는 Application = identity-admin-dev(clusters/oci-k3s/apps/identity-admin-dev.yaml).
#   base(../../base) = 모노레포 apps/identity-admin/deploy/base의 바이트 사본(dev 값 — ES store vault-dev · dev/ 키라 ES 패치가 없다). 여기서 정하는 것:
#   namespace · images digest(태그 금지) · m2m Ingress host(op test → replace) · ConfigMap 값(키별 JSON6902 replace · JT_PLACEHOLDER_EXEMPT만 add).
#   replicas(base 1)와 admin Ingress(prod만)는 두지 않는다. 계약 gitops-repo.md §디렉터리 · §이미지·승격 · §validate.yml 3(pod 표 — 검사 3.9 · 14.x).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: jt-dev
resources:
  - ../../base
# 실제 digest — 모노레포 main의 publish-pod 빌드가 dev bump 봇 PR(joshuatech-gitapp-1[bot] auto-merge · T074)로 들어온다. 봇은 아래 digest 줄의 hex만
# 제자리에서 바꾼다 — name · newName · digest 줄을 지우거나 옮기지 않는다. 옛 digest가 든 줄은 정확히 하나여야 하므로 주석에 digest 값을 적지 않는다.
images:
  - name: ghcr.io/joshua92y/identity-admin
    newName: ghcr.io/joshua92y/identity-admin
    digest: sha256:faf55a5752533dffb3b5e93e3b8d8857890d4a0690945de70c526de50be057dd
patches:
  - target: {group: networking.k8s.io, version: v1, kind: Ingress, name: identity-admin}
    patch: |-
      - op: test
        path: /spec/rules/0/host
        value: PLACEHOLDER.joshuatech.dev
      - op: replace
        path: /spec/rules/0/host
        value: identity-m2m-dev.joshuatech.dev
  - target: {version: v1, kind: ConfigMap, name: identity-admin-config}
    patch: |-
      - op: replace
        path: /data/ACCESS_AUD_M2M
        value: "e808dc6ec9f65fb3929240d3f1bd4b29792706ff2d8adecb54eada4e848cedbc"
      - op: replace
        path: /data/ACCESS_EXPECTED_CN
        value: "abc5c48a948bc0dc5d790bfa76780a73.access"
      - op: replace
        path: /data/ALLOWED_HOSTS
        value: "identity-admin.jt-dev.svc,identity-m2m-dev.joshuatech.dev"
      - op: add
        path: /data/JT_PLACEHOLDER_EXEMPT
        value: "AUTHENTIK_API_TOKEN,OPENFGA_STORE_ID,OPENFGA_PRESHARED_KEY"
