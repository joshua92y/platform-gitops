# bootstrap/root-app.yaml — Application "root"(app-of-apps 진입점) — 계약 gitops-repo.md §디렉터리 "유일한 수동 apply" (T040)
#
# 적용: `kubectl apply -f bootstrap/root-app.yaml`(../README.md ⑤). 사람이 클러스터에 직접 넣는 Application 은 이 파일뿐이고,
# 나머지 Application(platform-<component> · <pod>-<env>)은 root 가 clusters/oci-k3s/apps/ 에서 읽어 만든다(T041).
# validate: 검사 2(ServerSideApply=true) 적용 · 검사 7.1 은 name `root` + source.path `clusters/oci-k3s/apps` 일 때만 sync-wave 표 밖으로 인정.
#
# project = `platform` (T041 PR-A 에서 `default` → `platform` 이관):
#   - 계약 §Application 규약은 root 의 project 를 명시하지 않지만(플랫폼 컴포넌트 → `platform`, 앱 → `dev`·`prod`, 검사 Job → `tests`)
#     root 가 만드는 것은 플랫폼 Application CR(ns `argocd`) 이므로 목적지는 `platform` 이다(research D4 · tests/fixtures/positive).
#   - T040 시점에는 AppProject `platform` 이 없어서(없는 project 를 참조하면 InvalidSpecError 로 sync 자체가 거부된다)
#     자동 생성되는 전권 project `default` 를 임시로 썼다. T041 PR-A 가 AppProject 5종을 올리면서 그 창을 닫는다.
#   - `platform` 이 root 를 허용하는 근거: sourceRepos 에 이 저장소, destinations 에 ns `argocd`, 그리고 Application CR 은
#     네임스페이스 리소스라 clusterResourceWhitelist 를 요구하지 않는다(clusters/oci-k3s/projects/platform.yaml).
# 이관 순서(고정 — 실행 기록은 ../README.md ⑧):
#   1) PR-A 머지: clusters/oci-k3s/projects/{default,platform,dev,prod,tests}.yaml + bootstrap/argocd 가 그 디렉터리를 base 로 포함 +
#      이 파일의 `project: platform`. **clusters/oci-k3s/apps/ 에는 Application 파일을 넣지 않는다** — root 는 automated+selfHeal 이라
#      apps/ 에 파일이 들어오면 AppProject 가 아직 없는 상태에서 child 를 만들고, 그 직후의 봉인이 진행 중 operation 을 permission 실패로
#      돌려 retry 소진 → "Skipping auto-sync: failed previous sync attempt" 로 자동 sync 가 멈춘다.
#   2) 운영자: `kubectl apply --server-side --field-manager=operator-bootstrap -k clusters/oci-k3s/projects` (5객체).
#      이 순간부터 다음 조정(≤180 s)까지 root 는 InvalidSpecError·Unknown 이 될 수 있다 — 관리 리소스가 0 이라 영향은 없다.
#   3) `kubectl apply -f bootstrap/root-app.yaml` (같은 파일 재적용은 멱등, spec 변경은 즉시 refresh 를 트리거).
#   4) `kubectl -n argocd get app root -o jsonpath='{.spec.project} {.status.sync.status} {.status.health.status}'` → `platform Synced Healthy`,
#      `{.status.conditions}` → `[]`. 2)와 3) 사이의 짧은 "repository not permitted in project 'default'" 는 봉인 효과라 정상이다.
#   5) validate 는 project 값을 검사하지 않으므로(검사 2·7.1) 이관 확인은 클러스터에서 한다.
#   되돌리기: `default` 봉인은 되돌리지 않는다(봉인 뒤 root 는 `platform` 에서만 유효). root 가 InvalidSpec 에 머물면 원인은
#   platform.yaml 의 sourceRepos 문자열 또는 destinations 누락이다 → 수정 PR → 2) 재실행(SSA 멱등).
#
# syncPolicy — 계약 §Application 규약 플랫폼 표준(automated prune:false/selfHeal:true · ServerSideApply=true · Prune=confirm · Delete=confirm)에
# root 만의 차이 2개: `CreateNamespace=false`(목적지 argocd ns 는 Argo CD 자신의 ns — README ①에서 만들고 T041 policies 가 소유; root 가 만들면 안 된다),
# `ApplyOutOfSyncOnly=true`(Application CR 20–30개를 매 sync 마다 SSA 하지 않고 OutOfSync 만 적용 — 컨트롤러 부하 절감).
# `SkipDryRunOnMissingResource` 는 넣지 않는다 — root 가 만드는 것은 Application CR 뿐이고 그 CRD 는 bootstrap 이 먼저 설치한다(계약: "CRD 를 늦게 만드는 컴포넌트에만").
# 삭제 보호 어노테이션(`argocd.argoproj.io/sync-options: Delete=false,Prune=false`)은 계약 §삭제 보호 대상(pg-main · Kafka · PVC · 오퍼레이터 CRD)이 아니므로 두지 않는다.
# finalizer: root 삭제 시 child Application 까지 cascade(research D4) — `Delete=confirm` 이 승인 어노테이션(`argocd.argoproj.io/deletion-approved`,
#   RFC 3339 UTC) 전까지 막는다. 승인 시각은 deletionTimestamp 이상이어야 인정된다(v3.5.2 types.go IsDeletionConfirmed) — 순서는 delete → 어노테이션(README ⑦).
# manifest-generate-paths: 이 경로 밖의 커밋으로는 root 매니페스트를 다시 생성하지 않는다(research D12 — 폴링에서도 캐시 무효화 억제).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/manifest-generate-paths: .
spec:
  project: platform
  source:
    repoURL: https://github.com/joshua92y/platform-gitops.git
    targetRevision: main
    path: clusters/oci-k3s/apps
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
      - CreateNamespace=false
      - ApplyOutOfSyncOnly=true
      - Prune=confirm
      - Delete=confirm
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
