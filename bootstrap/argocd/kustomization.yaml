# bootstrap/argocd/ — Argo CD v3.5.2 부트스트랩 (T040)
#
# 정본 계약: 모노레포 specs/003-platform-foundation/contracts/gitops-repo.md §디렉터리
#   "remote base(install.yaml, `?ref=<commit sha>`로 핀 — 태그 금지) + patches(dex·applicationset 비활성, requests, ServerSideApply)"
# 근거: research.md R2 — ARGOCD-D1(install.yaml 단일 파일 원격 base) · D2($patch: delete) · D3(server-side diff) ·
#       D4(Application 헬스 Lua) · D10(소형 requests/limits · GOMEMLIMIT · processors) · D11(server.insecure) · D12(timeout.reconciliation)
#
# 핀 — v3.5.2 태그가 가리키는 커밋 SHA e258ee23c3e52266d407572f4bcdfe7d9ed36cb5 (조회 2026-09-07)
#   1) `git ls-remote https://github.com/argoproj/argo-cd refs/tags/v3.5.2` → e258ee23… (`^{}` peeled 줄이 없음 = lightweight 태그, SHA 자체가 커밋)
#   2) 교차 확인 `gh api repos/argoproj/argo-cd/git/ref/tags/v3.5.2` → object.type "commit", object.sha 동일
#   형식: 계약 문구의 `?ref=<sha>`는 kustomize의 git 원격 "디렉터리" 문법이라 단일 파일에는 쓸 수 없다 —
#         kustomize 5.8.1 실측: `https://github.com/argoproj/argo-cd/manifests/install.yaml?ref=<sha>` →
#         "refers to file 'install.yaml'; expecting directory". 그래서 같은 커밋의 raw 단일 파일 URL(경로에 SHA)로 핀한다.
#         research D1이 고른 형식이고, 대안 `https://github.com/argoproj/argo-cd/manifests/cluster-install?ref=<같은 SHA>`
#         (git clone, 12.7 s)와 렌더링 결과가 바이트 단위로 같다(실측 1,918,840 B · 59 문서). 태그 문자열(v3.5.2)은 어디에도 ref로 쓰지 않는다.
#   업그레이드 = 새 태그의 커밋 SHA로 아래 URL을, 같은 릴리스의 이미지 인덱스 digest 2개(images:)를 함께 바꾼 PR 1건.
#   Renovate 메모(T116): 기본 kustomize 매니저는 raw URL 속 SHA를 추적하지 않고, images[]의 digest-only 항목은 `latest` 기준 digest 갱신 PR을
#   열 수 있다 — T116에서 `packageRules`(이 파일의 images digest 업데이트 비활성) + customManager(regex: URL 위의
#   `# renovate: datasource=github-tags depName=argoproj/argo-cd currentValue=v3.5.2` 주석으로 SHA를 태그에 묶기)로 처리한다. 주석은 미리 둔다(동작은 T116).
#
# upstream NetworkPolicy 5장도 제거한다(리뷰 반영): install.yaml이 동봉하는 argocd NP는 `argocd-server-network-policy`가 `ingress: [{}]`(전 출발지),
#   controller·repo-server·notifications NP가 `namespaceSelector: {}`(전 ns → metrics)라 계약 매트릭스보다 넓다. NetworkPolicy는 합집합이라
#   T041 `platform/policies`(default-deny + allow-dns + allow-same-namespace + allow-kube-api + 매트릭스 행)로는 좁힐 수 없고 유일한 수정 지점이 여기다.
#   계약 대조(network-policy.md): argocd가 필요로 하는 행 — allow-same-namespace 7 ns에 argocd(35행) · allow-kube-api 10 ns에 argocd(36행) ·
#   kube-system(traefik) → argocd 8080(77행) · monitoring → argocd 8082·8083·8084(89행) · argocd → 외부 443 github/quay/auth(112행) — 전부 있음.
#   T041 default-deny 적용 전까지 argocd ns는 NetworkPolicy 없음(다른 ns와 같은 과도기).
#
# 이 디렉터리가 만들지 "않는" 것 — 경계(운영 절차는 ../README.md):
#   1) Namespace `argocd`(PSA restricted 라벨 3종): 정본은 T041 `platform/policies/`(정책 객체는 거기만 — validate 5.0).
#      T040 시점에는 운영자가 수동 생성한다(README ①, cloudflared README ①과 같은 방식). T041에서 Argo CD가 SSA로 인수.
#   2) AppProject(platform·dev·prod·tests, default 봉인)와 자기 관리 Application `platform-argocd`(source = 이 디렉터리, wave는 계약 단일 표): T041.
#   3) Ingress `argo.joshuatech.dev`(T043) · Authentik OIDC(argocd-cm `oidc.config`·`url`) · RBAC(argocd-rbac-cm) · 알림(argocd-notifications-cm): 뒤 태스크.
#   4) install.yaml의 빈 Secret `argocd-secret`·`argocd-notifications-secret`은 그대로 둔다 — 서버가 런타임에 채우므로 삭제 패치 금지(research 함정).
#      이 저장소에 비밀 값은 없다.
#
# 패치 원칙: 모두 strategic merge patch(SSA로 적용 가능한 완전한 객체 조각). 패치 metadata에 namespace를 적지 않는다 —
#   원격 base 리소스에 namespace가 없어 GVKN 매칭이 어긋나며, 아래 `namespace: argocd`가 패치 뒤에 붙인다.
#   같은 객체에 delete 패치를 2개 두면 kustomize 오류이므로 삭제 대상 19개(dex 6 · applicationset 8 · NetworkPolicy 5)는 각각 1개씩만 둔다.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: argocd

resources:
  # renovate: datasource=github-tags depName=argoproj/argo-cd currentValue=v3.5.2
  - https://raw.githubusercontent.com/argoproj/argo-cd/e258ee23c3e52266d407572f4bcdfe7d9ed36cb5/manifests/install.yaml

# 이미지 digest 핀 — 인프라 규칙(태그만으로 참조하지 않는다) · FR-037. 렌더링 결과는 `<name>@sha256:…`(kustomize images[].digest는
# 태그를 대체하고, `newTag` 병기는 validate 4a가 모든 kustomization에서 금지한다). 사람용 버전은 여기 주석이 정본:
#   quay.io/argoproj/argocd = v3.5.2 (install.yaml의 8개 컨테이너·initContainer 전부) · public.ecr.aws/docker/library/redis = 8.2.3-alpine
# 조회(2026-09-07): 레지스트리 v2 API `GET /v2/<repo>/manifests/<tag>`(Accept: image index · manifest list) — 멀티아치 인덱스의 digest.
#   argocd v3.5.2 → Docker-Content-Digest sha256:e2aadfae… (linux/amd64 · arm64 · s390x · ppc64le)
#   redis 8.2.3-alpine → 응답 본문 sha256 = 08ad0b1d… (OCI index: linux/amd64 · arm64 · arm · 386 · ppc64le …), 그 digest로 GET 200 확인.
#   노드 2대는 Ampere A1(arm64) — 두 인덱스 모두 linux/arm64를 포함한다.
images:
  - name: quay.io/argoproj/argocd
    digest: sha256:e2aadfae709d904e87f46ba4aa49601d827b3022db22cd4d03aae816a2e7097b
  - name: public.ecr.aws/docker/library/redis
    digest: sha256:08ad0b1d280850169a790dba1393ff7a90aef951fc19632cf4d3ce4f78e679ba

patches:
  # ---------------------------------------------------------------------------
  # (1) dex 제거 6개 — install.yaml@e258ee23 에서 이름 `argocd-dex-server*`로 확인한 전부
  #     (Deployment · Role · RoleBinding · ServiceAccount · Service · NetworkPolicy). research D2: SSO는 argocd-cm oidc.config 직결이라 dex 불필요.
  # ---------------------------------------------------------------------------
  - target: { kind: Deployment, name: argocd-dex-server }
    patch: |-
      $patch: delete
      apiVersion: apps/v1
      kind: Deployment
      metadata: { name: argocd-dex-server }
  - target: { kind: Role, name: argocd-dex-server }
    patch: |-
      $patch: delete
      apiVersion: rbac.authorization.k8s.io/v1
      kind: Role
      metadata: { name: argocd-dex-server }
  - target: { kind: RoleBinding, name: argocd-dex-server }
    patch: |-
      $patch: delete
      apiVersion: rbac.authorization.k8s.io/v1
      kind: RoleBinding
      metadata: { name: argocd-dex-server }
  - target: { kind: ServiceAccount, name: argocd-dex-server }
    patch: |-
      $patch: delete
      apiVersion: v1
      kind: ServiceAccount
      metadata: { name: argocd-dex-server }
  - target: { kind: Service, name: argocd-dex-server }
    patch: |-
      $patch: delete
      apiVersion: v1
      kind: Service
      metadata: { name: argocd-dex-server }
  - target: { kind: NetworkPolicy, name: argocd-dex-server-network-policy }
    patch: |-
      $patch: delete
      apiVersion: networking.k8s.io/v1
      kind: NetworkPolicy
      metadata: { name: argocd-dex-server-network-policy }

  # ---------------------------------------------------------------------------
  # (1) applicationset-controller 제거 8개 — 네임스페이스 리소스 6개(Deployment · Role · RoleBinding · ServiceAccount · Service · NetworkPolicy)
  #     + 클러스터 리소스 2개(ClusterRole · ClusterRoleBinding). CRD `applicationsets.argoproj.io`는 유지(무해, CLI/RBAC 호환 — research D2).
  # ---------------------------------------------------------------------------
  - target: { kind: Deployment, name: argocd-applicationset-controller }
    patch: |-
      $patch: delete
      apiVersion: apps/v1
      kind: Deployment
      metadata: { name: argocd-applicationset-controller }
  - target: { kind: Role, name: argocd-applicationset-controller }
    patch: |-
      $patch: delete
      apiVersion: rbac.authorization.k8s.io/v1
      kind: Role
      metadata: { name: argocd-applicationset-controller }
  - target: { kind: RoleBinding, name: argocd-applicationset-controller }
    patch: |-
      $patch: delete
      apiVersion: rbac.authorization.k8s.io/v1
      kind: RoleBinding
      metadata: { name: argocd-applicationset-controller }
  - target: { kind: ServiceAccount, name: argocd-applicationset-controller }
    patch: |-
      $patch: delete
      apiVersion: v1
      kind: ServiceAccount
      metadata: { name: argocd-applicationset-controller }
  - target: { kind: Service, name: argocd-applicationset-controller }
    patch: |-
      $patch: delete
      apiVersion: v1
      kind: Service
      metadata: { name: argocd-applicationset-controller }
  - target: { kind: NetworkPolicy, name: argocd-applicationset-controller-network-policy }
    patch: |-
      $patch: delete
      apiVersion: networking.k8s.io/v1
      kind: NetworkPolicy
      metadata: { name: argocd-applicationset-controller-network-policy }
  - target: { kind: ClusterRole, name: argocd-applicationset-controller }
    patch: |-
      $patch: delete
      apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRole
      metadata: { name: argocd-applicationset-controller }
  - target: { kind: ClusterRoleBinding, name: argocd-applicationset-controller }
    patch: |-
      $patch: delete
      apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRoleBinding
      metadata: { name: argocd-applicationset-controller }

  # ---------------------------------------------------------------------------
  # (1) upstream NetworkPolicy 5장 제거 — dex·applicationset NP 2장은 위에서 이미 제거, 남은 5장이 전부(머리 주석 "upstream NetworkPolicy" 참조).
  #     argocd ns의 NetworkPolicy 정본은 T041 platform/policies(계약 network-policy.md)뿐이다.
  # ---------------------------------------------------------------------------
  - target: { kind: NetworkPolicy, name: argocd-server-network-policy }
    patch: |-
      $patch: delete
      apiVersion: networking.k8s.io/v1
      kind: NetworkPolicy
      metadata: { name: argocd-server-network-policy }
  - target: { kind: NetworkPolicy, name: argocd-application-controller-network-policy }
    patch: |-
      $patch: delete
      apiVersion: networking.k8s.io/v1
      kind: NetworkPolicy
      metadata: { name: argocd-application-controller-network-policy }
  - target: { kind: NetworkPolicy, name: argocd-repo-server-network-policy }
    patch: |-
      $patch: delete
      apiVersion: networking.k8s.io/v1
      kind: NetworkPolicy
      metadata: { name: argocd-repo-server-network-policy }
  - target: { kind: NetworkPolicy, name: argocd-redis-network-policy }
    patch: |-
      $patch: delete
      apiVersion: networking.k8s.io/v1
      kind: NetworkPolicy
      metadata: { name: argocd-redis-network-policy }
  - target: { kind: NetworkPolicy, name: argocd-notifications-controller-network-policy }
    patch: |-
      $patch: delete
      apiVersion: networking.k8s.io/v1
      kind: NetworkPolicy
      metadata: { name: argocd-notifications-controller-network-policy }

  # ---------------------------------------------------------------------------
  # (2) requests/limits + GOMEMLIMIT — research D10 소형 프로파일. requests 합계 608Mi ≈ plan A14 "Argo CD 0.6 GiB"(노드 A 예산).
  #     application-controller는 StatefulSet(Deployment 아님 — research 함정). CPU limit은 두지 않는다(D10).
  # ---------------------------------------------------------------------------
  - path: resources-application-controller.yaml
  - path: resources-repo-server.yaml
  - path: resources-server.yaml
  - path: resources-redis.yaml
  - path: resources-notifications-controller.yaml

  # ---------------------------------------------------------------------------
  # (3) argocd-cmd-params-cm: server.insecure · controller.diff.server.side · processors/parallelism (2노드 소형 값)
  # (4) argocd-cm: timeout.reconciliation · Application 헬스 Lua · resourceTrackingMethod (resource.exclusions 기본 유지)
  # ---------------------------------------------------------------------------
  - path: argocd-cmd-params-cm.yaml
  - path: argocd-cm.yaml
