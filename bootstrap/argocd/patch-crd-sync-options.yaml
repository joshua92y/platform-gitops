# Argo CD CRD 3종 삭제 보호 — `argocd.argoproj.io/sync-options: Delete=false,Prune=false` (T041 PR-A)
#
# 왜: T041 부터 `platform-argocd`(project `platform`)가 이 디렉터리를 소유한다. CRD 가 prune·cascade 로 사라지면
#   모든 Application·AppProject CR 이 함께 사라지고 컨트롤러는 자기 자신을 복구할 수단을 잃는다(위험 R5·R6).
#   `Delete=false,Prune=false` 는 Application 삭제의 cascade 와 sync 의 prune 양쪽을 모두 막는다.
#   계약 §삭제 보호 목록(pg-main · Kafka · PVC · 오퍼레이터 CRD) 밖의 추가분이라 converge 인계 8번이다.
#
# 왜 strategic merge patch 인가: install.yaml@e258ee23 의 CRD 3개에는 `metadata.annotations` 맵이 아예 없다
#   (labels 만 있다 — 렌더링 실측). JSON6902 `op: add, path: /metadata/annotations/argocd.argoproj.io~1sync-options` 는
#   부모 맵이 없어 빌드가 실패한다. strategic merge 는 없는 맵을 만들어 병합한다.
#   ApplicationSet 컨트롤러는 비활성(bootstrap 이 워크로드 8객체를 삭제)이지만 CRD 자체는 CLI·RBAC 호환을 위해 남겨 두므로
#   3개 모두에 보호를 건다.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: applications.argoproj.io
  annotations:
    argocd.argoproj.io/sync-options: Delete=false,Prune=false
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: appprojects.argoproj.io
  annotations:
    argocd.argoproj.io/sync-options: Delete=false,Prune=false
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: applicationsets.argoproj.io
  annotations:
    argocd.argoproj.io/sync-options: Delete=false,Prune=false
