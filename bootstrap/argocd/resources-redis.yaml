# redis(캐시): research D10 req 32Mi / lim 128Mi. Go 프로세스가 아니므로 GOMEMLIMIT 없음. initContainer `secret-init`(argocd 이미지)은 두지 않는다.
# metadata.namespace 를 적지 않는다(kustomization.yaml "패치 원칙").
apiVersion: apps/v1
kind: Deployment
metadata:
  name: argocd-redis
spec:
  template:
    spec:
      containers:
        - name: redis
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              memory: 128Mi
