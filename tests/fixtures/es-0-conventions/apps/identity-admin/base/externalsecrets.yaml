# 부정 픽스처 3.0 ES 규약 보강 — (1) apiVersion v1beta1 (2) secretStoreRef.kind SecretStore (3) 미지 store
# (4) dataFrom.find (5) data[].sourceRef (6) dataFrom[].sourceRef — 각각 별도 문서
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata: { name: es-apiversion }
spec:
  refreshInterval: 5m
  secretStoreRef: { kind: ClusterSecretStore, name: vault-dev }
  target: { name: es-apiversion, creationPolicy: Owner }
  data:
    - secretKey: DATABASE_URL
      remoteRef: { key: dev/db/identity_admin/app, property: url }
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: { name: es-storekind }
spec:
  refreshInterval: 5m
  secretStoreRef: { kind: SecretStore, name: vault-dev }
  target: { name: es-storekind, creationPolicy: Owner }
  data:
    - secretKey: DATABASE_URL
      remoteRef: { key: dev/db/identity_admin/app, property: url }
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: { name: es-unknown-store }
spec:
  refreshInterval: 5m
  secretStoreRef: { kind: ClusterSecretStore, name: vault-all }
  target: { name: es-unknown-store, creationPolicy: Owner }
  data:
    - secretKey: DATABASE_URL
      remoteRef: { key: dev/db/identity_admin/app, property: url }
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: { name: es-datafrom-find }
spec:
  refreshInterval: 5m
  secretStoreRef: { kind: ClusterSecretStore, name: vault-dev }
  target: { name: es-datafrom-find, creationPolicy: Owner }
  dataFrom:
    - find:
        path: dev/db/
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: { name: es-data-sourceref }
spec:
  refreshInterval: 5m
  secretStoreRef: { kind: ClusterSecretStore, name: vault-dev }
  target: { name: es-data-sourceref, creationPolicy: Owner }
  data:
    - secretKey: DATABASE_URL
      remoteRef: { key: dev/db/identity_admin/app, property: url }
      sourceRef:
        storeRef: { name: vault-prod, kind: ClusterSecretStore }
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: { name: es-datafrom-sourceref }
spec:
  refreshInterval: 5m
  secretStoreRef: { kind: ClusterSecretStore, name: vault-dev }
  target: { name: es-datafrom-sourceref, creationPolicy: Owner }
  dataFrom:
    - extract: { key: dev/db/identity_admin/app }
      sourceRef:
        storeRef: { name: vault-prod, kind: ClusterSecretStore }
