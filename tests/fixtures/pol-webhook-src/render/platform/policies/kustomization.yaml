# 부정 픽스처 5.6 (render) — 렌더에서만 출발지를 넓히는 patches.
# 실제 platform/policies/kustomization.yaml은 "트랜스포머를 두지 않는다"가 규율이며, 이 픽스처는 그 규율을
# 어겼을 때 5.6이 잡는지를 고정한다(원본 파일은 계약과 정확히 일치한다).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - policies.yaml
patches:
  - target: { kind: NetworkPolicy, name: allow-apiserver-webhook, namespace: external-secrets }
    patch: |-
      - op: add
        path: /spec/ingress/0/from/-
        value:
          ipBlock:
            cidr: 0.0.0.0/0
