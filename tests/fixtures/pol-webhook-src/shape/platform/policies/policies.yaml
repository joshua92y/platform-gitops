# 부정 픽스처 5.6 (shape) — 집합은 맞지만 **모양**이 계약을 벗어난 경우 + 표 밖 ns의 동명 정책.
#   API 서버가 거절하거나(혼합 peer · 한 문자열 cidr · 문자열 포트) 계약과 다른 프로토콜을 여는 형태들이라,
#   값 비교만으로는 전부 통과한다. `set` 트리와 달리 여기서는 cidr 집합 자체는 어긋나지 않게 두었다.
#   이 트리도 Namespace·정책 세트가 없어 5.1·5.2가 함께 FAIL한다(단언은 5.6과 5.2 EXCLUSIVE만 본다).
#
#   ① cert-manager     : 한 peer에 ipBlock + namespaceSelector    → 5.6 POL-webhook-peer
#   ② external-secrets : cidr 한 문자열에 두 주소(쉼표)            → 5.6 POL-webhook-src
#   ③ cnpg-system      : port가 문자열 "9443"                      → 5.6 POL-webhook-port
#   ④ vault            : protocol UDP + 빈 문자열 cidr             → 5.6 POL-webhook-port · 5.6 POL-webhook-src
#   ⑤ data             : 표 밖 ns의 동명 정책(전 출발지·전 포트)    → 5.2 POL-set(EXCLUSIVE)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: allow-apiserver-webhook, namespace: cert-manager }
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        - ipBlock: { cidr: 10.0.7.78/32 }
        - ipBlock: { cidr: 10.42.0.0/32 }
        # ① ipBlock과 selector를 한 peer에 함께 쓰면 API 서버가 거절한다. 순수 ipBlock이 아니므로
        #    이 항목의 cidr은 출발 집합에 세지 않는다(집합은 위 두 줄로 이미 정확 일치).
        - ipBlock: { cidr: 10.0.0.10/32 }
          namespaceSelector: {}
      ports: [{ protocol: TCP, port: 10250 }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: allow-apiserver-webhook, namespace: external-secrets }
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    # ② 두 주소를 한 문자열에 넣은 것 — 쉼표 join 비교만 하면 "정확 일치"로 보인다
    - from: [{ ipBlock: { cidr: "10.0.7.78/32,10.42.0.0/32" } }]
      ports: [{ protocol: TCP, port: 10250 }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: allow-apiserver-webhook, namespace: cnpg-system }
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        - ipBlock: { cidr: 10.0.7.78/32 }
        - ipBlock: { cidr: 10.42.0.0/32 }
      ports: [{ protocol: TCP, port: "9443" }]                    # ③ 숫자가 아닌 포트(문자열)
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: allow-apiserver-webhook, namespace: vault }
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    # ④ 빈 문자열 cidr — 값 목록으로 이으면 사라져서 "집합은 맞다"로 보인다(peer 수와 대조해 잡는다)
    - from:
        - ipBlock: { cidr: 10.0.7.78/32 }
        - ipBlock: { cidr: "" }
      ports: [{ protocol: UDP, port: 8200 }]                      # ④ 계약·D6은 TCP다
---
# ⑤ 계약 §정책 세트의 적용 ns 4개 밖 — 5.2의 EXCLUSIVE가 잡는다(5.6은 표 밖 ns를 판정하지 않는다)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: allow-apiserver-webhook, namespace: data }
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from: [{ ipBlock: { cidr: 0.0.0.0/0 } }]
