# 부정 픽스처 5.6 (render-shape) — 렌더에서 정책의 ns와 이름을 바꾼다.
#   실제 platform/policies/kustomization.yaml은 "트랜스포머를 두지 않는다"가 규율이며, 이 픽스처는 그 규율을
#   어겼을 때(또는 누군가 몰래 넣었을 때) 5.6이 잡는지를 고정한다. 원본 파일은 계약과 정확히 일치한다.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - policies.yaml
patches:
  - target: { kind: NetworkPolicy, name: allow-apiserver-webhook, namespace: cnpg-system }
    patch: |-
      - op: replace
        path: /metadata/namespace
        value: monitoring
  - target: { kind: NetworkPolicy, name: allow-apiserver-webhook, namespace: external-secrets }
    patch: |-
      - op: replace
        path: /metadata/name
        value: allow-anything
