# 부정 픽스처 4a IMG-newTag — images[].newTag 사용 + digest 형식 오류
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: jt-dev
resources: []
images:
  - name: ghcr.io/joshua92y/identity-admin
    newName: ghcr.io/joshua92y/identity-admin
    newTag: v1.2.3
  - name: ghcr.io/joshua92y/relay
    digest: sha256:abc
