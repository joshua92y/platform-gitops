# 부정 픽스처 10.2 REL-args-exact(swallow-ns · 2026-09-28 검증 V-A1 a01) — 긍정 트리(`deployment.yaml`·`rbac.yaml`은
#   positive 사본)의 Reloader args에서 `--namespaces=…` **바로 앞에 값 없는 `--log-format`**을 넣었다. pflag는 문자열 플래그 뒤의
#   인자를 그 값으로 삼키므로 실행 시 `--namespaces`가 없어진다 — 감시 목록이 비어 전역 모드(pflag v1.0.10 + Reloader v1.4.21
#   플래그 정의 하네스 실측). 인자를 하나씩 세던 예전 10.2·10.3은 `--namespaces=`·`--reload-strategy=`가 1개씩 있어 PASS였다.
#   10.2 REL-args-exact(목록 불일치 + 단서 '=' 없는 플래그)만 FAIL해야 한다. helm·네트워크가 필요 없다.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - deployment.yaml
  - rbac.yaml
patches:
  - target: { kind: Deployment, name: reloader, namespace: reloader }
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/args/1
        value: --log-format
