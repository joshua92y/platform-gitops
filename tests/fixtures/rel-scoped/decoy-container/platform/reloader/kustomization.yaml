# 부정 픽스처 10.4 REL-image(decoy-container · 2026-09-28 검증 V-A6 d05) — 긍정 트리(`deployment.yaml`·`rbac.yaml`은
#   positive 사본)의 Deployment reloader/reloader `containers[0]` 자리에 **미끼 컨테이너**(pause 이미지 · 기대 args 그대로)를 넣었다.
#   진짜 Reloader는 `containers.1`로 밀려나 `--namespaces=cloudflared`로 돈다. 10.2는 `containers[0]`의 args를 보므로 미끼가 통과시키고,
#   이 결함을 잡는 것은 10.4 REL-image의 **위치 판정**(Reloader 이미지 컨테이너 = containers.0) 하나뿐이다 — 그 분기를 지우면 이 트리가
#   통과하도록(단언이 그 문구에 고유하도록) 만든 픽스처다. 10.4 REL-image만 FAIL해야 한다. helm·네트워크가 필요 없다.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - deployment.yaml
  - rbac.yaml
patches:
  - target: { kind: Deployment, name: reloader, namespace: reloader }
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/args
        value: [--namespaces=cloudflared]
      - op: add
        path: /spec/template/spec/containers/0
        value:
          name: decoy
          image: registry.k8s.io/pause:3.10@sha256:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          args: [--log-level=info, "--namespaces=identity,jt-dev,jt-prod,reloader", --reload-strategy=annotations]
