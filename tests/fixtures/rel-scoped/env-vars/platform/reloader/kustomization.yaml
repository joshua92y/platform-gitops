# 부정 픽스처 10.2 REL-args-exact(env-vars) — `reloadStrategy: env-vars`.
#   ClusterRole 0 · 감시 ns · kind 개수 · RBAC는 계약과 같고, 인자 `--reload-strategy=env-vars`만 계약(`annotations` — 파드 템플릿
#   어노테이션만 바꾸는 전략)과 달라 10.2(목록 불일치 — 단서 없음)만 FAIL해야 한다.
#   실제 kustomization과 values 한 줄만 다르게 둔다.
#   helmCharts가 있으므로 이 픽스처는 helm과 네트워크(차트 pull)가 필요하다 — tests/fixtures/pol-port와 같다.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
helmCharts:
  - name: reloader
    repo: https://stakater.github.io/stakater-charts
    version: 2.2.16
    releaseName: reloader
    namespace: reloader
    includeCRDs: false
    valuesInline:
      fullnameOverride: reloader
      reloader:
        watchGlobally: false
        namespaces: [identity, jt-dev, jt-prod]
        reloadStrategy: env-vars
