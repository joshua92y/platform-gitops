# 부정 픽스처 10.2 REL-args-exact(args-order) — 긍정 트리(`deployment.yaml`·`rbac.yaml`·`vd9-probe.yaml`은 positive 사본)의 Reloader
#   args 세 개의 **순서만** 바꿨다(값·개수는 같다). 순서 자체는 오늘 동작을 바꾸지 않지만, 계약은 목록 **정확 일치**(순서 포함)다 —
#   순서까지 고정해야 "값 없는 플래그가 뒤 인자를 삼킨다" 같은 위치 의존 결함을 한 가지 비교로 닫는다. 집합 비교였다면 PASS다.
#   10.2 REL-args-exact(목록 불일치 — 단서 없음)만 FAIL해야 한다. helm·네트워크가 필요 없다.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - deployment.yaml
  - rbac.yaml
  - vd9-probe.yaml
patches:
  - target: { kind: Deployment, name: reloader, namespace: reloader }
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/args
        value:
          - --namespaces=identity,jt-dev,jt-prod,reloader
          - --log-level=info
          - --reload-strategy=annotations
