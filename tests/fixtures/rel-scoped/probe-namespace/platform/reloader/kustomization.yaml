# 부정 픽스처 10.3 REL-probe(probe-namespace · 2026-09-28 검증 V-A8 d02) — 긍정 트리(`deployment.yaml`·`rbac.yaml`·`vd9-probe.yaml`은
#   positive 사본)의 VD-9 시험 대상 `vd9-probe`를 ns `reloader`로 옮겼다. 실제 트리에 최상위 `namespace: reloader` 변환기를 두면
#   kustomize 5.8.1은 차트 객체의 ns는 그대로 두고(`helmCharts[].namespace`가 정한다) **이 Deployment만** 옮긴다 — 그 결과와 같은
#   모양이다(순수 매니페스트 트리에 변환기를 두면 ID 충돌로 빌드가 실패하므로 ns를 직접 바꿨다). Secret `vd9-probe`가 없는 ns라
#   시험이 성립하지 않는다. kind 개수는 그대로라 10.3 REL-probe만 FAIL해야 한다. helm·네트워크가 필요 없다.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - deployment.yaml
  - rbac.yaml
  - vd9-probe.yaml
patches:
  - target: { kind: Deployment, name: vd9-probe }
    patch: |-
      - op: replace
        path: /metadata/namespace
        value: reloader
