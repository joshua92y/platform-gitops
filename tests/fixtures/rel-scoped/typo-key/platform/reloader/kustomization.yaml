# 부정 픽스처 10.0 REL-render(typo-key) — values 키 오타 `watchGlobaly: false`(한 글자 누락).
#   차트 기본값 `watchGlobally: true`가 살아나고 `namespaces`는 그대로라, 차트의 가드
#   ("reloader.namespaces is set but reloader.watchGlobally is true")가 렌더를 `fail`로 멈춘다(2026-09-22 실측).
#   → 검사 1이 빌드 실패로 FAIL하고, 검사 10은 판정할 렌더가 없으므로 fail-closed로 FAIL해야 한다.
#   (같은 오타라도 `namespaces`까지 함께 빠지면 렌더가 **성공한 채** 전역 모드가 된다 — 그 경우는 typo-parent.)
#   helmCharts가 있으므로 이 픽스처는 helm과 네트워크(차트 pull)가 필요하다 — tests/fixtures/pol-port와 같다.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
helmCharts:
  - name: reloader
    repo: https://stakater.github.io/stakater-charts
    version: 2.2.16
    releaseName: reloader
    namespace: reloader
    includeCRDs: false
    valuesInline:
      fullnameOverride: reloader
      reloader:
        watchGlobaly: false
        namespaces: [identity, jt-dev, jt-prod]
        reloadStrategy: annotations
