# 부정 픽스처 10.2 REL-args-exact(extra-arg · 2026-09-28 검증 V-A9 a12) — 긍정 트리(`deployment.yaml`·`rbac.yaml`은
#   positive 사본)의 Reloader args 끝에 여분 인자 `--auto-reload-all=true`를 더했다. 감시 ns·RBAC는 그대로지만 어노테이션이 없는
#   워크로드도 참조 Secret이 바뀌면 재시작된다(계약은 `reloader.stakater.com/auto` 어노테이션). 예전 10.2·10.3은 PASS였다.
#   10.2 REL-args-exact(목록 불일치 — 단서 없음)만 FAIL해야 한다. helm·네트워크가 필요 없다.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - deployment.yaml
  - rbac.yaml
patches:
  - target: { kind: Deployment, name: reloader, namespace: reloader }
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/args/-
        value: --auto-reload-all=true
