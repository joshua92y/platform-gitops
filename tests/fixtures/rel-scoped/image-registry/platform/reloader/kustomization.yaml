# 부정 픽스처 10.4 REL-image(image-registry · 2026-09-28 검증 V-A6) — 긍정 트리(`deployment.yaml`·`rbac.yaml`·`vd9-probe.yaml`은
#   positive 사본)의 Reloader 이미지를 `docker.io/stakater/reloader`로 바꿨다(같은 이름의 다른 레지스트리 — 계약·digest 핀은
#   ghcr.io). 개수·위치·args는 그대로라 10.4 REL-image의 **저장소 판정**(= REL_IMAGE_REPO) 하나만 잡는다 — 그 분기를 지우면 이 트리가
#   통과하도록 만든 픽스처다. 10.4 REL-image만 FAIL해야 한다. helm·네트워크가 필요 없다.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - deployment.yaml
  - rbac.yaml
  - vd9-probe.yaml
patches:
  - target: { kind: Deployment, name: reloader, namespace: reloader }
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/image
        value: docker.io/stakater/reloader:v1.4.21@sha256:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
