# 부정 픽스처 10.0 REL-render(no-deployment) — 렌더는 성공하지만 Deployment reloader/reloader가 없다(`resources: []` 뼈대).
#   판정할 인자가 없으므로 검사 10은 PASS가 아니라 fail-closed로 FAIL해야 한다(뼈대로 되돌리는 revert · fullnameOverride를
#   빠뜨려 이름이 `reloader-reloader`가 되는 경우와 같은 자리). helm·네트워크가 필요 없다.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources: []
