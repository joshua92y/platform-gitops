# 긍정 픽스처 — Reloader ServiceAccount·Role·RoleBinding(차트 2.2.16 scoped 모드 렌더의 판정 대상 필드만).
#   검사 10.3 REL-kinds가 ServiceAccount 1 · Role 5 · RoleBinding 5를, 10.4 REL-rbac-ns가 kind마다 ns 집합 = 계약 목록
#   (identity·jt-dev·jt-prod) + 릴리스 ns(reloader)를, 10.4 REL-rbac-bind가 모든 RoleBinding의 roleRef(같은 ns의 Role)·subjects
#   (정확히 ServiceAccount reloader/reloader)를, 10.4 REL-rbac-rules가 `reloader-role` 4장의 rules 동일·와일드카드 없음을 요구한다.
#   규칙은 차트의 첫 규칙 하나만 둔다(4장이 같으면 된다 — 실제 규칙은 platform/reloader/README.md §2).
#   tests/fixtures/rel-scoped/의 순수 매니페스트 케이스(helm을 쓰지 않는 것 전부)의 rbac.yaml은 이 파일의 사본이다.
apiVersion: v1
kind: ServiceAccount
metadata: { name: reloader, namespace: reloader }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: { name: reloader-role, namespace: identity }
rules:
  - { apiGroups: [""], resources: [secrets, configmaps], verbs: [get, list, watch] }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: { name: reloader-role, namespace: jt-dev }
rules:
  - { apiGroups: [""], resources: [secrets, configmaps], verbs: [get, list, watch] }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: { name: reloader-role, namespace: jt-prod }
rules:
  - { apiGroups: [""], resources: [secrets, configmaps], verbs: [get, list, watch] }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: { name: reloader-role, namespace: reloader }
rules:
  - { apiGroups: [""], resources: [secrets, configmaps], verbs: [get, list, watch] }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: { name: reloader-metadata-role, namespace: reloader }
rules:
  - { apiGroups: [""], resources: [configmaps], verbs: [list, get, watch, create, update] }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: { name: reloader-role-binding, namespace: identity }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: reloader-role }
subjects:
  - { kind: ServiceAccount, name: reloader, namespace: reloader }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: { name: reloader-role-binding, namespace: jt-dev }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: reloader-role }
subjects:
  - { kind: ServiceAccount, name: reloader, namespace: reloader }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: { name: reloader-role-binding, namespace: jt-prod }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: reloader-role }
subjects:
  - { kind: ServiceAccount, name: reloader, namespace: reloader }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: { name: reloader-role-binding, namespace: reloader }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: reloader-role }
subjects:
  - { kind: ServiceAccount, name: reloader, namespace: reloader }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: { name: reloader-metadata-role-binding, namespace: reloader }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: reloader-metadata-role }
subjects:
  - { kind: ServiceAccount, name: reloader, namespace: reloader }
