# crd-schema/reject — ../../repo-first/platform/barman-crd/crd.yaml 과 같은 최소 CRD(설명은 그쪽). 두 트리가 같은 스키마를 파생하고 CR 값만 다르다.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: objectstores.barmancloud.cnpg.io
spec:
  group: barmancloud.cnpg.io
  names:
    kind: ObjectStore
    listKind: ObjectStoreList
    plural: objectstores
    singular: objectstore
  scope: Namespaced
  versions:
    - name: v1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          description: ObjectStore is the Schema for the objectstores API.
          type: object
          required:
            - metadata
            - spec
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              required:
                - configuration
              properties:
                configuration:
                  type: object
                  required:
                    - destinationPath
                  properties:
                    destinationPath:
                      type: string
                      minLength: 1
                    data:
                      type: object
                      properties:
                        compression:
                          type: string
                          enum:
                            - bzip2
                            - gzip
                            - lz4
                            - snappy
