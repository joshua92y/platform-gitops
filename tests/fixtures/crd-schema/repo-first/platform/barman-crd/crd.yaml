# crd-schema/repo-first — 최소 CRD: 실제 ObjectStore CRD(plugin-barman-cloud 0.7.1 · appVersion v0.14.0 — 업스트림 v0.14.0 CRD와 openAPIV3Schema 동일)의
#   해당 부분 모양만 따른다: group · names · scope · 버전 v1 served/storage · openAPIV3Schema의 spec.configuration.destinationPath(string · required) ·
#   spec.configuration.data.compression(enum bzip2·gzip·lz4·snappy). 나머지 필드(s3Credentials · wal · instanceSidecarConfiguration …)는 넣지 않는다.
#   검사 1이 이 문서에서 <임시 디렉터리>/barmancloud.cnpg.io/objectstore_v1.json 을 파생해 kubeconform의 datreeio 앞 위치로 쓴다.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: objectstores.barmancloud.cnpg.io
spec:
  group: barmancloud.cnpg.io
  names:
    kind: ObjectStore
    listKind: ObjectStoreList
    plural: objectstores
    singular: objectstore
  scope: Namespaced
  versions:
    - name: v1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          description: ObjectStore is the Schema for the objectstores API.
          type: object
          required:
            - metadata
            - spec
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              required:
                - configuration
              properties:
                configuration:
                  type: object
                  required:
                    - destinationPath
                  properties:
                    destinationPath:
                      type: string
                      minLength: 1
                    data:
                      type: object
                      properties:
                        compression:
                          type: string
                          enum:
                            - bzip2
                            - gzip
                            - lz4
                            - snappy
