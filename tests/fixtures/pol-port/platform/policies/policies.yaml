# 부정 픽스처 5.4 POL-port-table — vault ns 정책이 8201만 열어 각주 포트 8200이 ingress ports에 없음
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: allow-apiserver-webhook, namespace: vault }
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from: [{ ipBlock: { cidr: 10.0.0.10/32 } }]
      ports: [{ protocol: TCP, port: 8201 }]
