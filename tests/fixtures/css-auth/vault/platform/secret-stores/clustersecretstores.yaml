# 부정 픽스처 — 검사 9의 vault provider 위반 4종(9.1 CSS-namespace · 9.2 CSS-auth-referent/-audience/-map)
# store 이름 집합은 계약 5개 그대로라 9.1 CSS-set은 여기서 걸리지 않는다(그건 css-auth/k8s 픽스처가 본다).
#
# ① vault-platform: metadata.namespace 있음 → 클러스터 범위 CR에 ns가 찍혀 영구 OutOfSync
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata: { name: vault-platform, namespace: external-secrets }
spec:
  conditions:
    - namespaces: [kube-system, argocd, vault, external-secrets, cert-manager, cnpg-system, data, identity, monitoring, system-upgrade, cloudflared, reloader]
  provider:
    vault:
      server: http://vault.vault.svc:8200
      path: kv
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: eso-platform
          serviceAccountRef: { name: eso-platform, namespace: external-secrets, audiences: [vault] }
---
# ② vault-dev: serviceAccountRef.namespace 생략 → referent auth(로그인 없이 Ready=True/Valid 가짜 PASS)
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata: { name: vault-dev }
spec:
  conditions:
    - namespaces: [jt-dev]
  provider:
    vault:
      server: http://vault.vault.svc:8200
      path: kv
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: eso-dev
          serviceAccountRef: { name: eso-dev, audiences: [vault] }
---
# ③ vault-prod: audiences 오기 → Vault가 403 invalid audience (aud) claim
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata: { name: vault-prod }
spec:
  conditions:
    - namespaces: [jt-prod]
  provider:
    vault:
      server: http://vault.vault.svc:8200
      path: kv
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: eso-prod
          serviceAccountRef: { name: eso-prod, namespace: external-secrets, audiences: [kubernetes] }
---
# ④ vault-data: role·SA가 vault-dev 것으로 뒤바뀜 → 계약 §ClusterSecretStore 표의 store↔SA/role 매핑 위반
#    (이 store가 eso-dev 권한으로 dev 경로를 읽게 된다)
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata: { name: vault-data }
spec:
  conditions:
    - namespaces: [data, identity]
  provider:
    vault:
      server: http://vault.vault.svc:8200
      path: kv
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: eso-dev
          serviceAccountRef: { name: eso-dev, namespace: external-secrets, audiences: [vault] }
---
# ⑤ k8s-data-ca: 정상(이 픽스처에서는 9.3이 걸리지 않아야 한다 — 집합만 채운다)
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata: { name: k8s-data-ca }
spec:
  conditions:
    - namespaces: [identity, jt-dev, jt-prod]
  provider:
    kubernetes:
      remoteNamespace: data
      server:
        url: https://kubernetes.default.svc:443
        caProvider: { type: ConfigMap, name: kube-root-ca.crt, key: ca.crt, namespace: external-secrets }
      auth:
        serviceAccount: { name: eso-ca-reader, namespace: external-secrets }
