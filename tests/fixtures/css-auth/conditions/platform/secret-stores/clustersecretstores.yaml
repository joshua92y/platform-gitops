# 부정 픽스처 — 검사 9.4(conditions)와 9.3 CSS-k8s-remote.
# provider·auth·이름 집합은 전부 정상이라 9.1·9.2와 9.3의 나머지 코드는 여기서 걸리지 않아야 한다.
#
# ① vault-platform: conditions 자체가 없음 → 전 네임스페이스가 이 store를 쓸 수 있게 된다
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata: { name: vault-platform }
spec:
  provider:
    vault:
      server: http://vault.vault.svc:8200
      path: kv
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: eso-platform
          serviceAccountRef: { name: eso-platform, namespace: external-secrets, audiences: [vault] }
---
# ② vault-dev: 참조 허용 ns에 jt-prod가 더 붙음 → dev store로 prod ns가 비밀을 읽는다
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata: { name: vault-dev }
spec:
  conditions:
    - namespaces: [jt-dev, jt-prod]
  provider:
    vault:
      server: http://vault.vault.svc:8200
      path: kv
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: eso-dev
          serviceAccountRef: { name: eso-dev, namespace: external-secrets, audiences: [vault] }
---
# ③ vault-prod: namespaces 대신 namespaceSelector → 라벨이 붙는 ns가 늘면 조용히 범위가 넓어진다
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata: { name: vault-prod }
spec:
  conditions:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: jt-prod
  provider:
    vault:
      server: http://vault.vault.svc:8200
      path: kv
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: eso-prod
          serviceAccountRef: { name: eso-prod, namespace: external-secrets, audiences: [vault] }
---
# ④ vault-data: 같은 ns가 두 번 → 집합으로는 맞아 보이지만 목록이 어긋난 상태
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata: { name: vault-data }
spec:
  conditions:
    - namespaces: [data, data, identity]
  provider:
    vault:
      server: http://vault.vault.svc:8200
      path: kv
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: eso-data
          serviceAccountRef: { name: eso-data, namespace: external-secrets, audiences: [vault] }
---
# ⑤ k8s-data-ca: conditions는 정상이고 remoteNamespace만 CRD 기본값 그대로 'default'
#    → 9.3 CSS-k8s-default(생략)로는 잡히지 않는다. 값 비교가 필요한 자리다.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata: { name: k8s-data-ca }
spec:
  conditions:
    - namespaces: [identity, jt-dev, jt-prod]
  provider:
    kubernetes:
      remoteNamespace: default
      server:
        url: https://kubernetes.default.svc:443
        caProvider: { type: ConfigMap, name: kube-root-ca.crt, key: ca.crt, namespace: external-secrets }
      auth:
        serviceAccount: { name: eso-ca-reader, namespace: external-secrets }
