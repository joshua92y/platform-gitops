# 부정 픽스처 — 9.1 CSS-location: ClusterSecretStore가 platform/secret-stores/ 밖에 있다.
# 이름도 계약 5개 밖(`vault-stray`)이라 9.1 CSS-set의 '표에 없는 이름'도 함께 걸린다.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata: { name: vault-stray }
spec:
  provider:
    vault:
      server: http://vault.vault.svc:8200
      path: kv
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: eso-platform
          serviceAccountRef: { name: eso-platform, namespace: external-secrets, audiences: [vault] }
