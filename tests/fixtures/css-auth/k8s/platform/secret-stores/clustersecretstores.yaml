# 부정 픽스처 — 검사 9의 kubernetes provider 위반 + 집합/위치 위반
#   (9.3 CSS-k8s-audience · 9.3 CSS-k8s-auth · 9.3 CSS-k8s-default · 9.1 CSS-set)
# 여기에는 vault store가 **3장뿐**이다(vault-data 누락) → 9.1 CSS-set이 빠짐을 잡는다.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata: { name: vault-platform }
spec:
  conditions:
    - namespaces: [kube-system, argocd, vault, external-secrets, cert-manager, cnpg-system, data, identity, monitoring, system-upgrade, cloudflared, reloader]
  provider:
    vault:
      server: http://vault.vault.svc:8200
      path: kv
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: eso-platform
          serviceAccountRef: { name: eso-platform, namespace: external-secrets, audiences: [vault] }
---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata: { name: vault-dev }
spec:
  conditions:
    - namespaces: [jt-dev]
  provider:
    vault:
      server: http://vault.vault.svc:8200
      path: kv
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: eso-dev
          serviceAccountRef: { name: eso-dev, namespace: external-secrets, audiences: [vault] }
---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata: { name: vault-prod }
spec:
  conditions:
    - namespaces: [jt-prod]
  provider:
    vault:
      server: http://vault.vault.svc:8200
      path: kv
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: eso-prod
          serviceAccountRef: { name: eso-prod, namespace: external-secrets, audiences: [vault] }
---
# k8s-data-ca 위반 3종을 한 문서에:
#   - auth에 키 2개(serviceAccount + token) → CRD는 정확히 하나만 허용
#   - serviceAccount에 audiences → apiserver에 bearer로 제시되므로 401
#   - remoteNamespace 생략(기본값 `default`) · server.url 생략(기본값 `kubernetes.default`) · caProvider.namespace 생략
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata: { name: k8s-data-ca }
spec:
  conditions:
    - namespaces: [identity, jt-dev, jt-prod]
  provider:
    kubernetes:
      server:
        caProvider: { type: ConfigMap, name: kube-root-ca.crt, key: ca.crt }
      auth:
        serviceAccount: { name: eso-ca-reader, namespace: external-secrets, audiences: [vault] }
        token: { bearerToken: { name: placeholder-not-a-secret, key: token } }
