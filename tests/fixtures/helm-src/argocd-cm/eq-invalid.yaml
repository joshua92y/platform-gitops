# 12.4 변형 eq-invalid — `--enable-helm=yes`: pflag는 불리언 플래그의 값을 strconv.ParseBool로 읽는데 yes는 참·거짓 낱말이 아니다(1 · t · T · TRUE ·
#   true · True / 0 · f · F · FALSE · false · False만). 읽지 못하면 인자 해석이 그 자리에서 멈춰 kustomize build가 실패한다 — 뒤의 맨 `--enable-helm`은
#   소용이 없다(마지막 낱말만 보는 판정은 이 설정을 통과시킨다)
apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-cm
data:
  kustomize.buildOptions: "--enable-helm=yes --enable-helm"
