# 부정 픽스처 12.1 HELM-repo — helmCharts 항목마다 (name, repo) 쌍을 허용 목록과 글자 단위로 대조한다.
#   #1 목록 밖 저장소(이름도 목록 밖) · #2 이름은 맞고 저장소가 다름 · #3 저장소는 맞고 이름이 다름 · #4 repo 끝에 '/' 하나 더 ·
#   #5 repo 없음(로컬 차트) · #6 name 없음 · #7 허용 쌍(걸리지 않아야 한다). 모든 항목에 version이 있다(12.2는 걸리지 않는다).
#   12.1에 걸린 kustomization은 검사 1이 렌더하지 않는다 — 이 픽스처는 helm·네트워크 없이 돈다(차트를 받으러 나가지 않는다).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
helmCharts:
  - name: mystery-chart
    repo: https://charts.example.invalid
    version: 0.0.1
    releaseName: mystery
  - name: cert-manager
    repo: https://charts.jetstack.io
    version: v1.21.1
    releaseName: cm-http
  - name: cert-manager-csi-driver
    repo: oci://quay.io/jetstack/charts
    version: v0.13.0
    releaseName: csi
  - name: cert-manager
    repo: oci://quay.io/jetstack/charts/
    version: v1.21.1
    releaseName: cm-slash
  - name: cert-manager
    version: v1.21.1
    releaseName: cm-local
  - repo: oci://quay.io/jetstack/charts
    version: v1.21.1
    releaseName: nameless
  - name: cert-manager
    repo: oci://quay.io/jetstack/charts
    version: v1.21.1
    releaseName: cert-manager
    namespace: cert-manager
