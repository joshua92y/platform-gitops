# 부정 픽스처 5.5 POL-limitrange — default.cpu · max.cpu 지정(CPU limit 금지 위반)
apiVersion: v1
kind: LimitRange
metadata: { name: defaults, namespace: jt-dev }
spec:
  limits:
    - type: Container
      defaultRequest: { cpu: 50m, memory: 128Mi }
      default: { cpu: 500m, memory: 256Mi }
      max: { cpu: "2" }
