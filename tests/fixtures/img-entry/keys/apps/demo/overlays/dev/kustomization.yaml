# 부정 픽스처 4a IMG-keys — images 항목의 키가 {name, newName, digest} 밖이거나 중복
#   #1 tagSuffix · #2 키 오타 digset(digest가 없어지므로 4a IMG-digest도 걸린다)
#   #3 newTag: ~(null — 기존 4a IMG-newTag는 '없음'으로 읽어 찍지 않는다 → IMG-keys가 newTag를 찍는다)
#   #4 digest 키 중복(yq와 kustomize는 뒤의 값을 쓴다 — 뒤의 값은 형식이 맞으므로 IMG-digest는 걸리지 않는다)
#   #5 newTag: v1(기존 4a IMG-newTag가 찍는다 — IMG-keys는 newTag를 다시 찍지 않는다)
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources: []
images:
  - name: ghcr.io/joshua92y/demo-a
    digest: sha256:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
    tagSuffix: -debug
  - name: ghcr.io/joshua92y/demo-b
    digset: sha256:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
  - name: ghcr.io/joshua92y/demo-c
    newTag: ~
    digest: sha256:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
  - name: ghcr.io/joshua92y/demo-d
    digest: sha256:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
    digest: sha256:fedcba9876543210fedcba9876543210fedcba9876543210fedcba9876543210
  - name: ghcr.io/joshua92y/demo-e
    newName: ghcr.io/joshua92y/demo-e
    newTag: v1
    digest: sha256:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
