# 부정 픽스처 4a IMG-name — images 항목의 name이 없거나 빈 값이거나 문자열이 아님
#   #1 name 없음(newName + digest) · #2 name: "" · #3 name: 7(정수) · #4 name이 목록
#   #5 name: "-" — 문자열 '-'는 통과한다(기존 추출은 name이 없을 때 '-'를 채웠다 — "없음"과 "값이 '-'"를 구분하는지 본다. 걸리지 않아야 한다)
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources: []
images:
  - newName: ghcr.io/joshua92y/demo
    digest: sha256:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
  - name: ""
    digest: sha256:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
  - name: 7
    digest: sha256:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
  - name: [ghcr.io/joshua92y/demo]
    digest: sha256:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
  - name: "-"
    digest: sha256:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
