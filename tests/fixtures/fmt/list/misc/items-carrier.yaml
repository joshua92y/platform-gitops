# 부정 픽스처 11.1 FMT-list(보강) — kind는 ConfigMap이지만 최상위 items가 목록이다.
#   Argo는 kind와 무관하게 최상위 items 목록을 풀어 원소(여기서는 Role)를 적용하고 감싼 ConfigMap은 버린다
#   (argo-cd v3.5.2 reposerver/repository/repository.go GenerateManifests `case obj.IsList():` — apimachinery IsList는 items가
#   목록인지만 본다). kustomize는 이 문서를 ConfigMap 그대로 내보내므로 렌더를 보는 검사도 Role을 보지 못한다.
apiVersion: v1
kind: ConfigMap
metadata:
  name: carrier
  namespace: cloudflared
items:
  - apiVersion: rbac.authorization.k8s.io/v1
    kind: Role
    metadata:
      name: hidden-in-items
      namespace: cloudflared
    rules:
      - apiGroups: [""]
        resources: [secrets]
        verbs: [get, list]
