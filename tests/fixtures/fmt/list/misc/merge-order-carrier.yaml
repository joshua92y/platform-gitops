# 부정 픽스처 11.1 FMT-list(병합 키의 우선순위 — 판정 의미를 고정하는 장치) — 명시한 `items: null`이 병합 키 `<<: *m`보다 **앞**에 있고,
#   병합 원본은 items 목록을 가진다. Argo의 디코더(sigs.k8s.io/yaml — go-yaml v2)는 키를 문서 순서대로 쓰므로 뒤에 온 병합의 목록이 이긴다
#   (IsList → 안의 Namespace 적용). yq v4.53.6의 explode 기본값(`--yaml-fix-merge-anchor-to-spec=false` — 병합이 먼저 있던 값을 덮는다)이 같은
#   의미라 11.1이 건다. yq를 올려 기본값이 스펙 모드(명시 키 우선)로 바뀌면 이 문서는 items null로 읽혀 단언이 깨진다 — 그때 판정 방법을 다시 정한다.
apiVersion: v1
kind: ConfigMap
metadata:
  name: merge-order-carrier
  namespace: cloudflared
  annotations:
    hold: &m
      items:
        - apiVersion: v1
          kind: Namespace
          metadata: { name: merge-smuggled }
items: null
<<: *m
