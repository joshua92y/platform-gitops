# 경계 픽스처(통과) 11.x — root Application. clusters/oci-k3s/apps 는 directory source 경로다.
#   이 트리는 검사 11의 "통과해야 하는 것"만 모았다 — 11.1–11.4의 PASS 줄(개수 포함)을 단언한다.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
spec:
  project: platform
  source:
    repoURL: https://github.com/joshua92y/platform-gitops.git
    targetRevision: main
    path: clusters/oci-k3s/apps
  destination: { server: https://kubernetes.default.svc, namespace: argocd }
  syncPolicy:
    automated: { prune: false, selfHeal: true }
    syncOptions: [ServerSideApply=true]
