# 부정 픽스처 11.0 FMT-alias(fail-closed) — 병합 키가 맵이 아닌 값(문자열 앵커)을 가리킨다. YAML 구문은 맞아 파싱(검사 0)은 되지만
#   yq explode(.)는 풀지 못하고 멈춘다("can only use merge anchors with maps"). 풀지 못한 문서는 목록 객체인지 판정할 수 없으므로 FAIL이다.
#   (Argo의 디코더 go-yaml v2도 이 문서를 거부한다 — 적용되지 않는 문서지만, 판정할 수 없는 것을 통과시키지 않는다.)
apiVersion: v1
kind: ConfigMap
metadata:
  name: unresolvable-merge
  namespace: cloudflared
  annotations:
    note: &s just-a-string
<<: *s
