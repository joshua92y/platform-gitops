# 부정 픽스처 7.3 — 이 ExternalSecret은 git에만 있고 클러스터에는 영영 오지 않는다(배달자에 줄이 없다)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: { name: example-token, namespace: data }
spec:
  refreshPolicy: Periodic
  refreshInterval: 5m
  secretStoreRef: { kind: ClusterSecretStore, name: vault-platform }
  target: { name: example-token, creationPolicy: Orphan, deletionPolicy: Retain }
  data:
    - secretKey: token
      remoteRef: { key: platform/example/token, property: token }
