# 긍정 픽스처 — 플랫폼 Application 19개(계약 §sync-wave 단일 표 그대로). 실제 트리는 컴포넌트당 파일 1개.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-argocd
  namespace: argocd
  annotations: { argocd.argoproj.io/sync-wave: "-20" }
spec:
  project: platform
  source: { repoURL: https://github.com/joshua92y/platform-gitops.git, targetRevision: main, path: bootstrap/argocd }
  destination: { server: https://kubernetes.default.svc, namespace: argocd }
  syncPolicy:
    automated: { prune: false, selfHeal: true }
    syncOptions: [ServerSideApply=true, CreateNamespace=true, Prune=confirm, Delete=confirm, SkipDryRunOnMissingResource=true]
---
