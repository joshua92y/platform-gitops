# 긍정 픽스처 — 앱 Application <pod>-dev(T075 · 계약 §Application 규약 syncPolicy 행 「앱 Application의 정확한 꼴」 · validate 14.0):
#   파일 하나에 문서 하나 · metadata.name = 파일 이름 · namespace argocd · finalizer 하나 · spec 키 넷 · project = env · destination jt-dev ·
#   syncPolicy = automated {prune: true, selfHeal: true} + syncOptions [ServerSideApply=true]뿐.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: identity-admin-dev
  namespace: argocd
  annotations: { argocd.argoproj.io/sync-wave: "100" }
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: dev
  source: { repoURL: https://github.com/joshua92y/platform-gitops.git, targetRevision: main, path: apps/identity-admin/overlays/dev }
  destination: { server: https://kubernetes.default.svc, namespace: jt-dev }
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [ServerSideApply=true]
