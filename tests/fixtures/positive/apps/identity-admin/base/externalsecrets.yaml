# 긍정 픽스처 — pod마다 ExternalSecret 2개(<pod>-env · <pod>-migrate). base는 dev 값, prod overlay가 store·key를 패치한다.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: identity-admin-env
spec:
  refreshInterval: 5m
  secretStoreRef: { kind: ClusterSecretStore, name: vault-dev }
  target: { name: identity-admin-env, creationPolicy: Owner }
  data:
    - secretKey: DATABASE_URL
      remoteRef: { key: dev/db/identity_admin/app, property: url }
    - secretKey: KAFKA_PASSWORD
      remoteRef: { key: dev/kafka/identity_admin, property: password }
    - secretKey: AUTHENTIK_WEBHOOK_SECRET
      remoteRef: { key: dev/authentik/webhooks/identity-admin, property: secret }
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: identity-admin-migrate
spec:
  refreshInterval: 5m
  secretStoreRef: { kind: ClusterSecretStore, name: vault-dev }
  target: { name: identity-admin-migrate, creationPolicy: Owner }
  data:
    - secretKey: DATABASE_URL
      remoteRef: { key: dev/db/identity_admin/owner, property: url }
