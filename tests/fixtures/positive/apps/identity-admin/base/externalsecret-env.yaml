# identity-admin 런타임 비밀 → Secret identity-admin-env(web · relay · celery · initContainer envFrom). 일반 리소스(hook 아님) · sync-wave -1.
# data[] 순번은 overlay 인덱스 패치의 인터페이스다 — prod overlay는 인덱스 replace마다 앞에 op: test(path /spec/data/N/secretKey ·
# value <이름>)를 둔다. 새 항목은 끝(8번부터)에만 덧붙인다. DB URL은 role 이름(<db>_app)에서 DB 이름을 파생해 조립한다(prod overlay가
# URL 문자열을 패치하지 않는다 · TLS 매개변수는 매니페스트가 보장한다).
# identity-admin(T073) — 8–11 = Authentik API 토큰 · 웹훅 비밀 · OpenFGA store id · preshared 키(설계 D23 · contracts/gitops-repo.md
# 「pod마다 ExternalSecret 2개」 행). 그다음 새 항목은 12번부터다.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: identity-admin-env
  labels:
    app.kubernetes.io/name: identity-admin
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 5m
  refreshPolicy: Periodic
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-dev
  target:
    name: identity-admin-env
    creationPolicy: Owner
    template:
      engineVersion: v2
      mergePolicy: Replace
      data:
        DATABASE_URL: 'postgresql://{{ .db_username }}:{{ .db_password }}@pg-main-rw.data.svc:5432/{{ .db_username | trimSuffix "_app" }}?sslmode=verify-full&sslrootcert=/etc/pg/ca.crt'
        KAFKA_PASSWORD: '{{ .kafka_password }}'
        DRAGONFLY_URL: '{{ .dragonfly_url }}'
        AUTHENTIK_ISSUER: '{{ .authentik_issuer }}'
        AUTHENTIK_JWKS_URL: '{{ .authentik_jwks_url }}'
        SENTRY_DSN: '{{ .sentry_dsn }}'
        SECRET_KEY: '{{ .secret_key }}'
        # identity-admin(T073) — 전용 비밀 셋 + store id(설계 D23 · contracts/identity-admin-api.md §identity-admin 전용 설정)
        AUTHENTIK_API_TOKEN: '{{ .authentik_api_token }}'
        AUTHENTIK_WEBHOOK_SECRET: '{{ .authentik_webhook_secret }}'
        OPENFGA_STORE_ID: '{{ .openfga_store_id }}'
        OPENFGA_PRESHARED_KEY: '{{ .openfga_preshared_key }}'
  data:
    - secretKey: db_username
      remoteRef:
        key: dev/db/dev_identity_admin/app
        property: username
    - secretKey: db_password
      remoteRef:
        key: dev/db/dev_identity_admin/app
        property: password
    - secretKey: kafka_password
      remoteRef:
        key: dev/kafka/identity-admin
        property: password
    - secretKey: dragonfly_url
      remoteRef:
        key: dev/dragonfly/identity-admin
        property: url
    - secretKey: authentik_issuer
      remoteRef:
        key: dev/authentik/identity-admin
        property: issuer
    - secretKey: authentik_jwks_url
      remoteRef:
        key: dev/authentik/identity-admin
        property: jwks_url
    - secretKey: sentry_dsn
      remoteRef:
        key: dev/sentry/identity-admin
        property: dsn
    - secretKey: secret_key
      remoteRef:
        key: dev/django/identity-admin
        property: secret_key
    # identity-admin(T073) — data[8..11](설계 D23 표 · 끝에만 덧붙였다 — 0–7의 순번은 그대로). client_id · client_secret은 매핑하지
    # 않는다(pod에 그 설정이 없다 — 최소 노출 · C26)
    - secretKey: authentik_api_token
      remoteRef:
        key: dev/authentik/identity-admin
        property: api_token
    - secretKey: authentik_webhook_secret
      remoteRef:
        key: dev/authentik/webhooks/identity-admin
        property: secret
    - secretKey: openfga_store_id
      remoteRef:
        key: dev/openfga/store_id
        property: store_id
    - secretKey: openfga_preshared_key
      remoteRef:
        key: dev/openfga/preshared
        property: key
