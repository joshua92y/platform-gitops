# identity-admin owner DB 자격 → Secret identity-admin-migrate(PreSync migrate Job 전용 — 런타임 envFrom에 두지 않는다).
# 자신도 PreSync hook(wave -1 · BeforeHookCreation)이라 첫 배포에 Job(wave 0)보다 먼저 Secret이 생긴다. hook 리소스는 Argo 추적 밖이다 —
# hook만 바뀐 변경은 전체 수동 Sync · 상태는 Application health 밖(kubectl get externalsecret identity-admin-migrate) · 전체 sync마다
# Secret이 지워졌다 다시 생긴다. Healthy가 되지 않을 때는 두 갈래다(Argo CD v3.5.2): ① ES Degraded(kv 누락 · Vault · store 오류 — 위
# 명령의 Ready=False 메시지) = operation Failed → 자동 재시도(기본 창 ≈ 5분)가 다하면 같은 리비전은 자동 sync되지 않는다 → 원인 해소 뒤
# 전체 수동 Sync ② ES 상태 없음(ESO 중단 — Progressing) = operation이 무기한 Running → terminate → ESO 복구 → 전체 수동 Sync
# (README 「deploy/base 인터페이스」).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: identity-admin-migrate
  labels:
    app.kubernetes.io/name: identity-admin
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 5m
  refreshPolicy: Periodic
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-dev
  target:
    name: identity-admin-migrate
    creationPolicy: Owner
    template:
      engineVersion: v2
      mergePolicy: Replace
      data:
        DATABASE_OWNER_URL: 'postgresql://{{ .db_username }}:{{ .db_password }}@pg-main-rw.data.svc:5432/{{ .db_username | trimSuffix "_owner" }}?sslmode=verify-full&sslrootcert=/etc/pg/ca.crt'
  data:
    - secretKey: db_username
      remoteRef:
        key: dev/db/dev_identity_admin/owner
        property: username
    - secretKey: db_password
      remoteRef:
        key: dev/db/dev_identity_admin/owner
        property: password
