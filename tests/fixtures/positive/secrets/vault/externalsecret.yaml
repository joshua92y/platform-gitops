# 긍정 픽스처 — secrets/vault ExternalSecret(vault-platform + platform/ 접두)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: { name: vault-backup-oci }
spec:
  refreshInterval: 5m
  secretStoreRef: { kind: ClusterSecretStore, name: vault-platform }
  target: { name: vault-backup-oci, creationPolicy: Owner }
  data:
    - secretKey: OCI_CONFIG
      remoteRef: { key: platform/oci/backup-credentials, property: config }
