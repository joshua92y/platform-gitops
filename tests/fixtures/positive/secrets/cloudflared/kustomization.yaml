# 긍정 픽스처 — secrets/<ns> 두 번째 ns(T045 G4). 배달자가 **ns가 다른 secrets/<ns>를 둘 이상** 담는 모양이 정상임을 고정한다.
# 이쪽은 전역 `namespace:` 변환기 없이 ExternalSecret이 자기 ns를 직접 적는다(실제 트리의 `secrets/cert-manager`·`secrets/cloudflared` 모양).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - externalsecret.yaml
