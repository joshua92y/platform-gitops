# 긍정 픽스처 — 인수형 ExternalSecret(vault-platform + platform/ 접두 · Orphan/Retain · template.metadata: {} ·
# Argo 삭제·prune 차단 어노테이션). 계약 §공통 규칙의 `Owner` 예외 모양이 검사 3·7.3을 그대로 통과해야 한다.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloudflared-tunnel
  namespace: cloudflared
  annotations:
    argocd.argoproj.io/sync-options: Delete=false,Prune=false
spec:
  refreshPolicy: Periodic
  refreshInterval: 5m
  secretStoreRef: { kind: ClusterSecretStore, name: vault-platform }
  target:
    name: cloudflared-tunnel
    creationPolicy: Orphan
    deletionPolicy: Retain
    template:
      metadata: {}
  data:
    - secretKey: TUNNEL_TOKEN
      remoteRef: { key: platform/cloudflare/tunnel, property: token }
