# 긍정 픽스처 — ClusterSecretStore 5장(계약 §ClusterSecretStore 5개 표 · §이름·인증 규약)
# vault 4장: serviceAccountRef.namespace 명시(referent auth 금지) · audiences [vault] · role = SA 이름
# kubernetes 1장: auth 키 1개(serviceAccount) · audiences 없음 · 기본값 3필드(remoteNamespace·server.url·caProvider.namespace) 명시
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata: { name: vault-platform }
spec:
  conditions:
    - namespaces: [kube-system, argocd, vault, external-secrets, cert-manager, cnpg-system, data, identity, monitoring, system-upgrade, cloudflared, reloader]
  provider:
    vault:
      server: http://vault.vault.svc:8200
      path: kv
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: eso-platform
          serviceAccountRef: { name: eso-platform, namespace: external-secrets, audiences: [vault] }
---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata: { name: vault-dev }
spec:
  conditions:
    - namespaces: [jt-dev]
  provider:
    vault:
      server: http://vault.vault.svc:8200
      path: kv
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: eso-dev
          serviceAccountRef: { name: eso-dev, namespace: external-secrets, audiences: [vault] }
---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata: { name: vault-prod }
spec:
  conditions:
    - namespaces: [jt-prod]
  provider:
    vault:
      server: http://vault.vault.svc:8200
      path: kv
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: eso-prod
          serviceAccountRef: { name: eso-prod, namespace: external-secrets, audiences: [vault] }
---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata: { name: vault-data }
spec:
  conditions:
    - namespaces: [data, identity]
  provider:
    vault:
      server: http://vault.vault.svc:8200
      path: kv
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: eso-data
          serviceAccountRef: { name: eso-data, namespace: external-secrets, audiences: [vault] }
---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata: { name: k8s-data-ca }
spec:
  conditions:
    - namespaces: [identity, jt-dev, jt-prod]
  provider:
    kubernetes:
      remoteNamespace: data
      server:
        url: https://kubernetes.default.svc:443
        caProvider: { type: ConfigMap, name: kube-root-ca.crt, key: ca.crt, namespace: external-secrets }
      auth:
        serviceAccount: { name: eso-ca-reader, namespace: external-secrets }
