# 긍정 픽스처 — platform/secrets(`secrets/<ns>`의 배달자). 검사 7.3: `secrets/` 아래를 base로 가지는 유일한 kustomization이고,
# 이 트리의 `secrets/<ns>` **둘 다** 여기에 포함돼 있어야 한다(포함되지 않으면 죽은 선언으로 FAIL).
# ns가 둘이므로 전역 `namespace:` 변환기를 두지 않는다 — 실제 트리와 같은 모양(T045 G4).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../secrets/vault
  - ../../secrets/cloudflared
