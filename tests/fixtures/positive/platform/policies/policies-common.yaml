# deny-imds — kube-system 전용(default-deny가 없으므로 이 한 장이 IMDS만 막는다: ports 없음이 의도)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: deny-imds, namespace: kube-system }
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to: [{ ipBlock: { cidr: 0.0.0.0/0, except: [169.254.169.254/32] } }]
---
# allow-imds — vault 전용(인스턴스 프린시펄)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: allow-imds, namespace: vault }
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to: [{ ipBlock: { cidr: 169.254.169.254/32 } }]
      ports: [{ protocol: TCP, port: 80 }]
