# 긍정 픽스처 — vault-data(열거 접두) ExternalSecret + CA 미러(k8s-data-ca: key·property: ca.crt만)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: { name: identity-admin-owner-dev, namespace: data }
spec:
  refreshInterval: 5m
  secretStoreRef: { kind: ClusterSecretStore, name: vault-data }
  target: { name: identity-admin-owner-dev, creationPolicy: Owner }
  data:
    - secretKey: password
      remoteRef: { key: dev/db/identity_admin/owner, property: password }
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: { name: identity-admin-owner-prod, namespace: data }
spec:
  refreshInterval: 5m
  secretStoreRef: { kind: ClusterSecretStore, name: vault-data }
  target: { name: identity-admin-owner-prod, creationPolicy: Owner }
  data:
    - secretKey: password
      remoteRef: { key: prod/db/identity_admin/owner, property: password }
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: { name: pg-main-ca, namespace: jt-dev }
spec:
  refreshInterval: 5m
  secretStoreRef: { kind: ClusterSecretStore, name: k8s-data-ca }
  target: { name: pg-main-ca, creationPolicy: Owner }
  data:
    - secretKey: ca.crt
      remoteRef: { key: pg-main-ca, property: ca.crt }
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: { name: jt-kafka-cluster-ca-cert, namespace: identity }
spec:
