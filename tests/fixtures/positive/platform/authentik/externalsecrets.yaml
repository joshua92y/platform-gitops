# 긍정 픽스처 — platform/authentik ExternalSecret 2종(계약 §공유 컴포넌트 비밀·§공통 규칙)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: { name: authentik-db-owner }
spec:
  refreshInterval: 5m
  secretStoreRef: { kind: ClusterSecretStore, name: vault-platform }
  target: { name: authentik-db-owner, creationPolicy: Owner }
  data:
    - secretKey: password
      remoteRef: { key: platform/db/authentik/owner, property: password }
    - secretKey: github-client-secret
      remoteRef: { key: platform/authentik/sources/github, property: client_secret }
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: { name: authentik-webhook-identity-admin-dev }
spec:
  refreshInterval: 5m
  secretStoreRef: { kind: ClusterSecretStore, name: vault-data }
  target: { name: authentik-webhook-identity-admin-dev, creationPolicy: Owner }
  data:
    - secretKey: secret
      remoteRef: { key: dev/authentik/webhooks/identity-admin, property: secret }
