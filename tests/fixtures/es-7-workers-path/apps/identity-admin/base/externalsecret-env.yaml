# 부정 픽스처 3.7 ES-⑦ — apps/** ExternalSecret이 Workers 전용 경로((dev|prod)/(access|web)/)를 반입
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: { name: identity-admin-env }
spec:
  refreshInterval: 5m
  secretStoreRef: { kind: ClusterSecretStore, name: vault-dev }
  target: { name: identity-admin-env, creationPolicy: Owner }
  data:
    - secretKey: ACCESS_SERVICE_TOKEN
      remoteRef: { key: dev/access/service-token, property: client_secret }
    - secretKey: SESSION_ENCRYPTION_KEY
      remoteRef: { key: dev/web/session, property: key }
