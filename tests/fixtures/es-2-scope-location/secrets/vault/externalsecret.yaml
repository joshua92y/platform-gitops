# 부정 픽스처 3.2 ES-② — secrets/** 위치인데 key가 platform/ 접두가 아님(store는 맞음)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: { name: vault-backup-oci, namespace: vault }
spec:
  refreshInterval: 5m
  secretStoreRef: { kind: ClusterSecretStore, name: vault-platform }
  target: { name: vault-backup-oci, creationPolicy: Owner }
  data:
    - secretKey: OCI_CONFIG
      remoteRef: { key: dev/oci/backup-credentials, property: config }
