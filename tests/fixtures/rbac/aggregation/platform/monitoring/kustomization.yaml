# 부정 픽스처 13.6 RBAC-aggregation — 역할 집계:
#   agg-parent   aggregationRule을 가진 ClusterRole(합쳐진 결과 규칙은 렌더에 없어 볼 수 없다)
#   extra-view   기준선 밖 이름의 ClusterRole에 aggregate-to-view: "true"(내장 view에 규칙을 더한다 — agent-view-view가 view에 걸려 있다)
#   extra-false  aggregate-to-edit: "false"(라벨 값은 보지 않는다 — 값이 바뀌는 순간 집계된다)
#   기준선 이름 cert-manager-view(platform/cert-manager)의 라벨은 걸리지 않는다
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - rbac.yaml
