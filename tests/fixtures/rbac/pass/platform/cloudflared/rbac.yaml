apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: { name: sa-create, namespace: cloudflared }
rules:
  - apiGroups: [""]
    resources: [serviceaccounts]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: { name: apps-wild, namespace: cloudflared }
rules:
  - apiGroups: [apps]
    resources: ["*"]
    verbs: ["*"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: { name: split, namespace: cloudflared }
rules:
  - apiGroups: [""]
    resources: [serviceaccounts/token]
    verbs: [get]
  - apiGroups: [""]
    resources: [pods]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: { name: cloudflared-shared, namespace: cloudflared }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: shared-reader }
subjects:
  - { kind: ServiceAccount, name: cloudflared, namespace: cloudflared }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: { name: cloudflared-shared }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: shared-reader }
subjects:
  - { kind: ServiceAccount, name: cloudflared, namespace: cloudflared }
