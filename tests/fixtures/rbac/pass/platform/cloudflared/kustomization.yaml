# 경계 픽스처(통과) 13.1 · 13.2 — 토큰 발급 규칙이 아닌 것과, 다른 컴포넌트 렌더가 정의한 ClusterRole을 가리키는 바인딩:
#   Role sa-create — resources [serviceaccounts] + create(SA 자체를 만든다 — 토큰이 아니다)
#   Role apps-wild — apiGroups [apps] + resources ["*"] + verbs ["*"](핵심 그룹이 아니다 — serviceaccounts는 core 그룹이다)
#   Role split — 규칙 둘에 나뉘어 있다(첫째는 core · serviceaccounts/token이지만 get, 둘째는 create지만 pods) — 한 규칙 안에서 셋이 다 맞아야 한다
#   RoleBinding · ClusterRoleBinding cloudflared-shared → ClusterRole shared-reader(platform/monitoring 렌더가 정의 — 합친 이름 집합으로 본다)
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - rbac.yaml
