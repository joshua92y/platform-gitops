# 부정 픽스처 3.1 ES-① — remoteRef.key가 정규식 ^(platform|dev|prod)/[a-z0-9_./-]+$ 위반(대문자·공백·접두 없음)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: { name: identity-admin-env, namespace: jt-dev }
spec:
  refreshInterval: 5m
  secretStoreRef: { kind: ClusterSecretStore, name: vault-dev }
  target: { name: identity-admin-env, creationPolicy: Owner }
  data:
    - secretKey: DATABASE_URL
      remoteRef: { key: dev/DB/Identity Admin, property: url }
    - secretKey: OTHER
      remoteRef: { key: secret/data/dev/db/identity_admin, property: url }
