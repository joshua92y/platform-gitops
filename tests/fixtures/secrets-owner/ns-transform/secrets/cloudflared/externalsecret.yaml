# 부정 픽스처 7.3(e) — 원본은 정상이다(Orphan · vault-platform · platform/ 접두). 위반은 ns kustomization의 `namePrefix`다.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: { name: cloudflared-tunnel, namespace: cloudflared }
spec:
  refreshPolicy: Periodic
  refreshInterval: 5m
  secretStoreRef: { kind: ClusterSecretStore, name: vault-platform }
  target:
    name: cloudflared-tunnel
    creationPolicy: Orphan
    deletionPolicy: Retain
    template:
      metadata: {}
  data:
    - secretKey: TUNNEL_TOKEN
      remoteRef: { key: platform/cloudflare/tunnel, property: token }
