# 부정 픽스처 7.3(e) — `secrets/<ns>`의 kustomization이 변환 키(`namePrefix`)를 쓴다(계약 §validate.yml 4 위반).
# 허용 키는 `{apiVersion, kind, resources, namespace}`뿐이다 — `namespace:`만 변환기로 허용되고(긍정 픽스처의 `secrets/vault`),
# 그 밖의 키는 원본 파일을 그대로 둔 채 **배달자 렌더에서만** 객체를 바꾸는 길이 된다.
# ⚠ `namePrefix`는 이름까지 바꾸므로 (c)「죽은 선언」도 함께 걸린다(원본 파일의 ES 이름이 배달자 렌더에 없다) —
#   그것도 실제 동작이라 두 줄을 모두 단언한다. 이름을 바꾸지 않는 변환 키(`patches` 등)는 (c)에 걸리지 않으므로
#   (e)가 유일한 그물이다(그 갈래는 `../deliverer-patch/`가 덮는다).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namePrefix: rogue-
resources:
  - externalsecret.yaml
