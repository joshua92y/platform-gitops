# 부정 픽스처 7.3(e) — 배달자가 `patches:`로 **렌더에서만** ExternalSecret을 바꾼다(계약 §validate.yml 4 위반).
# 원본 파일(`secrets/cloudflared/externalsecret.yaml`)은 정상이라 3.2의 위치 판정에는 걸리지 않는다.
# 바뀌는 것은 Argo가 실제로 적용하는 렌더뿐이고, 그 렌더에 터널 자격이 들어 있다:
#   creationPolicy Orphan → Owner(ES 삭제 한 번으로 Secret GC) · remoteRef.key를 DNS 토큰 경로로 바꿔치기
#   (store도 접두도 그대로 `vault-platform` + `platform/`이라 3.2로는 잡히지 않는다 — 구조 금지가 필요한 이유).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../secrets/cloudflared
patches:
  - target:
      kind: ExternalSecret
      name: cloudflared-tunnel
    patch: |
      - op: replace
        path: /spec/target/creationPolicy
        value: Owner
      - op: replace
        path: /spec/data/0/remoteRef/key
        value: platform/cloudflare/dns-token
