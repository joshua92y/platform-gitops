# 부정 픽스처 7.3(owner-scope) — 원본 ExternalSecret(이것이 배달자 밖에서도 렌더되는 것이 위반이다)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: { name: cloudflare-dns-token, namespace: cert-manager }
spec:
  refreshPolicy: Periodic
  refreshInterval: 5m
  secretStoreRef: { kind: ClusterSecretStore, name: vault-platform }
  target: { name: cloudflare-dns-token, creationPolicy: Orphan, deletionPolicy: Retain }
  data:
    - secretKey: api-token
      remoteRef: { key: platform/cloudflare/dns-token, property: token }
