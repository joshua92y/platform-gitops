# 부정 픽스처 7.3(dead-files) ② `secrets/` 바로 아래 파일 — ns 디렉터리가 아니라 디렉터리 단위 검사가 보지 못한다
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: { name: stray-token, namespace: cert-manager }
spec:
  refreshPolicy: Periodic
  refreshInterval: 5m
  secretStoreRef: { kind: ClusterSecretStore, name: vault-platform }
  target: { name: stray-token, creationPolicy: Orphan, deletionPolicy: Retain }
  data:
    - secretKey: token
      remoteRef: { key: platform/example/stray, property: token }
