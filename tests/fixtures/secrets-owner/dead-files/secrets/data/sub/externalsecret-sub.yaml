# 부정 픽스처 7.3(dead-files) ③ `secrets/<ns>/sub/` 하위 파일 — 디렉터리 단위 검사의 `-maxdepth 1`이 보지 못한다
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: { name: sub-token, namespace: data }
spec:
  refreshPolicy: Periodic
  refreshInterval: 5m
  secretStoreRef: { kind: ClusterSecretStore, name: vault-platform }
  target: { name: sub-token, creationPolicy: Orphan, deletionPolicy: Retain }
  data:
    - secretKey: token
      remoteRef: { key: platform/example/sub, property: token }
