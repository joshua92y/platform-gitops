# 부정 픽스처 7.3(dead-files) ① ns kustomization의 resources에 없는 파일 — 렌더에 들어가지 않는 죽은 선언
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: { name: unregistered-token, namespace: cert-manager }
spec:
  refreshPolicy: Periodic
  refreshInterval: 5m
  secretStoreRef: { kind: ClusterSecretStore, name: vault-platform }
  target: { name: unregistered-token, creationPolicy: Orphan, deletionPolicy: Retain }
  data:
    - secretKey: token
      remoteRef: { key: platform/example/unregistered, property: token }
