# 부정 픽스처 3.3 ES-③ — platform/authentik: (1) store vault-dev 불허 (2) vault-data인데 열거 접두 밖(dev/authentik/identity-admin)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: { name: authentik-bad-store, namespace: identity }
spec:
  refreshInterval: 5m
  secretStoreRef: { kind: ClusterSecretStore, name: vault-dev }
  target: { name: authentik-bad-store, creationPolicy: Owner }
  data:
    - secretKey: secret
      remoteRef: { key: dev/authentik/webhooks/identity-admin, property: secret }
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: { name: authentik-bad-prefix, namespace: identity }
spec:
  refreshInterval: 5m
  secretStoreRef: { kind: ClusterSecretStore, name: vault-data }
  target: { name: authentik-bad-prefix, creationPolicy: Owner }
  data:
    - secretKey: webhook_secret
      remoteRef: { key: dev/authentik/identity-admin, property: webhook_secret }
