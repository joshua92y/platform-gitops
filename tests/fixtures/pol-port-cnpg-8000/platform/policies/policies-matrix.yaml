# 부정 픽스처 5.4 POL-port-table(red 대조 · T053 선행) — 긍정 픽스처 `positive/platform/policies/policies-matrix.yaml`의 사본에서
#   ingress `data/allow-from-cnpg-operator`(계약 §포트 출처 각주 "CNPG instance manager 8000" = PORT_TABLE `data 8000 cnpg-instance-manager`)
#   **한 장만** 뺐다. 기대 = `ns 'data' 포트 8000(cnpg-instance-manager)` FAIL 1건만 — 같은 ns의 9187·9404와 다른 ns의 각주 포트는
#   그대로 통과해야 한다(격리 증명 · validate.tests.sh `pol-port-cnpg-8000`). 다른 4파일은 긍정 픽스처와 동일한 사본이다.
# monitoring → argocd 8082·8083·8084
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: allow-scrape-from-monitoring, namespace: argocd }
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from: [{ namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: monitoring } } }]
      ports: [{ protocol: TCP, port: 8082 }, { protocol: TCP, port: 8083 }, { protocol: TCP, port: 8084 }]
---
