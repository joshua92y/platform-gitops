# allow-apiserver-webhook × 4 — 5.6이 출발 ipBlock 집합을 값까지 정확 일치로 검사하므로 이 4장만은
#   platform/policies의 실제 주소를 쓴다(다른 규칙의 노드 A 주소는 계속 가짜 10.0.0.10이다):
#   cert-manager·external-secrets·cnpg-system = { 노드 A private/32, 노드 A flannel/32 } · vault 8200 = { private/32 }
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: allow-apiserver-webhook, namespace: cert-manager }
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        - ipBlock: { cidr: 10.0.7.78/32 }
        - ipBlock: { cidr: 10.42.0.0/32 }
      ports: [{ protocol: TCP, port: 10250 }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: allow-apiserver-webhook, namespace: external-secrets }
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        - ipBlock: { cidr: 10.0.7.78/32 }
        - ipBlock: { cidr: 10.42.0.0/32 }
      ports: [{ protocol: TCP, port: 10250 }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: allow-apiserver-webhook, namespace: cnpg-system }
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        - ipBlock: { cidr: 10.0.7.78/32 }
        - ipBlock: { cidr: 10.42.0.0/32 }
      ports: [{ protocol: TCP, port: 9443 }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: allow-apiserver-webhook, namespace: vault }
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    # vault 8200은 port-forward 도착 경로라 flannel /32를 넣지 않는다(넣으면 5.6이 여분으로 FAIL)
    - from: [{ ipBlock: { cidr: 10.0.7.78/32 } }]
      ports: [{ protocol: TCP, port: 8200 }]
---
# deny-imds — kube-system 전용(default-deny가 없으므로 이 한 장이 IMDS만 막는다: ports 없음이 의도)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: deny-imds, namespace: kube-system }
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to: [{ ipBlock: { cidr: 0.0.0.0/0, except: [169.254.169.254/32] } }]
---
# allow-imds — vault 전용(인스턴스 프린시펄)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: allow-imds, namespace: vault }
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to: [{ ipBlock: { cidr: 169.254.169.254/32 } }]
      ports: [{ protocol: TCP, port: 80 }]
