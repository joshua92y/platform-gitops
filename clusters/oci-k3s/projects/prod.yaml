# AppProject `prod` — 앱 prod 배포(`<pod>-prod`, source `apps/<pod>/overlays/prod`) 전용 (T041 PR-A · T075 허용 목록)
#
# 정본 계약: gitops-repo.md §Application 규약 AppProject 행 — dev 와 같은 형태이며 destination 만 `jt-prod` 다.
#   dev 와의 차이는 프로젝트가 아니라 Application 의 syncPolicy 에 있다(dev prune true · prod prune false — 앱 Application 의 정확한 꼴).
#
# 허용 목록(T075 보정 2026-11-17)과 금지 목록 6종의 뜻 · group 정확 일치 · 대조하는 곳(모노레포 하네스 argo-3 · validate 13.7 · 14.7)은
#   dev.yaml 머리 주석과 같다. 허용 목록 = 정확히 ""/ConfigMap · ""/Service · apps/Deployment · batch/Job · batch/CronJob ·
#   networking.k8s.io/Ingress · external-secrets.io/ExternalSecret · traefik.io/Middleware(admin Ingress 의 stripPrefix — 같은 ns).
#
# 이 프로젝트를 쓰는 Application(지금 `identity-admin-prod` 하나 — clusters/oci-k3s/apps/<pod>-prod.yaml)은 T075 가 만들었다(gitops PR GP-2 #63 ·
#   2026-11-19 — 빈 prod overlay 를 가리키는 꼴로 먼저 → GP-3 #64 · 2026-11-20 이 overlays/prod 를 채워 prod 첫 배포).
#   이 파일은 승인 관문(prod-approval) 대상이다(clusters/oci-k3s/projects/** — 계약 §validate.yml 8).
#   (T075 정정 2026-11-20 — 이전 문구 「이 프로젝트를 쓰는 Application(`identity-admin-prod` 등)은 T075 가 만든다(gitops PR GP-2 — 빈 prod overlay 를
#   가리키는 꼴로 먼저)」)
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: prod
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-options: Delete=false,Prune=false
spec:
  description: 앱 prod 배포 — jt-prod 네임스페이스만. cluster 리소스·정책 객체 금지
  sourceRepos:
    - https://github.com/joshua92y/platform-gitops.git
  destinations:
    - server: https://kubernetes.default.svc
      namespace: jt-prod
  clusterResourceWhitelist: []
  namespaceResourceWhitelist:
    - group: ""
      kind: ConfigMap
    - group: ""
      kind: Service
    - group: apps
      kind: Deployment
    - group: batch
      kind: Job
    - group: batch
      kind: CronJob
    - group: networking.k8s.io
      kind: Ingress
    - group: external-secrets.io
      kind: ExternalSecret
    - group: traefik.io
      kind: Middleware
  namespaceResourceBlacklist:
    - group: networking.k8s.io
      kind: NetworkPolicy
    - group: ""
      kind: ResourceQuota
    - group: ""
      kind: LimitRange
    - group: ""
      kind: ServiceAccount
    - group: rbac.authorization.k8s.io
      kind: Role
    - group: rbac.authorization.k8s.io
      kind: RoleBinding
