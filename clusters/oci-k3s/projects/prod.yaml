# AppProject `prod` — 앱 prod 배포(`<pod>-prod`, source `apps/<pod>/overlays/prod`) 전용 (T041 PR-A)
#
# 정본 계약: gitops-repo.md §Application 규약 AppProject 행 — dev 와 같은 형태이며 destination 만 `jt-prod` 다.
#   dev 와의 차이는 프로젝트가 아니라 Application 의 syncPolicy 에 있다("prod 앱: automated 이되 변경은 PR 로만").
#
# 금지 목록의 group 은 정확히 일치해야 한다(모노레포 tests/platform/cluster.tests.ps1 argo-3 이 group 까지 대조한다):
#   networking.k8s.io/NetworkPolicy · ""/ResourceQuota · ""/LimitRange · ""/ServiceAccount ·
#   rbac.authorization.k8s.io/Role · rbac.authorization.k8s.io/RoleBinding.
#
# 이 프로젝트를 쓰는 Application 은 T041 에서 만들지 않는다 — tasks.md T075 의 산출물이다(설계 D8).
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: prod
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-options: Delete=false,Prune=false
spec:
  description: 앱 prod 배포 — jt-prod 네임스페이스만. cluster 리소스·정책 객체 금지
  sourceRepos:
    - https://github.com/joshua92y/platform-gitops.git
  destinations:
    - server: https://kubernetes.default.svc
      namespace: jt-prod
  clusterResourceWhitelist: []
  namespaceResourceBlacklist:
    - group: networking.k8s.io
      kind: NetworkPolicy
    - group: ""
      kind: ResourceQuota
    - group: ""
      kind: LimitRange
    - group: ""
      kind: ServiceAccount
    - group: rbac.authorization.k8s.io
      kind: Role
    - group: rbac.authorization.k8s.io
      kind: RoleBinding
