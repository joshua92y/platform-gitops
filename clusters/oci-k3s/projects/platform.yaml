# AppProject `platform` — 플랫폼 컴포넌트 Application(`platform-<component>`) 전용 (T041 PR-A)
#
# 정본 계약: gitops-repo.md §Application 규약 AppProject 행
#   "`platform`: sourceRepos [gitops, 차트 저장소], destinations = 플랫폼 네임스페이스(network-policy.md 표),
#    clusterResourceWhitelist(CRD·Namespace·ClusterRole…)".
#
# ⚠ 이 프로젝트는 `argocd` 네임스페이스에 배포할 수 있다 = 클러스터 admin 등가다(Argo CD 자신의 RBAC·컨트롤러를 바꿀 수 있다).
#   그래서 (a) 이 파일과 platform/·clusters/ 변경은 approval-review 의 k8s-security 경계 대상이고(계약 §변경 권한),
#   (b) sourceRepos·clusterResourceWhitelist 는 와일드카드 대신 열거형이며, (c) 새 kind·새 차트 저장소는 PR 로만 늘어난다.
#
# destinations = 계약 network-policy.md §네임스페이스 표 14개 **전부**(jt-dev·jt-prod 포함).
#   근거: Argo CD 는 Application 이 만드는 네임스페이스 리소스마다 그 리소스의 ns 가 project destinations 에 있는지 본다.
#   `platform-policies` 가 jt-dev·jt-prod 에 NetworkPolicy·ResourceQuota·LimitRange 를 선언하므로(계약 :31, tasks.md T041 문면)
#   두 ns 가 빠지면 sync 가 성립하지 않는다.
#   계약 §Application 규약 후반과 hostnames-and-access.md §자격이 필요한 검사에는 "platform 에 `jt-dev` 를 넣지 않는다"는
#   문장이 있으나 이는 위 요구와 내부 모순이다 — **converge 인계 1번**(정정 초안: "`platform` destinations 는 §네임스페이스 표
#   14개 전부다. AppProject `tests` 는 검사 Job Application 의 권한 상한을 platform 과 분리하기 위한 것이다").
#   AppProject `tests` 의 존재 이유는 그대로 유지된다: Argo CD 에는 "destination 을 특정 Application 에만 한정"하는 개념이
#   없으므로, 검사 Job 은 source·cluster 권한이 훨씬 좁은 별도 프로젝트로 배포한다(tests.yaml).
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: platform
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-options: Delete=false,Prune=false
spec:
  description: 플랫폼 컴포넌트 — argocd ns 배포 가능 = admin 등가. 변경은 k8s-security 경계 리뷰 대상
  sourceRepos:
    # gitops 저장소 — 모든 Application 매니페스트의 정본
    - https://github.com/joshua92y/platform-gitops.git
    # 차트 저장소(계약 "sourceRepos [gitops, 차트 저장소]"). 아래는 plan.md Primary Dependencies · research.md 기준의
    # **현재 알려진 값**이다. 컴포넌트를 kustomize `helmCharts` 로 인플레이트하면 Application source 는 gitops 저장소뿐이므로
    # 해당 줄은 그 컴포넌트 태스크의 PR 에서 지운다(설계 D7).
    - https://charts.external-secrets.io           # external-secrets
    - https://helm.releases.hashicorp.com          # vault
    - https://cloudnative-pg.github.io/charts      # cnpg operator + plugin-barman-cloud
    - https://charts.goauthentik.io                # authentik
    - https://grafana.github.io/helm-charts        # monitoring(k8s-monitoring)
    - https://stakater.github.io/stakater-charts   # reloader
    # OCI 레지스트리 표기 — 미확정이라 두 형식을 함께 둔다(같은 레지스트리 경로라 권한이 넓어지지 않는다).
    #   research.md 실측 메모는 "OCI 차트는 repoURL 에 oci:// 없이 host/path"(Argo CD 3.0 이전 helm-OCI 방식),
    #   설계 D7 은 `oci://` 접두사 형식을 적었다. 어느 쪽으로 확정되는지는 컴포넌트 태스크의 실측이며,
    #   확정 뒤 쓰지 않는 표기를 그 PR 에서 지운다.
    - oci://quay.io/jetstack/charts                # cert-manager
    - quay.io/jetstack/charts
    - oci://quay.io/strimzi-helm                   # kafka(strimzi-kafka-operator)
    - quay.io/strimzi-helm
    - oci://ghcr.io/openfga/helm-charts            # openfga
    - ghcr.io/openfga/helm-charts
  # 계약 network-policy.md §네임스페이스 표 순서 그대로(14개). 새 ns 는 그 표를 먼저 고친다.
  destinations:
    - server: https://kubernetes.default.svc
      namespace: kube-system
    - server: https://kubernetes.default.svc
      namespace: argocd
    - server: https://kubernetes.default.svc
      namespace: vault
    - server: https://kubernetes.default.svc
      namespace: external-secrets
    - server: https://kubernetes.default.svc
      namespace: cert-manager
    - server: https://kubernetes.default.svc
      namespace: cnpg-system
    - server: https://kubernetes.default.svc
      namespace: data
    - server: https://kubernetes.default.svc
      namespace: identity
    - server: https://kubernetes.default.svc
      namespace: jt-dev
    - server: https://kubernetes.default.svc
      namespace: jt-prod
    - server: https://kubernetes.default.svc
      namespace: monitoring
    - server: https://kubernetes.default.svc
      namespace: system-upgrade
    - server: https://kubernetes.default.svc
      namespace: cloudflared
    - server: https://kubernetes.default.svc
      namespace: reloader
  # 열거형(와일드카드 금지). 빠진 kind 는 sync 실패로 드러나고 whitelist 추가 PR 1건으로 푼다 — 비파괴적이고 감사 가능하다.
  clusterResourceWhitelist:
    - group: ""                             # Namespace (platform/policies)
      kind: Namespace
    - group: apiextensions.k8s.io           # CNPG·Strimzi·cert-manager·ESO·SUC·Argo CD CRD
      kind: CustomResourceDefinition
    - group: rbac.authorization.k8s.io      # 오퍼레이터 · agent-view
      kind: ClusterRole
    - group: rbac.authorization.k8s.io
      kind: ClusterRoleBinding
    - group: cert-manager.io                # cert-manager-issuers
      kind: ClusterIssuer
    - group: external-secrets.io            # ClusterSecretStore 5개
      kind: ClusterSecretStore
    - group: admissionregistration.k8s.io   # cert-manager · CNPG · ESO webhook
      kind: MutatingWebhookConfiguration
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
    - group: scheduling.k8s.io              # 차트가 동봉하는 PriorityClass
      kind: PriorityClass
  # 선언에 없는데 클러스터에 있는 리소스를 경고로만 알린다(삭제하지 않는다).
  orphanedResources:
    warn: true
