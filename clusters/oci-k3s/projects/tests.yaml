# AppProject `tests` — `platform/policies/tests/` 검사 Job 3종(data-assert · kafka-assert · authz-assert) 전용 (T041 PR-A)
#
# 정본: tasks.md T041 문면 "sourceRepos = gitops 만, destination `jt-dev` 만, cluster 리소스 금지" ·
#   계약 gitops-repo.md §Application 규약 AppProject 행 · hostnames-and-access.md §자격이 필요한 검사.
#
# 왜 별도 프로젝트인가: Argo CD 에는 "destination 을 특정 Application 에만 한정"하는 개념이 없다. 검사 Job 은 `jt-dev` 에서
#   dev scope 자격(ClusterSecretStore `vault-dev`)만으로 돌아야 하므로, 권한 상한이 훨씬 넓은 `platform` 이 아니라
#   source·destination·cluster 권한이 모두 최소인 이 프로젝트로 배포한다.
#
# 문면에 없는 제약은 두지 않는다 — `namespaceResourceBlacklist` 없음. 세 항목(sourceRepos·destination·cluster 리소스 금지)이 전부다.
#
# 이 프로젝트를 쓰는 Application = `platform-tests`(T059 2026-10-29 · `../apps/platform-tests.yaml`) — T041 당시 보류 이유(계약 행 부재 ·
#   검사 대상 부재)는 T059가 계약 §Application 규약 이름 행 · §sync-wave 표 `policies/tests` 행과 US3 산출물(pg-main · Kafka · Dragonfly)로
#   해소했다(authz-assert는 T085). 이름 ↔ 경로 예외(`platform-tests` ↔ `platform/policies/tests`)는 tests/validate.sh 검사 7.1의 `tests` 분기가 받는다.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: tests
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-options: Delete=false,Prune=false
spec:
  description: platform/policies/tests 검사 Job 전용 — jt-dev 만, dev scope 자격만
  sourceRepos:
    - https://github.com/joshua92y/platform-gitops.git
  destinations:
    - server: https://kubernetes.default.svc
      namespace: jt-dev
  clusterResourceWhitelist: []
