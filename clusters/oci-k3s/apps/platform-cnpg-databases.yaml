# clusters/oci-k3s/apps/platform-cnpg-databases.yaml — CNPG `Database`·`DatabaseRole` Application (T041 PR-C)
#
# 역할: root(app-of-apps)가 이 파일을 읽어 child Application `platform-cnpg-databases`를 만들고,
#   그 Application이 `platform/cnpg-databases`를 서버 사이드 적용한다.
#
# 상태: T041(PR-C)에는 `platform/cnpg-databases/kustomization.yaml`이 `resources: []` 뼈대였다(렌더 0개 — 리소스 0인 Application이
#   Synced/Healthy가 되는지는 설계 VD-E로 실측). **T054(2026-10-14)가 채웠다**: 순수 매니페스트 17장 — 비밀번호 `ExternalSecret` 6(리소스 wave 0) →
#   `DatabaseRole` 6(1) → `Database` 4(2) + PostSync hook Job 1(`cnpg-databases-access` — ⓪ pod DB `identity_admin`·`dev_identity_admin`의 CONNECT 제한(결정 C1 ·
#   migrate Job T072 첫 단계와 이중 멱등) · ① 공유 DB `authentik`·`openfga`의 CONNECT 제한 · ② app role 세션 기본값 — init 2 + 본 컨테이너 1로 자격 격리).
#   값·근거·VD는 `platform/cnpg-databases/README.md`.
#
# 왜 `platform-cnpg-cluster`와 다른 Application인가: 이 디렉터리의 CR은 `Cluster pg-main`이 Healthy가 된 뒤에야
#   조정될 수 있다. Argo CD는 wave N이 Healthy가 된 뒤 다음 wave로 넘어가므로 그 의존을 wave로 표현한다
#   (값은 계약 §sync-wave 단일 표 참조).
#
# sync-wave·destination.namespace: 값의 정본은 계약 contracts/gitops-repo.md §sync-wave 단일 표이고,
#   코드 사본은 tests/validate.sh의 WAVE_TABLE 하나뿐이다. 아래 두 값은 그 표에서 기계적으로 읽어 넣었고
#   저장소의 어떤 README·주석·PR 본문에도 숫자를 다시 적지 않는다. 대조는 사람이 아니라 검사 7.1이 한다.
#
# finalizer 있음(`resources-finalizer.argocd.argoproj.io`): 이 Application을 지우면 컴포넌트 리소스(CR)도 함께 정리된다 — 단 `DatabaseRole`·`Database`는
#   reclaim policy `retain`이라 CR이 지워져도 PG의 role·database는 **남는다**(데이터 보호 · README §5). ExternalSecret이 지워지면 Secret이 GC되지만 PG의
#   비밀번호는 그대로다. ⚠ reclaim을 `delete`로 바꾼 뒤라면 이 cascade가 DROP DATABASE/ROLE을 부르고, Database `ensure: absent`는 cascade 없이도 머지만으로
#   DROP DATABASE다 — 그 값들을 바꾸는 PR은 데이터 삭제 PR(README §5 · validate **3.8 `CNPG-retain`**(계약 §validate.yml 3 하위 항목 「CNPG 데이터 보존」 · 2026-10-14 ·
#   기대 PASS 줄 `[PASS] 3.8 CNPG-retain — postgresql.cnpg.io Database 8개(원본 4 · 렌더 4): … · DatabaseRole 12개(원본 6 · 렌더 6): …` — 전문은 README §0 P6)이 `ensure ≠ absent` ·
#   reclaim `retain` 명시를 고정한다). `Delete=confirm`이 있어 삭제에는 승인 어노테이션(`argocd.argoproj.io/deletion-approved`)이 한 겹 더 필요하다.
#   finalizer를 빼는 것은 `platform-argocd`·`platform-policies` 둘뿐이다 — 그 둘의 cascade는 Argo CD 자신과
#   Namespace 14개를 지울 수 있어 되돌릴 컨트롤러조차 남지 않는다.
#
# syncPolicy: 계약 §Application 규약의 플랫폼 표준 + **예외 2항목**(계약 §Application 규약 예외의 **두 번째 사례**, 2026-10-14 T054 — 첫 사례는
#   `platform-cnpg-cluster`, 같은 모양). `CreateNamespace=true`는 PR-B2의 platform/policies가 Namespace 14개의 선언 정본이라 실질 no-op이다.
#   예외의 이유: 이 Application은 Argo가 **health를 추적하는 CR**(ESO `ExternalSecret` — Argo CD v3.5.2 내장 health lua
#   resource_customizations/external-secrets.io/ExternalSecret/health.lua: `Ready=False`(SecretSyncedError — kv 경로·키 없음) → **Degraded** · `Ready=True` → Healthy)을
#   **다단계 리소스 wave**(ES 0 → DatabaseRole 1 → Database 2) 안에 갖고, **PostSync hook Job**까지 가진다(`DatabaseRole`·`Database`는 Argo 내장 health가 없다 —
#   v3.5.2 resource_customizations/postgresql.cnpg.io에는 `Cluster`뿐 → 적용 즉시 Healthy · gitops-engine pkg/sync/sync_context.go:559).
#   다단계 sync는 다음 wave로 가기 전 running task의 health를 기다리고 Degraded를 보면 task Failed → operation Failed로 닫는다(sync_context.go:563–567 · :636–639).
#   hook Job이 실패해도(Job health Degraded — gitops-engine pkg/health/health_job.go) operation Failed다(sync_context.go:349–361). 자동 sync operation은
#   **기본 retry**(limit 5 · 5s ×2 · max 3m ≈ 2.6분 — controller/appcontroller.go:2377 `RetryStrategy{Limit: 5}` · pkg/apis/application/v1alpha1/application_defaults.go:6–8)를
#   이미 가지며, 그것을 소진해 최종 Failed가 되면 **같은 리비전으로 다시 시작하지 않는다**(appcontroller.go:2391 "Skipping auto-sync: failed previous sync attempt
#   … will not retry"). 이 Application에서 그 경로는 kv 시드 지연(ES SecretSyncedError)과 PostSync Job의 접속 대기(인스턴스 매니저의 비동기 role·database 생성)다
#   — 소스 판독 · 라이브 미실측(README VD-6).
#   - `ApplyOutOfSyncOnly=true`: in-sync 리소스를 **health와 무관하게** task에서 뺀다(sync_context.go:646–648 · :761–773 — modified=false면 제외) → 재시도·후속
#     변경에서 이미 적용된 ES·role·database는 다시 wave 대기를 만들지 않는다. 그 대가로 **wave 순서 보장은 첫 시도에만** 있다: 첫 시도가 Degraded ES(kv 미시드)에서
#     Failed로 닫히면, 재시도는 그 ES를 다시 기다리지 않고 DatabaseRole·Database를 Secret 없이 먼저 적용한다 — CNPG 쪽은 무해(Secret이 없으면 applied=false ·
#     30초 재시도)하고 PostSync Job은 "Secret 파일 없음"으로 바로 FAIL해 다음 재시도로 넘어간다(README §1). 첫 배포는 Sync 단계 16장이 모두 OutOfSync라 첫 시도의
#     wave 순서는 그대로다. hook은 이 필터에서 빠지지 않는다(:763–765 — PostSync Job은 **전체 sync**마다 돈다. 단 selfHeal 자동 sync(OutOfSync 리소스만 넣는 부분 sync ·
#     controller/appcontroller.go:2412–2420) · 리소스를 고른 수동 Sync · Apply only는 hook을 건너뛴다 — controller/sync.go:311 skipHooks → sync_context.go:980).
#   - `retry`(limit 5 · backoff 30s ×2 · maxDuration 5m ≈ 12.5분): 새 안전망이 아니라 **기본 retry의 대체**(appcontroller.go:2379–2381 `op.Retry = *app.Spec.SyncPolicy.Retry`)로
#     창을 넓힌 것 — 시드가 머지 직후에 끝나는 경우 · PostSync Job의 대기 예산(480초)이 첫 시도에서 모자란 경우를 덮는다. 재시도마다 PostSync Job이 다시 뜬다
#     (hook-delete-policy BeforeHookCreation — 앞 Job을 지우고 새로 만든다). 모양은 `platform-cnpg-cluster.yaml`·bootstrap/root-app.yaml의 retry와 같다.
#   그래도 Failed가 남으면 원인(kv · Secret · role)을 고친 뒤 운영자 **전체** 수동 Sync(리소스 선택 없음 · Apply only 끔 — README §1; 늦은 시드면 ES force-sync →
#   SecretSynced 확인이 먼저). ⚠ hook 매니페스트만 바뀐 커밋은 Application을 OutOfSync로 만들지 않는다(controller/state.go:981–985 — hook은 sync 상태에 들어가지
#   않는다) → 자동 sync가 돌지 않으므로 그때도 전체 수동 Sync로 새 Job을 돌린다. ⚠ hook 결과는 Application의 sync·health 집계에도 들어가지 않는다(controller/health.go:30) —
#   Job이 실패해도 앱은 Synced/Healthy일 수 있어 판정은 operationState.phase · hookPhase · Job succeeded · 로그 SUMMARY(README §3 VD-4).
#   둘 다 **이 Application과 `platform-cnpg-cluster`에만** 둔다 — 다른 플랫폼 Application은 계약 표준 그대로다.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-cnpg-databases
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "40"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform
  source:
    repoURL: https://github.com/joshua92y/platform-gitops.git
    targetRevision: main
    path: platform/cnpg-databases
  destination:
    server: https://kubernetes.default.svc
    namespace: data
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
      - ApplyOutOfSyncOnly=true
      - CreateNamespace=true
      - Prune=confirm
      - Delete=confirm
      - SkipDryRunOnMissingResource=true
    retry:
      limit: 5
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
