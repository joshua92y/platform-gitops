# clusters/oci-k3s/apps/platform-traefik.yaml — Traefik Middleware·TLSOption·TLSStore Application (T041 PR-C)
#
# 역할: root(app-of-apps)가 이 파일을 읽어 child Application `platform-traefik`을 만들고,
#   그 Application이 `platform/traefik`을 서버 사이드 적용한다.
#
# 현재 상태(T041 시점): `platform/traefik/kustomization.yaml`은 `resources: []` 뼈대다 → 렌더 결과 0개.
#   리소스 0인 Application이 Synced/Healthy가 되는지는 설계 VD-E로 실측한다(아니면 이 Application을 컴포넌트
#   태스크로 이월). 실제 매니페스트(`TLSStore default` 등)는 T042가 채운다.
#
# 경계 — 이 Application은 Traefik **자체**를 배포하지 않는다: Traefik은 K3s가 설치·관리하고, 그 설정의 정본은
#   노드 A의 `server/manifests/traefik-config.yaml`(`HelmChartConfig`, T038)이다. 이 디렉터리에는 계약
#   §디렉터리대로 Middleware·TLSOption·TLSStore만 둔다. 그래서 destination도 Traefik이 사는 네임스페이스(표 3열)이고,
#   그 Namespace는 K3s가 만든 것이라 `platform/policies/`가 PSA 라벨만 SSA로 패치한다(계약 §네임스페이스).
#   `CreateNamespace=true`는 그 ns가 이미 있어 실질 no-op이며, 이 Application은 Namespace를 리소스로 추적하지 않는다.
#
# sync-wave·destination.namespace: 값의 정본은 계약 contracts/gitops-repo.md §sync-wave 단일 표이고,
#   코드 사본은 tests/validate.sh의 WAVE_TABLE 하나뿐이다. 아래 두 값은 그 표에서 기계적으로 읽어 넣었고
#   저장소의 어떤 README·주석·PR 본문에도 숫자를 다시 적지 않는다. 대조는 사람이 아니라 검사 7.1이 한다.
#
# finalizer 있음(`resources-finalizer.argocd.argoproj.io`): 이 Application을 지우면 이 소스가 만든 Middleware·
#   TLSOption·TLSStore가 함께 지워진다(K3s가 관리하는 Traefik 본체는 이 Application의 소유가 아니라 그대로 남는다).
#   `Delete=confirm`이 있어 삭제에는 승인 어노테이션(`argocd.argoproj.io/deletion-approved`)이 한 겹 더 필요하다.
#   finalizer를 빼는 것은 `platform-argocd`·`platform-policies` 둘뿐이다 — 그 둘의 cascade는 Argo CD 자신과
#   Namespace 14개를 지울 수 있어 되돌릴 컨트롤러조차 남지 않는다.
#
# syncPolicy: 계약 §Application 규약의 플랫폼 표준 그대로.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-traefik
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "60"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform
  source:
    repoURL: https://github.com/joshua92y/platform-gitops.git
    targetRevision: main
    path: platform/traefik
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
      - CreateNamespace=true
      - Prune=confirm
      - Delete=confirm
      - SkipDryRunOnMissingResource=true
