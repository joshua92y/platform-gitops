# clusters/oci-k3s/apps/platform-secret-stores.yaml — ClusterSecretStore 5개 Application (T045 G2)
#
# 역할: root(app-of-apps)가 이 파일을 읽어 child Application `platform-secret-stores`를 만들고,
#   그 Application이 `platform/secret-stores`(ClusterSecretStore 5장)를 서버 사이드 적용한다.
#
# 왜 `platform-external-secrets`와 다른 Application인가(설계 D2 — **health 격리**): Argo 3.5.2의 내장 health Lua가 store
#   `Ready=False`를 Degraded로 보고, argocd-cm의 Application health Lua가 child의 health를 root로 전파한다. store는 Vault가
#   살아 있어야 Ready인데 Vault는 ESO보다 뒤 wave다 → 한 Application에 두면 Vault가 불가한 동안 **ESO Application 자체가**
#   Degraded가 된다. 분리하면 (a) ESO Application은 store 상태와 무관하게 Healthy로 남고, (b) store만 단독으로 revert할 수 있으며,
#   (c) ESO webhook(`failurePolicy: Fail`)이 Ready가 된 뒤에 CR이 적용되므로 첫 sync의 admission 순환도 사라진다.
#
# ⚠ root가 이 wave에서 '기다린다'는 말은 틀리다(Argo CD v3.5.2 소스 판독 — 라이브 미실측 VD-11).
#   store Ready=False → 이 Application Degraded → root **health** Degraded(하네스 argo-1 FAIL)까지는 맞다. 그러나 root **sync**는
#   이 Application CR을 처음 만드는 operation에서 이 wave task가 Degraded로 실패할 뿐이고, 10초 뒤 첫 retry부터는
#   `ApplyOutOfSyncOnly=true`가 이미 만들어진 in-sync CR을 걸러내 다음 wave로 진행한다 — 잠시 실패한 뒤 지나간다.
#   뒤 wave까지 연속 실패로 retry 5회(10s×2, 최대 3m ≈ 310s)가 소진돼도 실패한 wave의 CR은 이미 생성돼 있어 보통 root는
#   `Synced/Degraded`로 끝나고 수동 조치가 필요 없다. CR이 미생성으로 남은 경우에만 `argocd app sync root`나 새 커밋으로 재개한다.
#   콜드 부트스트랩의 실제 대기 지점은 Vault wave다(init 전 `Synced Progressing` — Progressing이 진짜 대기).
#   Vault 시드는 Argo가 기다려 주지 않으므로 순서는 런북 절차로 보장한다(`platform/secret-stores/README.md` §1).
#
# sync-wave·destination.namespace: 값의 정본은 계약 contracts/gitops-repo.md §sync-wave 단일 표이고,
#   코드 사본은 tests/validate.sh의 WAVE_TABLE 하나뿐이다. 아래 두 값은 그 표에서 기계적으로 읽어 넣었고
#   저장소의 어떤 README·주석·PR 본문에도 숫자를 다시 적지 않는다. 대조는 사람이 아니라 검사 7.1이 한다.
#
# finalizer 있음(`resources-finalizer.argocd.argoproj.io`): 이 Application을 지우면 store 5장도 함께 정리된다.
#   `Delete=confirm`이 있어 삭제에는 승인 어노테이션(`argocd.argoproj.io/deletion-approved`)이 한 겹 더 필요하다.
#   store 삭제 자체는 ESO webhook이 Ready인 동안에만 통과한다(`platform/external-secrets/README.md` §4).
#
# syncPolicy: 계약 §Application 규약의 플랫폼 표준 그대로(`platform-external-secrets`와 동일).
#   `CreateNamespace=true`는 `platform/policies`가 Namespace 14개의 선언 정본이라 실질 no-op이고,
#   `Prune=confirm`·`Delete=confirm`은 실수 삭제를 승인 뒤로 미룬다.
#   ⚠ `SkipDryRunOnMissingResource=true`는 CRD 미존재 시의 **dry-run만** 건너뛴다 — ESO admission webhook의 거부는
#      우회하지 못한다. 그래서 이 Application의 선행조건은 ESO Application Healthy(webhook Ready)다.
#
# destination.namespace는 형식상의 값이다 — ClusterSecretStore는 클러스터 범위 객체라 어느 ns에도 들어가지 않는다.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-secret-stores
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "15"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform
  source:
    repoURL: https://github.com/joshua92y/platform-gitops.git
    targetRevision: main
    path: platform/secret-stores
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
      - CreateNamespace=true
      - Prune=confirm
      - Delete=confirm
      - SkipDryRunOnMissingResource=true
