# clusters/oci-k3s/apps/platform-secrets.yaml — `secrets/<ns>/`의 ExternalSecret 적용 Application (T045 G3)
#
# 역할: root(app-of-apps)가 이 파일을 읽어 child Application `platform-secrets`를 만들고,
#   그 Application이 `platform/secrets`(= `secrets/<ns>/`를 base로 끌어오는 배달자)를 서버 사이드 적용한다.
#   지금 담기는 것은 ExternalSecret 1장(`cert-manager/cloudflare-dns-token`)이고, 터널 토큰 ES는 G4에서 한 줄 추가된다.
#
# 왜 소비자 컴포넌트에 ES를 넣지 않고 별도 Application인가(설계 D3 = B):
#   ESO의 admission webhook은 `failurePolicy: Fail`이라 webhook이 불가한 동안 ExternalSecret을 담은 Application은
#   sync **전체**가 실패한다. ES를 `platform/cloudflared`·`platform/cert-manager-issuers`에 넣으면 그 순간
#   **터널 Deployment 수정도 Argo로 밀 수 없게 된다**(장애 대응 경로가 좁아진다). 분리의 효과는 장애 제거가 아니라
#   **소비자 배포와 ExternalSecret 적용 작업의 분리**다.
#   또 원본을 `secrets/`에 남겨 둬야 validate 3.2(scope↔위치, 트리거가 경로 `^secrets/`)가 살아 있다 —
#   원본을 `platform/` 아래로 옮기면 그 검사가 조용히 꺼진다(`../../../platform/secrets/kustomization.yaml` 머리 주석).
#
# ⚠ Vault·ESO가 불가하면 이 Application은 Degraded가 되고 root **health**도 Degraded가 된다(하네스 argo-1 FAIL).
#   그러나 root **sync**는 이 wave에서 기다리지 않는다 — 이 Application CR을 처음 만드는 operation에서 그 wave task만
#   실패하고, 10초 뒤 retry부터 `ApplyOutOfSyncOnly=true`가 이미 만들어진 CR을 걸러내 다음 wave로 진행한다
#   (Argo CD v3.5.2 소스 판독 · 라이브 미실측 VD-11 — `../../../platform/secret-stores/README.md` §0).
#   선행조건(ESO webhook Ready · store `vault-platform` Ready · **kv 시드 완료**)은 Argo가 아니라 런북 절차가 보장한다.
#
# sync-wave·destination.namespace: 값의 정본은 계약 contracts/gitops-repo.md §sync-wave 단일 표이고,
#   코드 사본은 tests/validate.sh의 WAVE_TABLE 하나뿐이다. 아래 두 값은 그 표에서 기계적으로 읽어 넣었고
#   저장소의 어떤 README·주석·PR 본문에도 숫자를 다시 적지 않는다. 대조는 사람이 아니라 검사 7.1이 한다.
#   표의 3열이 `-`인 것은 이 컴포넌트가 한 네임스페이스에 살지 않는다는 뜻이라(ES가 `cert-manager`·`cloudflared`에 걸린다)
#   destination.namespace는 표 규칙대로 `kube-system`을 쓴다(`platform-policies`와 같은 처리 — 그 파일 머리 주석).
#   이 값은 ns가 없는 객체의 기본값일 뿐이고, 이 소스의 ExternalSecret은 전부 자기 `metadata.namespace`를 명시한다.
#   AppProject `platform`의 destinations에는 `cert-manager`·`cloudflared`가 모두 들어 있다(`../projects/platform.yaml`).
#
# finalizer(`resources-finalizer.argocd.argoproj.io`)는 있지만 **이 소스의 ExternalSecret은 cascade에서 빠진다.**
#   ES에 `argocd.argoproj.io/sync-options: Delete=false,Prune=false`가 붙어 있고, Argo CD v3.5.2의 `shouldBeDeleted`는
#   리소스 어노테이션의 `Delete` 값을 앱 수준 `Delete=confirm`보다 **먼저** 읽어 값이 `false`면 삭제 대상에서 뺀다
#   (`controller/appcontroller.go` — 소스 판독 · 라이브 미실측). 삭제 대상이 0건이라 승인 어노테이션
#   (`argocd.argoproj.io/deletion-approved`)도 요구되지 않는다.
#   ⚠ 그래서 **이 Application을 지워도 ES는 남아 계속 조정한다**(Argo 추적만 끊긴다 — 5분마다 kv 값이 Secret에 다시 쓰인다).
#     "Application을 지우면 인수가 해제된다"는 틀렸다. 인수를 멈추는 절차는 `../../../platform/secrets/README.md` §5뿐이다.
#   ⚠ Secret은 어느 경우에도 남는다 — 두 ES 모두 `creationPolicy: Orphan`이라 ownerReference가 없다
#     (`Owner`였다면 **ES가 지워지는 어떤 경로에서든**(kubectl delete · `Delete=false`가 빠진 cascade) Secret이 GC된다 —
#     설계 D4 = B′, `../../../secrets/README.md`).
#
# syncPolicy: 계약 §Application 규약의 플랫폼 표준 그대로(`platform-secret-stores`와 동일).
#   `CreateNamespace=true`는 `platform/policies`가 Namespace 14개의 선언 정본이라 실질 no-op이고,
#   `Prune=confirm`·`Delete=confirm`은 실수 삭제를 승인 뒤로 미룬다.
#   ⚠ `SkipDryRunOnMissingResource=true`는 CRD 미존재 시의 **dry-run만** 건너뛴다 — ESO admission webhook의 거부는
#      우회하지 못한다. 그래서 이 Application의 선행조건은 ESO Application Healthy(webhook Ready)다.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-secrets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "18"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform
  source:
    repoURL: https://github.com/joshua92y/platform-gitops.git
    targetRevision: main
    path: platform/secrets
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
      - CreateNamespace=true
      - Prune=confirm
      - Delete=confirm
      - SkipDryRunOnMissingResource=true
