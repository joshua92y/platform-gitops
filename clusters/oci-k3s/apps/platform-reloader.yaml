# clusters/oci-k3s/apps/platform-reloader.yaml — Stakater Reloader Application (T041 PR-C)
#
# 역할: root(app-of-apps)가 이 파일을 읽어 child Application `platform-reloader`를 만들고,
#   그 Application이 `platform/reloader`를 서버 사이드 적용한다.
#
# 현재 상태(T046 G1): `platform/reloader/kustomization.yaml`이 차트 2.2.16(appVersion v1.4.21)을 kustomize `helmCharts`로
#   인플레이트한다 — **scoped 모드**(감시 ns `identity`·`jt-dev`·`jt-prod` + 릴리스 ns `reloader` · ClusterRole·ClusterRoleBinding 0 ·
#   감시 ns마다 Role/RoleBinding) + VD-9 시험 대상 Deployment `jt-dev/vd9-probe`(일시 — 판정 뒤 제거 PR에서 지운다).
#   그래서 이 Application은 destination ns(`reloader`) 밖의 `identity`·`jt-dev`·`jt-prod`에도 객체를 만든다 — AppProject
#   `platform`의 destinations(네임스페이스 표 14개 전부)가 그것을 허용한다. 감시 ns 목록의 정본은 계약 §네임스페이스의
#   `platform/reloader/` 항목이고, 렌더 가드는 `tests/validate.sh` 10 REL, 렌더 대조·VD-9 절차·뒷정리·되돌리기는
#   `platform/reloader/README.md`다. 아래 syncPolicy가 `prune: false`라 Git에서 지운 객체(시험 대상 · revert 뒤의 차트 객체)는
#   운영자가 지운다. 이 파일의 매니페스트 값은 T041 그대로다(T046은 주석만 바꿨다).
#
# sync-wave·destination.namespace: 값의 정본은 계약 contracts/gitops-repo.md §sync-wave 단일 표이고,
#   코드 사본은 tests/validate.sh의 WAVE_TABLE 하나뿐이다. 아래 두 값은 그 표에서 기계적으로 읽어 넣었고
#   저장소의 어떤 README·주석·PR 본문에도 숫자를 다시 적지 않는다. 대조는 사람이 아니라 검사 7.1이 한다.
#
# finalizer 있음(`resources-finalizer.argocd.argoproj.io`): 이 Application을 지우면 컴포넌트 리소스도 함께 정리된다.
#   `Delete=confirm`이 있어 삭제에는 승인 어노테이션(`argocd.argoproj.io/deletion-approved`)이 한 겹 더 필요하다.
#   finalizer를 빼는 것은 `platform-argocd`·`platform-policies` 둘뿐이다 — 그 둘의 cascade는 Argo CD 자신과
#   Namespace 14개를 지울 수 있어 되돌릴 컨트롤러조차 남지 않는다.
#
# syncPolicy: 계약 §Application 규약의 플랫폼 표준 그대로. `CreateNamespace=true`는 PR-B2의 platform/policies가
#   Namespace 14개의 선언 정본이라 실질 no-op이다.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-reloader
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "60"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform
  source:
    repoURL: https://github.com/joshua92y/platform-gitops.git
    targetRevision: main
    path: platform/reloader
  destination:
    server: https://kubernetes.default.svc
    namespace: reloader
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
      - CreateNamespace=true
      - Prune=confirm
      - Delete=confirm
      - SkipDryRunOnMissingResource=true
