# clusters/oci-k3s/apps/platform-cloudflared.yaml — Cloudflare 터널 커넥터 Application (T041 PR-C)
#
# 역할: root(app-of-apps)가 이 파일을 읽어 child Application `platform-cloudflared`를 만들고,
#   그 Application이 `platform/cloudflared`(T039)를 서버 사이드 적용한다.
#
# 성격 — 새 워크로드가 아니라 **소유권 이동(인수)**이다(PR-C에서 이 성격을 갖는 유일한 Application).
#   `platform/cloudflared/deployment.yaml`은 T039에서 운영자가 `kubectl apply -k`로 이미 클러스터에 넣어 둔 것이고,
#   이 Application은 같은 렌더 결과를 SSA로 다시 적용해 필드 소유자를 `argocd-controller`로 옮긴다.
#   Argo CD의 SSA 경로는 항상 force conflicts라(gitops-engine `pkg/utils/kube/resource_ops.go:469`) 소유권 충돌이
#   오류로 표면화되지 않고 그대로 넘어간다. 렌더 결과가 같으면 no-op이다.
#   이 터널이 SSH·kubectl의 **유일한 경로**이므로(계약 hostnames-and-access.md), 확인은 "끊기지 않았는가"가 전부다.
#
# 운영자 확인 기준값(설계 §8 PR-C):
#   - `kubectl -n cloudflared get pods -o wide` — 파드 이름·AGE 불변(= no-op 인수)이거나, 스펙 차이가 있어 롤아웃이
#     나더라도 Deployment 전략(`maxSurge: 0`·`maxUnavailable: 1`)대로 **1개씩** 교체된다. 교체 중에도 남은 커넥터
#     1개가 터널을 유지한다. 두 파드가 동시에 사라지면 인수가 아니라 스펙 차이다 —
#     되돌리기 전에 `kubectl -n argocd get app platform-cloudflared -o jsonpath='{.status.operationState.syncResult}'`로
#     차이 필드를 먼저 기록한다(Server-Side Diff에서 계속 OutOfSync인 필드는 `ignoreDifferences` 후보).
#   - `kubectl -n cloudflared get deploy cloudflared -o jsonpath='{.metadata.managedFields[*].manager}'`에
#     `argocd-controller`가 포함되면 인수 완료.
#   - Secret `cloudflared-tunnel`은 운영자 수동 생성분이고 이 소스에 없다 — Argo CD가 지우거나 덮어쓰지 않는다
#     (`prune: false`). T045 뒤 `secrets/cloudflared/` ExternalSecret으로 교체하는 것은 별도 태스크다.
#
# sync-wave·destination.namespace: 값의 정본은 계약 contracts/gitops-repo.md §sync-wave 단일 표이고,
#   코드 사본은 tests/validate.sh의 WAVE_TABLE 하나뿐이다. 아래 두 값은 그 표에서 기계적으로 읽어 넣었고
#   저장소의 어떤 README·주석·PR 본문에도 숫자를 다시 적지 않는다. 대조는 사람이 아니라 검사 7.1이 한다.
#
# finalizer 있음(`resources-finalizer.argocd.argoproj.io`): 이 Application을 지우면 커넥터 Deployment도 함께 지워진다
#   = 터널이 끊기고 접근 경로가 사라진다. `Delete=confirm` 승인 어노테이션(`argocd.argoproj.io/deletion-approved`)이
#   그 앞을 막는 한 겹이다. 삭제가 필요하면 먼저 노드 A 대화형 SSH 세션(런북 §6의 비상 절차)을 확보한다.
#   finalizer를 빼는 것은 `platform-argocd`·`platform-policies` 둘뿐이다 — 그 둘의 cascade는 Argo CD 자신과
#   Namespace 14개를 지울 수 있어 되돌릴 컨트롤러조차 남지 않는다.
#
# syncPolicy: 계약 §Application 규약의 플랫폼 표준 그대로. `CreateNamespace=true`는 PR-B2의 platform/policies가
#   Namespace 14개의 선언 정본이라 실질 no-op이다.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-cloudflared
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "60"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform
  source:
    repoURL: https://github.com/joshua92y/platform-gitops.git
    targetRevision: main
    path: platform/cloudflared
  destination:
    server: https://kubernetes.default.svc
    namespace: cloudflared
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
      - CreateNamespace=true
      - Prune=confirm
      - Delete=confirm
      - SkipDryRunOnMissingResource=true
