# platform/kafka-topics/kafkatopics.yaml — Strimzi `KafkaTopic` 4(ns data) — 리소스 wave 1 (T056)
#
# 토픽 이름(모노레포 data-model §6 토픽 이름 행 · tasks.md T056 문면): prod `<pod>.<entity>.<event>` · dev `dev.<pod>.<entity>.<event>` · DLQ `<pod>.dlq` / `dev.<pod>.dlq`
#   → `identity-admin.session.revoked` · `dev.identity-admin.session.revoked` · `identity-admin.dlq` · `dev.identity-admin.dlq`.
#   `metadata.name` = 토픽 이름 **그대로**(넷 다 DNS 서브도메인으로 유효 — 소문자 · 숫자 · `-` · `.`) → `spec.topicName`은 적지 않는다(CRD 043 설명 "It is recommended to
#   not set this unless the topic name is not a valid Kubernetes resource name" · TO는 없으면 metadata.name을 쓴다 — 하네스 topic-1도 같은 규칙으로 이름을 읽는다).
#   같은 토픽 이름을 두 CR이 선언하지 않는다(하네스 topic-1 FAIL · TO도 뒤 CR을 충돌로 거부한다). 생성 뒤 이름 변경은 TO가 `NotSupported`로 거부한다
#   (BatchingTopicController.java :699–706) — 새 이름 = 새 토픽(새 CR)이다.
# spec(data-model §6 파티션 · 보존 · 복제 행 · research STRIMZI-D6): `partitions: 3`(파티션 키 = 봉투 `tenantid`) · `replicas: 1`(브로커 1대) ·
#   config `retention.ms: 604800000`(7일) · `cleanup.policy: delete` · `min.insync.replicas: 1`(복제 1과 같다 — TO의 "RF < min ISR" 경고 조건 밖 ·
#   BatchingTopicController.java :812–834). 숫자는 숫자로 적는다(CRD `config`는 preserve-unknown-fields 자유 객체 · TO가 문자열로 바꿔 Kafka에 넘긴다 ·
#   하네스 topic-1은 문자열/숫자 둘 다 받는다). 파티션 수는 **줄일 수 없다**(:690–692 `NotSupported`) · 복제 수 변경은 Cruise Control이 있어야 한다(없으면
#   `NotSupported` "Replication factor change not supported" — :780–786 · 이 클러스터에는 CC가 없다).
# TO 선택: 라벨 `strimzi.io/cluster: jt-kafka`(CO가 TO에 env `STRIMZI_RESOURCE_LABELS`를 준다 — EntityTopicOperator.java :117 · :190 · 라벨이 다르면 TO가 이 CR을
#   **무시**한다 — BatchingTopicController.java :262–268). Kafka `auto.create.topics.enable: "false"`(T055)라 토픽은 이 CR로만 생긴다.
# Argo health(v3.5.2 resource_customizations/kafka.strimzi.io/KafkaTopic/health.lua): 조건 `NotReady`=True → Degraded · `Ready`=True → Healthy · 그 밖 Progressing
#   "Waiting for Kafka Topic". ⚠ TO는 실패를 `Ready`=**False**(reason · message)로 쓰고 `NotReady`를 쓰지 않는다(BatchingTopicController.java :902–919 · 성공은
#   :867–880 `Ready`=True) → KafkaTopic 오류는 Argo에서 **Degraded가 아니라 Progressing으로 남는다** — 판정은 조건의 reason/message로 한다(README §1 증상표).
# ⚠ **CR 삭제 = Kafka 토픽 삭제(데이터 삭제)**: TO는 기본(`STRIMZI_USE_FINALIZERS` = true — TopicOperatorConfig.java :72)으로 finalizer `strimzi.io/topic-operator`를
#   단다(KubernetesHandler.java :24 · :49–60) — CR을 지우면 TO가 토픽을 지운 뒤 finalizer를 뗀다. TO가 멈춰 있으면 삭제가 Terminating에 멈춘다(업스트림
#   documentation/modules/operators/con-deleting-managed-topics.adoc · 제거 절차는 con-removing-topic-finalizers.adoc · research STRIMZI-D11 — README §5).
#   계약 §삭제 보호 목록 밖이라 객체 어노테이션이 없다(컨트롤러 결정 D4) — Application `prune: false` + `Delete=confirm`은 Argo 경로만 막는다.
# 리소스 wave "1" — KafkaUser · CA 미러 ExternalSecret과 같은 마지막 wave(Degraded 격리 — README §1). Application 표의 숫자가 아니다(kustomization 머리 주석).

# --- prod ---------------------------------------------------------------------------------------------------------------
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: identity-admin.session.revoked
  namespace: data
  labels:
    strimzi.io/cluster: jt-kafka               # TO 선택자 · 하네스 Select-Cluster
  annotations:
    argocd.argoproj.io/sync-wave: "1"          # 리소스 수준 wave. Application 표의 숫자가 아니다
spec:
  partitions: 3
  replicas: 1
  config:
    retention.ms: 604800000                    # 7일
    cleanup.policy: delete
    min.insync.replicas: 1
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: identity-admin.dlq
  namespace: data
  labels:
    strimzi.io/cluster: jt-kafka
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  partitions: 3
  replicas: 1
  config:
    retention.ms: 604800000
    cleanup.policy: delete
    min.insync.replicas: 1
---
