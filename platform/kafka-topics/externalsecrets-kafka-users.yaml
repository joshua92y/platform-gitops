# platform/kafka-topics/externalsecrets-kafka-users.yaml — KafkaUser 비밀번호 Secret 2장의 ExternalSecret(ns data) — 리소스 wave 0 (T056)
#
# 역할: `KafkaUser.spec.authentication.password.valueFrom.secretKeyRef`가 **이름으로** 가리키는 Secret을 Vault kv에서 만든다(kafkausers.yaml과 1:1).
#   이름 규칙(컨트롤러 결정 D2) = `kafka-user-<KafkaUser 이름>` — ES 이름 = Secret 이름(`target.name`).
#   **KafkaUser 이름과 같게 두지 않는 이유**: User Operator(UO)는 KafkaUser마다 **그 이름의** 자격 Secret(`identity-admin` — 키 `password` · `sasl.jaas.config`)을
#   직접 만들고 조정한다(Strimzi 1.2.0 KafkaUserModel.java :497–499 · :517–519 Secret 이름 = 접두 + 사용자 이름 — 접두 기본 ""(UserOperatorConfig.java :95)이고
#   Kafka CR에 `secretPrefix`가 없다 · :207–211 키 2개 · KafkaUserOperator.java :436–445). 같은 이름이면 ESO와 UO가 한 Secret을 번갈아 덮어쓴다.
#   ⚠ 이 ES(와 그 Secret)에 라벨 `strimzi.io/kind: KafkaUser`를 붙이지 않는다 — UO의 Secret 감시 선택자가 그 라벨이고(UserController.java :97–100 · :109),
#     그 Secret의 이벤트는 **Secret 이름과 같은 KafkaUser**(`kafka-user-identity-admin` — 없다)의 조정을 부르며(:145–155), KafkaUser가 없으면 UO는 삭제 경로로
#     그 이름의 Secret을 지운다(UserControllerLoop.java :104–115 · KafkaUserOperator.java :190–199 · :209–218).
#
# store · 경로(모노레포 data-model §6 사용자 행 · §8 `kv/{env}/kafka/<pod>` 키 `password` · 계약 gitops-repo.md §ExternalSecret 규약 · 컨트롤러 결정 D2):
#   prod `identity-admin`     ← store `vault-data` · `prod/kafka/identity-admin` 키 `password`
#   dev  `dev-identity-admin` ← store `vault-data` · `dev/kafka/identity-admin`  키 `password`(kv 경로의 `<pod>`는 env와 무관하게 `identity-admin`)
#   `remoteRef.key`에 `kv/` 접두를 붙이지 않는다 — store가 `path: kv` + `version: v2`라 ESO가 `kv/data/`를 붙인다(validate 3.1).
#   경로 lint = validate 3.3(이 디렉터리의 ES는 `vault-data` + 열거 접두 `{dev,prod}/kafka/…`). Vault 정책 eso-data가 `kv/data/{dev,prod}/kafka/*`를 이미 허용한다
#   (모노레포 infra/vault/policies.tf — 인프라 변경 0). store `vault-data`의 `conditions.namespaces`에 `data`가 있다(platform/secret-stores/).
#   같은 kv 값을 앱 ns가 `<pod>-env`(store `vault-{env}`)로 따로 읽는다 — 같은 비밀을 두 ns가 쓰면 store가 둘이다(data-model §8 머리 문단 · T072).
# kv 값(키 `password` 하나 — SCRAM 사용자 이름은 KafkaUser 이름이라 비밀이 아니다)은 운영자가 **머지 전** 시드한다(README §0 P1 · 모노레포 런북 bootstrap.md §4 T056).
#   UO는 이 Secret의 `password`를 base64 디코드한 값을 **그대로** SCRAM-SHA-512 비밀번호로 쓴다(KafkaUserModel.java :347–364 · Util.java :301–315 — 앞뒤 공백·개행을
#   지우지 않는다). Secret 없음 · 키 없음 · 빈 값은 조정 실패 → KafkaUser `NotReady`(KafkaUserOperator.java :296–316 · :353–368 — README §1 증상표).
#
# 근거 줄 번호 기준: Strimzi = 태그 1.2.0 · ESO = v2.10.0 · Argo CD = v3.5.2 — 근거 목록은 README §4 「소스로 확인한 사실」.
# target.template을 두지 않는다(컨트롤러 결정 D2): template이 없으면 Secret 키 = `data[].secretKey` 그대로(`password` 하나 — ESO v2.10.0
#   pkg/controllers/externalsecret/externalsecret_controller_template.go :60–64). template에 `data`(또는 `templateFrom`)를 두면 기본 mergePolicy Replace에서 Secret 키는
#   template의 것뿐이고 `data[]`의 secretKey는 템플릿 변수로만 쓰인다(:71–75) — `password`를 template에 다시 적지 않으면 KafkaUser가 읽을 키가 사라지는 함정이다.
#   대가(받아들인 사실): template이 없으면 ESO가 이 ES의 라벨·어노테이션(Argo tracking-id · 아래 sync-wave 포함)을 Secret에 복사한다(:147–152). Argo CD는 복사된
#   tracking-id가 그 객체 자신(종류·이름)과 다르면 관리 대상으로 세지 않는다(v3.5.2 controller/state.go :981–985 · :1282–1337 `isSelfReferencedObj` — 동기화 상태·prune 밖).
#   `template.metadata: {}`만 두는 방법도 키를 지키며 복사를 막지만(:71–75 noTemplate · :154–156) 이 디렉터리는 키 집합의 단순성을 택했다(README §4).
# creationPolicy Owner(계약 기본 — 새 Secret · 인수 아님) · deletionPolicy 미기재(CRD 기본 Retain — ownerReference GC는 막지 못한다). ES가 지워지면 Secret이 GC되고
#   UO는 다음 조정(주기 ≤ 2분 — UserOperatorConfig.java :87 기본 120000 ms)에서 Secret을 못 찾아 KafkaUser를 `NotReady`로 둔다 — **Kafka 쪽 SCRAM 자격·ACL은 그대로
#   남는다**(조정이 자격 계산 단계에서 실패해 Kafka 반영 단계로 가지 않는다 · 자격·ACL 삭제는 KafkaUser가 없어질 때만 — KafkaUserOperator.java :190–199 · :239–268 ·
#   README §5). 그래서 객체 삭제 보호 어노테이션은 붙이지 않는다(계약 §삭제 보호 목록 밖 · T054 ES 선례 · Application은 `prune: false`).
# refreshPolicy Periodic + refreshInterval 5m(계약 §공통 규칙 — CRD 기본값 1h를 쓰지 않는다). 회전 = kv 교체 → ≤ 5분 Secret 갱신 → UO의 다음 주기 조정(≤ 2분 — 이 Secret은
#   위 라벨 선택자 밖이라 UO가 이벤트로 깨지 않는다) → SCRAM 자격 갱신 — 앱 `<pod>-env`도 같은 kv를 ≤ 5분에 받는다(README §3 VD-9 · 회전 절차는 secret-rotation.md 후속).
# 리소스 wave "0" — KafkaUser("1")보다 먼저. Argo는 wave 0의 ES가 Healthy(Ready=True · SecretSynced)여야 wave 1로 간다(Argo CD v3.5.2
#   resource_customizations/external-secrets.io/ExternalSecret/health.lua: Ready=False → Degraded · Ready=True → Healthy · 그 밖 Progressing).
#   kv가 비거나 키 이름이 다르면 `SecretSyncedError` → Degraded → 그 sync 시도는 Failed. 이 Application은 예외 retry가 없는 표준 syncPolicy라 기본 retry(대기 10·20·40·80·160 s ≈ 5분 — 리뷰 r3 B1 정정)를
#   다 쓰면 같은 리비전으로 다시 시작하지 않는다 — 그래서 시드가 **머지 전** 선행 조건 P1이다(README §1 증상표). Application 표의 숫자가 아니다(kustomization 머리 주석).

# --- prod — KafkaUser `identity-admin` · store vault-data · kv prod/kafka/identity-admin ---------------------------------------
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kafka-user-identity-admin
  namespace: data
  annotations:
    argocd.argoproj.io/sync-wave: "0"          # 리소스 수준 wave — KafkaUser("1")보다 먼저. Application 표의 숫자가 아니다
spec:
  refreshPolicy: Periodic                      # 기본값에 의존하지 않는다(계약 §공통 규칙)
  refreshInterval: 5m                          # CRD 기본값 1h를 쓰지 않는다
  secretStoreRef: { kind: ClusterSecretStore, name: vault-data }
  target:
    name: kafka-user-identity-admin            # KafkaUser identity-admin의 secretKeyRef.name — UO 자격 Secret(identity-admin)과 겹치지 않는 이름
    creationPolicy: Owner                      # template 없음(머리 주석 — Secret 키 = data[].secretKey)
  data:
    - { secretKey: password, remoteRef: { key: prod/kafka/identity-admin, property: password } }
---
# --- dev — KafkaUser `dev-identity-admin` · store vault-data · kv dev/kafka/identity-admin -------------------------------------
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kafka-user-dev-identity-admin
  namespace: data
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  refreshPolicy: Periodic
  refreshInterval: 5m
  secretStoreRef: { kind: ClusterSecretStore, name: vault-data }
  target:
    name: kafka-user-dev-identity-admin
    creationPolicy: Owner
  data:
    - { secretKey: password, remoteRef: { key: dev/kafka/identity-admin, property: password } }
