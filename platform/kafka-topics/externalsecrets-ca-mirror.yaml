# platform/kafka-topics/externalsecrets-ca-mirror.yaml — CA 미러 ExternalSecret 5(ns identity · jt-dev · jt-prod) — 리소스 wave 1 (T056)
#
# 역할: ns `data`의 원본 CA Secret에서 **`ca.crt`만** 앱 ns로 복제한다(값은 Vault를 거치지 않는다 — data-model §8 "CA 미러는 kv가 아니다").
#   `pg-main-ca`(CNPG CA — T053 operator 생성 · 키 `ca.crt` · `ca.key`)        → `identity` · `jt-dev` · `jt-prod`(pod는 `/etc/pg/ca.crt`로 마운트 — `sslmode=verify-full`)
#   `jt-kafka-cluster-ca-cert`(Strimzi 클러스터 CA — T055 · 키 `ca.crt` · `ca.p12` · `ca.password`) → `jt-dev` · `jt-prod`(`identity`에는 Kafka 소비자가 없다)
#   범위의 정본 = tasks.md T056 문면 · 계약 gitops-repo.md §공통 규칙 CA 미러 문장(2026-10-16 정정본).
# 이름 규칙(컨트롤러 결정 D5 · 계약 같은 문장) = ES 이름 = `target.name` = `remoteRef.key` = **원본 Secret 이름**. 소비자가 그 이름으로 찾는다:
#   검사 Job(platform/policies/tests/ — job-kafka-assert.yaml `secretName: jt-kafka-cluster-ca-cert` · job-data-assert.yaml `secretName: pg-main-ca`) ·
#   모노레포 하네스 cluster.tests.ps1 `ca-1`(ns identity · jt-dev · jt-prod의 `pg-main-ca` — agent-view는 Secret을 못 읽으므로 **같은 이름의 ExternalSecret spec**으로 판정:
#   dataFrom 없음 · secretKey = property = `ca.crt` · key ∈ {pg-main-ca, jt-kafka-cluster-ca-cert} · template data 키 없음 · templateFrom 없음 · mergePolicy 미사용 ·
#   store `k8s-data-ca`) · 하네스 `eso-3`(ns별 허용 store: identity = vault-data · vault-platform · k8s-data-ca / jt-dev = vault-dev · k8s-data-ca / jt-prod = vault-prod · k8s-data-ca).
# store `k8s-data-ca`(platform/secret-stores/ — kubernetes provider · `remoteNamespace: data` · SA `eso-ca-reader` · `conditions.namespaces` = identity · jt-dev · jt-prod —
#   이 파일의 ns 셋과 같다). 읽기 권한은 Role `eso-ca-reader`(ns data)의 `resourceNames: [pg-main-ca, jt-kafka-cluster-ca-cert]` 두 이름 `get`뿐이다
#   (platform/external-secrets/rbac-eso-ca-reader.yaml — RBAC는 객체 단위라 `ca.key`를 막지 못한다. 막는 것은 아래 `property`다).
# ⚠ `remoteRef.property: ca.crt`가 유일한 방어선이다: kubernetes provider는 `property`가 비면 원본 Secret의 **모든 키(ca.key 포함)를 JSON 한 덩어리로** 돌려주고
#   (ESO v2.10.0 providers/v1/kubernetes/client.go :49–80 · :55–77), `dataFrom`은 키를 통째로 복사한다 — 둘 다 금지(validate 3.4 · tasks.md T056 문면 ·
#   미러 Secret에 `ca.key`가 있으면 T031 FAIL — CA 개인키로 서버·`streaming_replica` 인증서를 위조하면 `verify-full`이 무력화된다). `remoteRef.key` = 원본 Secret 이름
#   (:50 Get by name) · `property` = 그 Secret의 data 키(:448–468 — 없으면 "property ca.crt does not exist in data of secret …").
# target.template을 두지 않는다(컨트롤러 결정 D5): Secret 키 = `data[].secretKey` = `ca.crt` 하나(ESO externalsecret_controller_template.go :60–64). 대가 —
#   ES의 라벨·어노테이션(Argo tracking-id · sync-wave)이 미러 Secret에 복사된다(:147–152 · Argo는 종류·이름이 다른 복사본을 관리 대상으로 세지 않는다 —
#   v3.5.2 controller/state.go :981–985 · :1282–1337 · externalsecrets-kafka-users.yaml 머리 주석).
# creationPolicy Owner — 같은 이름의 Secret이 이미 있어도 ESO가 컨트롤러 참조를 걸고 data를 `ca.crt` 하나로 다시 쓴다(ESO v2.10.0 `externalsecret_controller.go`
#   :537–552 · :817–866 · `externalsecret_controller_template.go` :53–58 — 다른 컨트롤러가 이미 소유한 Secret이면 :838–842에서 실패) · 하네스 ca-1 SKIP은 같은 이름의
#   **ES**가 없다는 근거다(agent-view는 Secret을 읽지 못한다).
# refreshPolicy Periodic + refreshInterval 5m — 원본 CA가 바뀌면(Strimzi CA 갱신 · CNPG CA 재발급) ≤ 5분에 따라간다. Strimzi 갱신은 두 갈래다(README §5 CA 갱신 추종):
#   ⓐ 기본 갱신(`renew-certificate`) = 키를 유지한 채 `ca.crt`만 교체 — 같은 키라 구 서버 인증서도 새 `ca.crt`로 검증된다 → 미러가 5분 안에 따라가고 끊김 없음
#   ⓑ 키 교체(`strimzi.io/force-replace` 어노테이션 또는 `certificateExpirationPolicy: replace-key`) = 원본 Secret에만 구 CA가 `ca-<notAfter>.crt`로 병존 → 이 미러는
#      `ca.crt`뿐이라 구 CA가 오지 않는다 → 브로커 롤링이 끝나기 전에 재접속·truststore 재로드한 소비자는 TLS 실패 창
#   ⓒ 키 교체는 T084 · `secret-rotation.md`(후속) 절차로 다룬다(예: 롤링 완료 뒤 소비자 재시작 · 또는 그 기간만 구 CA 항목도 미러 — validate 3.4 개정이 먼저)
#   — 근거 Strimzi 1.2.0 `InternalCa.java` :442–462 · :729–739 · `Ca.java` :159–162 · :621–630 · `con-certificate-renewal.adoc` :87–91 · `proc-replacing-private-keys.adoc` :45–53.
# ES를 지우면 미러 Secret이 GC된다(ownerReference) — 그 Secret을 마운트한 파드는 다음 기동에 실패한다.
# 리소스 wave "1"(KafkaUser · KafkaTopic과 같은 마지막 wave) — 이 ES가 Degraded(RBAC · 원본 없음)여도 Application operation은 실패하지 않는다(README §1 · 컨트롤러 결정 D7).
#   Argo health(v3.5.2 external-secrets.io/ExternalSecret/health.lua): Ready=False → Degraded · Ready=True → Healthy. Application 표의 숫자가 아니다(kustomization 머리 주석).

# --- pg-main-ca(CNPG CA) → identity · jt-dev · jt-prod -------------------------------------------------------------------
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pg-main-ca
  namespace: identity
  annotations:
    argocd.argoproj.io/sync-wave: "1"          # 리소스 수준 wave — 마지막 wave(Degraded 격리). Application 표의 숫자가 아니다
spec:
  refreshPolicy: Periodic                      # 기본값에 의존하지 않는다(계약 §공통 규칙)
  refreshInterval: 5m                          # 원본 CA 갱신 추종
  secretStoreRef: { kind: ClusterSecretStore, name: k8s-data-ca }
  target:
    name: pg-main-ca                           # = 원본 이름(소비자가 이 이름으로 마운트)
    creationPolicy: Owner
  data:
    - { secretKey: ca.crt, remoteRef: { key: pg-main-ca, property: ca.crt } }    # ca.crt만 — dataFrom · property 생략 금지(ca.key 복제)
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pg-main-ca
  namespace: jt-dev
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  refreshPolicy: Periodic
  refreshInterval: 5m
  secretStoreRef: { kind: ClusterSecretStore, name: k8s-data-ca }
  target:
    name: pg-main-ca
    creationPolicy: Owner
  data:
    - { secretKey: ca.crt, remoteRef: { key: pg-main-ca, property: ca.crt } }
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pg-main-ca
  namespace: jt-prod
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  refreshPolicy: Periodic
  refreshInterval: 5m
  secretStoreRef: { kind: ClusterSecretStore, name: k8s-data-ca }
  target:
    name: pg-main-ca
    creationPolicy: Owner
  data:
    - { secretKey: ca.crt, remoteRef: { key: pg-main-ca, property: ca.crt } }
---
# --- jt-kafka-cluster-ca-cert(Strimzi 클러스터 CA) → jt-dev · jt-prod ------------------------------------------------------
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: jt-kafka-cluster-ca-cert
  namespace: jt-dev
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  refreshPolicy: Periodic
  refreshInterval: 5m
  secretStoreRef: { kind: ClusterSecretStore, name: k8s-data-ca }
  target:
    name: jt-kafka-cluster-ca-cert
    creationPolicy: Owner
  data:
    - { secretKey: ca.crt, remoteRef: { key: jt-kafka-cluster-ca-cert, property: ca.crt } }   # ca.p12 · ca.password는 복제하지 않는다(PEM만 쓴다)
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: jt-kafka-cluster-ca-cert
  namespace: jt-prod
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  refreshPolicy: Periodic
  refreshInterval: 5m
  secretStoreRef: { kind: ClusterSecretStore, name: k8s-data-ca }
  target:
    name: jt-kafka-cluster-ca-cert
    creationPolicy: Owner
  data:
    - { secretKey: ca.crt, remoteRef: { key: jt-kafka-cluster-ca-cert, property: ca.crt } }
