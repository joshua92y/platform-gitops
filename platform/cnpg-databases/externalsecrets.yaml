# platform/cnpg-databases/externalsecrets.yaml — DatabaseRole 비밀번호 Secret 6장의 ExternalSecret(ns data) — 리소스 wave 0 (T054)
#
# 역할: CNPG `DatabaseRole.spec.passwordSecret`이 **이름으로** 가리키는 Secret을 Vault kv에서 만든다(databaseroles.yaml과 1:1).
#   이름 규칙(컨트롤러 결정 D2) = `pg-main-<role 이름의 _를 ->` — ES 이름 = Secret 이름(`target.name`) = DatabaseRole 이름(추적 1:1).
# store · 경로(모노레포 data-model §7 비밀 행 · §8 · 계약 gitops-repo.md §공유 컴포넌트 비밀 · 컨트롤러 결정 D3):
#   pod role 4   = store `vault-data`     · `prod/db/identity_admin/{owner,app}` · `dev/db/dev_identity_admin/{owner,app}`
#   공유 owner 2 = store `vault-platform` · `platform/db/{authentik,openfga}/owner`(Authentik·OpenFGA는 pod가 아니라 env 접두 없음)
#   `remoteRef.key`에 `kv/` 접두를 붙이지 않는다 — store가 `path: kv` + `version: v2`라 ESO가 `kv/data/`를 붙인다(validate 3.1).
#   경로 lint = validate 3.3(이 디렉터리의 ES는 `vault-data` + 열거 접두 `{dev,prod}/db/…` 또는 `vault-platform` + `platform/`만).
#   Vault 정책은 이미 허용한다(모노레포 infra/vault/policies.tf — eso-data `kv/data/{dev,prod}/db/*` · eso-platform `kv/data/platform/*`).
#   두 store 모두 `conditions.namespaces`에 `data`가 있다(platform/secret-stores/).
# kv 값(키 `username` · `password` · `url`)은 운영자가 **머지 전** 시드한다(README §0 P3 — 모노레포 운영자 블록 · 런북 bootstrap.md §4).
#   `url`은 여기서 매핑하지 않는다 — DatabaseRole은 username/password만 쓴다(`url`은 pod의 `<pod>-env`·`<pod>-migrate`가 `vault-{env}`로 읽는다).
#
# 근거 줄 번호 기준: CNPG = 배포본 태그 v1.30.0(release-1.30 브랜치와 다르다) · ESO = v2.10.0 · Argo CD = v3.5.2 — 근거 목록은 README §4 「소스로 확인한 사실」.
# target.template(ESO 2.10.0 CRD — 저장소 렌더 `platform/external-secrets`로 대조: template.type string · data map[string]string ·
#   metadata.labels · engineVersion 기본 v2 · mergePolicy 기본 Replace):
#   - `type: kubernetes.io/basic-auth` — CNPG CRD passwordSecret 설명("must follow the kubernetes.io/basic-auth format and contain both a username and a
#     password field"). CNPG 1.30 인스턴스 매니저는 type을 검사하지 않고 키 `username`·`password`의 존재만 본다(internal/management/utils/secrets.go:32–44) —
#     type은 형식 선언이다. ESO는 template.type이 있으면 Secret type을 그 값으로 둔다(externalsecret_controller_template.go:67–69).
#   - `metadata.labels: {cnpg.io/reload: "true"}` — CNPG operator는 이 라벨(**키만** 본다 — internal/controller/cluster_predicates.go:134–137)이 붙은 Secret의
#     생성·변경·삭제만 감시해 그 Secret을 참조하는 DatabaseRole의 상태 조건 `PasswordSecretChange`에 Secret resourceVersion을 적고, 인스턴스 매니저가 그
#     상태 변화로 비밀번호를 다시 적용한다(internal/controller/databaserole_controller.go:108–170 · :174–187 · :206–210). 인스턴스 매니저는 Secret을 watch하지
#     않는다(같은 파일 :144–155 주석) → **라벨이 없으면 Secret 변경이 operator를 깨우지 않아 회전 반영이 그 DatabaseRole의 다음 이벤트까지 지연된다**
#     (DatabaseRole 변경 · Cluster spec 변경 때 operator가 현재 Secret resourceVersion으로 조건을 다시 쓴다 — :78 · :204 · :224–228).
#   - template이 있으면 ESO는 ES의 라벨·어노테이션(Argo tracking 포함)을 Secret에 복사하지 않고 template.metadata의 것만 붙인다(ESO v2.10.0
#     pkg/controllers/externalsecret/externalsecret_controller_template.go setMetadata :148–156 — ES 메타데이터 복사는 `Template == nil`일 때만).
#     그 밖의 라벨·어노테이션은 두지 않는다(계약 §공통 규칙 · D2). ESO 자신의 `reconcile.external-secrets.io/*` 표식은 따로 붙는다.
#   - `data`: `username`·`password` ← kv 같은 이름 속성(템플릿 v2). mergePolicy Replace(기본) = Secret 키는 이 둘뿐(:72–76 — `data[]`의 secretKey는
#     템플릿 변수로만 쓰인다).
# ⚠ kv `username` = **role 이름**이어야 한다: CNPG 1.30 인스턴스 매니저는 Secret의 username(앞뒤 공백 제거)이 role 이름과 다르면 그 role을 적용하지 않는다
#   (internal/management/controller/roles/runnable.go:366–369 "the username in secret %q does not match role %q" → DatabaseRole `status.applied=false`).
#   비밀번호도 **앞뒤 공백을 지운 값**이 적용된다(같은 함수 :372 `strings.TrimSpace`) — 시드 값에 앞뒤 공백·개행이 있으면 kv `url`의 비밀번호와 실제
#   비밀번호가 어긋난다(README §4).
# creationPolicy Owner(계약 기본 — 새 Secret · 인수 아님) · deletionPolicy 미기재(CRD 기본 Retain). ES가 지워지면 ownerReference GC로 Secret이 사라지지만
#   **PG role의 비밀번호는 그대로**다 — role을 바꾸지 않는다. DatabaseRole status도 곧바로 바뀌지 않는다: operator는 Secret NotFound면 조건을 바꾸지 않고
#   (internal/controller/databaserole_controller.go:125–134 `return nil`), 인스턴스 매니저는 Secret을 watch하지 않아 다음 재조정 이벤트(spec 변경 · Cluster spec 변경 · Secret 재생성)까지
#   `applied=true`가 남는다 — 그때 detectMissingPasswordSecret(internal/management/controller/databaserole_controller.go:200–219)이 `applied=false`로 표시한다.
#   Secret 존재는 ES 상태(README VD-1)로 본다. 그래서 객체 삭제 보호 어노테이션은 붙이지 않는다
#   (계약 §삭제 보호 목록에 없음 · 컨트롤러 결정 D6 — Application은 `prune: false`).
# refreshPolicy Periodic + refreshInterval 5m(계약 §공통 규칙 — CRD 기본값 1h를 쓰지 않는다). 회전 = kv 교체 → ≤ 5분 Secret 갱신 → `cnpg.io/reload` →
#   인스턴스 매니저 `ALTER ROLE … PASSWORD …`(README §5 · VD-8).
# 리소스 wave "0" — DatabaseRole("1")보다 먼저. Argo는 wave 0의 ES가 Healthy(Ready=True · SecretSynced)여야 wave 1로 간다(Argo CD v3.5.2
#   resource_customizations/external-secrets.io/ExternalSecret/health.lua: Ready=False → Degraded · Ready=True → Healthy · 그 밖 Progressing).
#   kv가 비거나 키 이름이 다르면 `SecretSyncedError` → Degraded → 그 sync 시도는 Failed(README §1 증상표). Application 표의 숫자가 아니다(kustomization 머리 주석).
#   ⚠ 이 대기는 **첫 시도에만** 있다 — 재시도에서는 Application의 `ApplyOutOfSyncOnly`가 이미 적용된(in-sync) ES를 health와 무관하게 task에서 빼므로 Degraded ES를
#     다시 기다리지 않는다(gitops-engine sync_context.go:761–773 · README §1 「첫 시도에만」 문단).

# --- pod role(prod) — store vault-data · kv prod/db/identity_admin/{owner,app} ---------------------------------------------
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pg-main-identity-admin-owner
  namespace: data
  annotations:
    argocd.argoproj.io/sync-wave: "0"          # 리소스 수준 wave — DatabaseRole("1")보다 먼저. Application 표의 숫자가 아니다
spec:
  refreshPolicy: Periodic                      # 기본값에 의존하지 않는다(계약 §공통 규칙)
  refreshInterval: 5m                          # CRD 기본값 1h를 쓰지 않는다
  secretStoreRef: { kind: ClusterSecretStore, name: vault-data }
  target:
    name: pg-main-identity-admin-owner
    creationPolicy: Owner
    template:
      type: kubernetes.io/basic-auth
      metadata:
        labels:
          cnpg.io/reload: "true"               # operator가 감시하는 라벨 — 없으면 kv 회전 반영이 다음 이벤트까지 지연된다
      data:
        username: "{{ .username }}"
        password: "{{ .password }}"
  data:
    - { secretKey: username, remoteRef: { key: prod/db/identity_admin/owner, property: username } }
    - { secretKey: password, remoteRef: { key: prod/db/identity_admin/owner, property: password } }
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pg-main-identity-admin-app
  namespace: data
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  refreshPolicy: Periodic
  refreshInterval: 5m
  secretStoreRef: { kind: ClusterSecretStore, name: vault-data }
  target:
    name: pg-main-identity-admin-app
    creationPolicy: Owner
    template:
      type: kubernetes.io/basic-auth
      metadata:
        labels:
          cnpg.io/reload: "true"
      data:
        username: "{{ .username }}"
        password: "{{ .password }}"
  data:
    - { secretKey: username, remoteRef: { key: prod/db/identity_admin/app, property: username } }
    - { secretKey: password, remoteRef: { key: prod/db/identity_admin/app, property: password } }
---
