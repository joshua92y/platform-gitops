# cloudflared 터널 커넥터 — replica 2(노드 A·B 각 1개), remote-managed 터널.
#
# 터널 `joshuatech-tunnel`(id d0cf3291-f55a-415d-b305-5548c0ebd5bf)의 ingress 3개
# (`ssh-a` → 노드 A 22 · `ssh-b` → 노드 B 22 · `k8s` → `tcp://kubernetes.default.svc.cluster.local:6443` + catch-all 404)는
# OpenTofu `infra/cloudflare/tunnel.tf`(T011)가 Cloudflare 쪽 config로 선언한다(`config_src = "cloudflare"`).
# 따라서 이 pod는 **터널 설정 파일을 갖지 않고 실행 토큰만** 갖는다 — 설정을 여기서 중복 선언하지 않는다.
#
# 도달 경로(계약 network-policy.md 허용 매트릭스 cloudflared 행): 외부 7844·443(edge QUIC/HTTP2) ·
# 노드 A 22 · 노드 B 22 · `allow-kube-api`(노드 A 6443, `k8s` ingress가 ClusterIP를 거쳐 도착) · `allow-dns`.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared
  labels:
    app: cloudflared
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: cloudflared
  strategy:
    # maxSurge: 0 — 노드가 2개인데 아래 required anti-affinity가 pod를 노드당 1개로 묶으므로,
    # 기본값(replicas 2 → maxSurge 1)이면 세 번째 pod가 배치 불가로 영원히 Pending이 되어 롤아웃이 멈춘다.
    # surge 없이 1개씩 교체한다 — 교체 중에도 남은 커넥터 1개가 터널을 유지한다(Cloudflare는 replica를 HA로만 쓴다).
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app: cloudflared
    spec:
      # 계약 gitops-repo.md §Application 규약(워크로드 강화): cloudflared는 K8s API를 쓰지 않는다.
      automountServiceAccountToken: false
      affinity:
        podAntiAffinity:
          # required — 두 replica는 반드시 서로 다른 노드에 놓인다(노드 A 장애 시에도 `ssh-b`·edge 연결 유지).
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: cloudflared
              topologyKey: kubernetes.io/hostname
      securityContext:
        runAsNonRoot: true
        # 이미지 실측값과 동일한 UID·GID(distroless nonroot): config blob `config.User` = "65532:65532".
        # 명시하는 이유 — 이미지가 USER를 이름 형식으로 바꾸면 kubelet의 runAsNonRoot 판정이 깨지는데,
        # 숫자 UID를 매니페스트에 두면 그 회귀가 이 파일 밖에서 일어나도 pod는 계속 비루트로 뜬다.
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: cloudflared
          # 태그 + digest 병기(계약 §이미지·승격). digest는 Docker Hub registry v2 API로 조회한 manifest list
          # sha256(2026-09-04): linux/amd64 + linux/arm64 포함 — 노드 2대(Ampere A1, arm64)가 이 인덱스로 해결된다.
          image: cloudflare/cloudflared:2026.8.3@sha256:51c9cefcb4569df44e1ad403ab1d3d8065aa8e84339bcfc6aee75502e1140339
          # 이미지 ENTRYPOINT 실측값은 ["cloudflared", "--no-autoupdate"]다. command로 덮어써서 실행 인자를
          # 이 파일 한 곳에만 두고(플래그 중복 없음), 플래그 위치는 Cloudflare 문서의 형식을 그대로 따른다:
          #   cloudflared tunnel --no-autoupdate --metrics 0.0.0.0:2000 run
          command: [cloudflared]
          args:
            - tunnel
            - --no-autoupdate
            - --metrics
            - 0.0.0.0:2000
            - run
          env:
            # 토큰 값은 저장소에 없다. 최초는 운영자 수동 Secret(README ②), T045 뒤 ExternalSecret(README ⑨).
            - name: TUNNEL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: cloudflared-tunnel
                  key: TUNNEL_TOKEN
            # 이미지 WorkingDir가 /home/nonroot인데 루트 파일시스템은 읽기 전용이다. 예기치 않은 `~/…` 쓰기가
            # 생기더라도 쓰기 가능한 emptyDir로 떨어지도록 HOME을 /tmp로 둔다(토큰 실행 경로는 원래 디스크를 쓰지 않는다).
            - name: HOME
              value: /tmp
          ports:
            # 메트릭 포트는 프로브 도착지일 뿐이다 — Service도 scrape 대상도 만들지 않는다
            # (계약 network-policy.md의 monitoring scrape 목록에 cloudflared 2000이 없다. 추가하려면 계약을 먼저 고친다).
            - name: metrics
              containerPort: 2000
          # /ready 는 cloudflared 메트릭 서버의 엔드포인트로, 등록된 edge 연결이 있을 때만 200을 준다
          # (소스 실측: metrics/metrics.go 의 router.Handle("/ready", …)). 연결 0인 커넥터는 쓸모가 없으므로
          # liveness도 같은 엔드포인트를 보되, 짧은 edge 장애로 재시작이 몰리지 않게 failureThreshold를 넉넉히 둔다(≈60s).
          livenessProbe:
            httpGet:
              path: /ready
              port: metrics
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          readinessProbe:
            httpGet:
              path: /ready
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            # plan A14 노드 예산표의 cloudflared 몫 = 노드당 0.1 GiB. requests는 그 안(64Mi)에서 잡고,
            # limit은 누수 상한으로만 128Mi를 둔다. CPU limit은 두지 않는다 — QUIC 핸드셰이크·대용량 kubectl
            # 전송에서 버스트가 필요하고, 이 저장소는 CPU limit로 인한 스로틀링을 피하는 쪽을 택한다(계약의 LimitRange 방침과 같은 이유).
            # 실측(`kubectl top pod -n cloudflared`)으로 조정한다.
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
