# platform/secrets/kustomization.yaml — `secrets/<ns>/`의 **배달자**(T045 G3).
#   ExternalSecret 원본은 여기가 아니라 저장소 루트 `secrets/<ns>/`에 있다. 이 파일은 그것을 base로 끌어올 뿐이다.
#
# 왜 이런 모양인가(설계 D3 = B 확정):
#   · validate 3.2(scope↔위치: store `vault-platform` + key 접두 `platform/`)의 트리거가 **파일 경로 `^secrets/`**다 —
#     원본을 이 디렉터리로 옮기면 그 검사가 **조용히 꺼진다**. 옮기지 않는다.
#   · validate 7.1은 Application `platform-<comp>` ↔ `platform/<comp>`만 허용한다 → `secrets/`를 직접 가리키는
#     Application은 만들 수 없다. 그래서 `platform/` 아래에 배달자 컴포넌트를 둔다.
#   · 소비자 컴포넌트(`platform/cloudflared`·`platform/cert-manager-issuers`)가 base로 끌어가지 않는 이유: ESO webhook은
#     `failurePolicy: Fail`이라 webhook 장애 중에는 그 Application의 sync **전체**가 실패한다 — 터널 컴포넌트가 다른
#     오퍼레이터의 admission에 묶이면 안 된다(장애 대응 경로가 좁아진다).
#
# ⚠ **단일 소유(D3 조건 2)**: `../../secrets/*`를 base로 포함하는 kustomization은 이 파일 **하나뿐**이다. 소비자 kustomization에
#   같은 base를 넣으면 한 ExternalSecret을 두 Application이 각자 적용해 소유권이 갈린다. `tests/validate.sh` 검사 7.3이
#   정적으로 잡고(실행 수단·CI 배선 상태는 `tests/README.md` 「CI 배선 상태」 — CI 배선은 T047),
#   라이브에서는 각 ES의 Argo tracking 어노테이션으로 확인한다(README §3).
# ⚠ **범위(D3 조건 1)**: 이 컴포넌트는 DNS 토큰·터널 토큰 ExternalSecret **2장까지만** 담는다(G4에서 2장이 됐다).
#   CA 미러 ES는 원본(CNPG·Strimzi CA)이 생긴 뒤인 계약 §sync-wave 표의 `cnpg-databases`·`kafka-topics` 행 소유다(T056).
#   **새 ES를 추가할 때는 원본과 소비자의 wave를 먼저 확인한다**(README §0).
# ⚠ 이 컴포넌트의 효과는 "**소비자 배포와 ExternalSecret 적용 작업의 분리**"다(장애 제거가 아니다). Vault·ESO가 불가하면
#   이 Application과 `platform-secret-stores`는 Degraded가 되고 root **health**도 Degraded가 된다 — 그것은 그대로다.
#   다만 root **sync**는 이 wave에서 기다리지 않는다(첫 operation만 실패하고 retry부터 다음 wave로 진행한다 —
#   `../secret-stores/README.md` §0·§1, Argo CD v3.5.2 소스 판독 · 라이브 미실측 VD-11).
# ⚠ 최상위 `namespace:` 변환기를 두지 않는다 — 여기 모이는 ExternalSecret은 ns가 둘 이상이다(`cert-manager`·`cloudflared`).
#   각 ExternalSecret이 자기 `metadata.namespace`를 명시한다.
# ⚠ **변환 키 금지(계약 §validate.yml 4 「(T045 G4) 배달자는 base를 묶기만 한다」)**: 이 파일의 최상위 키는
#   `{apiVersion, kind, resources}`뿐이다. `patches`·`replacements`·`transformers`·`namePrefix`·`helmCharts` 등을 넣으면
#   원본 파일은 그대로인 채 **Argo가 실제로 적용하는 렌더에서만** store·`remoteRef`·`creationPolicy`가 바뀐다 —
#   그 렌더에 터널 자격이 들어 있다. 검사 7.3이 이 구조를 막고, 3.2는 이 배달자 렌더의 위치도 함께 본다.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../secrets/cert-manager
  # ⚠⚠ 잠금 위험 리소스(G4): 이 줄이 적용하는 ExternalSecret은 **SSH·K8s API의 유일한 경로**인 터널 커넥터의 자격을 인수한다.
  #   ⚠ 이 줄을 지워도 **인수는 풀리지 않는다** — `prune: false` + ES의 `Prune=false`라 라이브 ES는 남아 5분마다 조정을
  #     계속한다(해제 절차는 README §5: revert → 반영 확인 → `kubectl delete externalsecret`).
  - ../../secrets/cloudflared
