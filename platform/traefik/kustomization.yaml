# platform/traefik/ — Middleware·TLSOption·TLSStore만 — Traefik 자체 설정 정본은 노드 A server/manifests/traefik-config.yaml
# sync-wave: 계약 gitops-repo.md §sync-wave 단일 표 참조(wave 번호는 표에만 기재 — 중복 금지).
#
# T042 PR-4에서 TLSStore `default` 한 장으로 채웠다. 와일드카드 오리진 인증서를 Traefik의 **동적 인증서**로 적재해
# Cloudflare Full(strict)의 오리진 체인을 확정한다. 운영 절차·되돌리기·머지 후 확인은 README.md.
#
# 정본 계약(모노레포 specs/003-platform-foundation/contracts/):
#   - gitops-repo.md §디렉터리(`traefik/` = Middleware·TLSOption·TLSStore) · §Application 규약 · §sync-wave 단일 표
#   - hostnames-and-access.md §오리진 인증서(와일드카드 1장 · `kube-system` Secret · Traefik TLSStore `default`)
#
# 선행 의존(⚠ 순서가 유일한 방어선 — 설계 §8 R5):
#   `platform/cert-manager-issuers/`의 Certificate `wildcard-joshuatech-dev`(kube-system)가 **prod 발급 Ready=True**여서
#   Secret `kube-system/wildcard-joshuatech-dev-tls`에 공개 신뢰 체인이 실려 있어야 한다. staging 체인 상태로 이 PR을
#   머지하면 전 호스트 526이고 TLSStore 삭제로도 되돌아가지 않는다(자체 서명 복귀 = 여전히 526). README §1.
#
# 이 디렉터리가 만들지 "않는" 것 — 경계(운영 절차는 README.md):
#   1) Traefik 본체: K3s 번들이라 K3s가 설치·관리하고, 설정 정본은 모노레포 `infra/bootstrap/traefik-config.yaml`
#      (HelmChartConfig, T038)이다. `sniStrict`(D5, T042 단계 9)도 그 파일에 있다 — 여기서 켜지 않는다.
#   2) **TLSOption `default`**: 위 HelmChartConfig 단독 소유. 여기 또 두면 이름 `default` 중복으로 Traefik이
#      **양쪽을 다 버려** 내장 기본값으로 조용히 되돌아간다(설계 §6.4 · §8 R7 — 무증상 보안 회귀).
#      계약 §디렉터리는 kind 화이트리스트이고 같은 줄이 HelmChartConfig를 Traefik 자체 설정의 정본으로 지목하므로
#      이 배치는 계약과 충돌하지 않는다 — 다만 이름 `default` 중복(R7)이 무증상 보안 회귀이므로 소유권을 여기서 못박는다.
#      근거 전문은 tlsstore-default.yaml 머리 주석.
#   3) Certificate·ClusterIssuer와 Secret `wildcard-joshuatech-dev-tls`: `platform/cert-manager-issuers/`(PR-2·PR-3) 소유.
#      **이 저장소에 비밀은 없다** — Secret은 cert-manager가 만들고 Argo CD는 만들지도 지우지도 않는다(`prune: false`).
#   4) Namespace `kube-system`과 PSA 라벨·NetworkPolicy: `platform/policies/`(T041) 소유 — validate 검사 5.0·5.1.
#   5) Application `platform-traefik`: `clusters/oci-k3s/apps/platform-traefik.yaml`(T041 PR-C) 소유.
#      이 PR은 그 파일을 **건드리지 않는다** — 검사 7.1이 `source.path: platform/traefik`과 wave를 강제한다.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# ⚠ 전역 `namespace:` 변환기를 두지 않는다(설계 §8 R4). 네임스페이스는 TLSStore의 `metadata.namespace`로만 준다.
#   (`platform/cloudflared/`·`platform/system-upgrade/`에는 변환기가 있으니 복사-붙여넣기 사고를 조심한다.)
resources:
  - tlsstore-default.yaml
