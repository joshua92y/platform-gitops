# platform/traefik/tlsstore-default.yaml — 와일드카드 오리진 인증서를 Traefik의 **동적 인증서**로 적재한다 (T042 PR-4)
#
# 이 한 장이 "Cloudflare Full(strict) ← Traefik 443"의 오리진 체인을 확정한다.
# 앞 단계에서 cert-manager가 발급해 둔 Secret `kube-system/wildcard-joshuatech-dev-tls`
# (`platform/cert-manager-issuers/certificate-wildcard-joshuatech-dev.yaml` 소유, PR-3에서 prod 승격)를
# Traefik이 SNI 매칭 대상으로 삼게 만드는 것이 전부다.
#
# ⚠ **머지 전제 — 되돌리기가 곧 장애인 유일한 구간**(설계 §8 R5 · §7 단계 7):
#   prod Certificate가 `Ready=True`가 된 **뒤에만** 머지한다. staging 체인이 실린 상태로 적용하면 Cloudflare가
#   오리진을 신뢰하지 않아 전 호스트 526이고, TLSStore를 지워 되돌려도 Traefik 자체 서명으로 복귀 = 여전히 526이다.
#   PR 순서가 유일한 방어선이다. 운영 절차·되돌리기·즉효 레버는 README.md.
#
# ── 왜 `defaultCertificate`가 아니라 `certificates:`인가 (설계 §6.1·§6.2, 문면 편차 ⑥) ────────────────────
#   Traefik v3.7.8 소스 대조 결과 두 필드는 **완전히 다른 저장소로 간다**.
#     · `spec.certificates[]`      → CRD provider가 `getTLS()`로 읽어 `CertAndStores{Stores:["default"]}`를 만들고
#                                     TLS Manager가 `appendCertificate` → `st.DynamicCerts.Set(...)` — **DynamicCerts**.
#     · `spec.defaultCertificate`  → `tls.Store.DefaultCertificate` 필드로만 가서 `st.DefaultCertificate`에 저장 —
#                                     **DynamicCerts에 들어가지 않는다**.
#   그런데 `CertificateStore.GetBestCertificate`는 CertCache → DynamicCerts 순으로만 찾고 없으면 `nil`을 반환한다.
#   DefaultCertificate를 **한 번도 참조하지 않는다**. 폴백은 그 바깥의 `Manager.Get()` 클로저가 하는데,
#   `sniStrict`가 켜져 있으면 그 폴백에 도달하기 전에 `nil, nil`(핸드셰이크 거절)로 끝난다
#   (공식 문서도 같다 — "The default certificate is never served if the option is enabled").
#   → 와일드카드를 `defaultCertificate`로만 지정하면 **sniStrict를 켜는 순간 websecure 443 전체가 끊긴다.**
#   research INGRESS-D3(research.md:901)의 "`TLSStore default.defaultCertificate.secretName`으로 지정" 문장에 대한
#   의도적 편차다. spec FR-011("기본 인증서로 쓰고")은 이 형태로도 성립하고, plan A3("kube-system 1장 + TLSStore default")는
#   편차가 아니다 — 정정 대상은 research 한 곳뿐이다.
#   FR-011의 골격("kube-system Secret 1장 + 앱 Ingress `spec.tls` 생략")은 그대로 성립한다.
#
# ── 왜 둘을 **병기하지 않는가** (하이브리드 배제) ──────────────────────────────────────────────────────
#   "안전하게 둘 다 적어 두자"가 가장 위험하다. CRD provider의 TLSStore 처리 루프는 `defaultCertificate`의 Secret을
#   읽지 못하면 `continue`로 **그 TLSStore 항목 전체를 건너뛴다** — `buildCertificates` 호출까지 통째로 지나간다.
#   즉 defaultCertificate로 적어 둔 Secret 한 장이 없거나 오타가 나면 `certificates:`에 적은 **동적 인증서까지 전부 사라진다.**
#   자체 서명으로 되돌아가 증상은 "전 호스트 526"이다. 로그에는 `continue` 직전의 Error 한 줄만 남는다
#   (`Failed to fetch secret <ns>/<name>` · `Secret <ns>/<name> does not exist` · `Could not get certificate blocks` 중 하나) —
#   **정작 사라진 동적 인증서 쪽은 아무 말이 없다.** 그래서 이 파일에는 `certificates:` **하나만** 둔다.
#
# ── 왜 ns가 `kube-system`인가 (설계 §6.3) ─────────────────────────────────────────────────────────────
#   Traefik의 세 인증서 경로(TLSStore·Ingress `spec.tls`·IngressRoute `spec.tls`)는 모두 **참조하는 객체 자신의 ns**에서만
#   Secret을 읽는다 — **교차 ns 참조 구문이 아예 없다.** 따라서 TLSStore는 Secret과 같은 ns에 있어야 하고,
#   그 Secret은 Certificate와 같은 ns(= `kube-system`)에 생긴다. K3s 번들 Traefik도 `kube-system`에 있다.
#   `traefik` 네임스페이스는 **존재하지 않고** AppProject `platform`의 destinations에도 없다(적었다면 Argo가 sync를 거부한다).
#   ns를 바꾸면 앱 ns마다 Secret을 복제해야 해서 FR-011의 "와일드카드 1장" 설계가 깨진다.
#   Secret 읽기 권한은 충분하다: 차트 40.1.x 기본값 `rbac.namespaced: false` + `providers.*.namespaces: []`라
#   ClusterRole `traefik-kube-system`에 전 ns `secrets get/list/watch`가 붙는다.
#
# ── 이 파일이 만들지 "않는" 것 ────────────────────────────────────────────────────────────────────────
#   · **TLSOption `default`를 여기에 두지 않는다**(설계 §6.4 소유권 단일화 · §8 R7). 이름이 `default`인 TLSStore/TLSOption은
#     ns와 무관하게 전역 id로 승격되고 **두 개 이상 존재하면 그 이름의 항목이 통째로 삭제된다.** 다만 삭제되는 대상이 다르다
#     (v3.7.8 `kubernetes.go` 실측):
#       · TLSOption 중복 → `delete(tlsOptions, tls.DefaultTLSConfigName)`(`kubernetes.go:1380`)로 **옵션 객체 자체가 사라지고**
#         집계기가 **내장 기본값**을 대신 넣는다(`tlsmanager.go:34-38` `DefaultTLSOptions`). 내장 기본의 `MinVersion`도
#         `VersionTLS12`라 그 값은 실질적으로 유지되고, **내장 기본이 없는 설정만 소실**된다 —
#         2026-09-10 `sniStrict` 투입에 이어 2026-09-11 `clientAuth`(AOP `RequireAndVerifyClientCert`) 승격으로 **지금 그 대상이 둘 실재한다**:
#         TLSOption이 중복되면 sniStrict·clientAuth가 **둘 다 조용히 사라진다**(= AOP 검증 해제 — 현재형). R7이 막으려는 보안 회귀는 이쪽이다.
#       · TLSStore 중복 → `delete(tlsStores, tls.DefaultTLSStoreName)`(`:1450`)은 **Store 설정(`defaultCertificate`·`defaultGeneratedCert`)만** 지운다.
#         `buildCertificates`가 그 앞에서 이미 `tlsConfigs`를 채웠고 그 맵은 그대로 반환되므로, `certificates:` 목록의
#         인증서는 `Stores:["default"]`를 달고 DynamicCerts에 편입된다(TLS Manager가 빈 `Store{}`를 다시 만든다).
#         즉 이 파일 형태(= `certificates:` 단독)는 중복 상황에서도 **와일드카드 서빙이 유지된다** — 안전한 방향이다.
#     양쪽 모두 Error 로그를 남긴다: `Default TLS Options/Stores defined in multiple namespaces: [...]`.
#     **그래도 각각 정확히 1개** 규율은 유지한다 — TLSOption 쪽 소실이 무증상 보안 회귀이고, 진단 시 두 경우를 혼동하면
#     "와일드카드가 사라졌다"(실제로는 유지)와 "minVersion이 사라졌다"(실제 회귀)를 서로 바꿔 찾게 된다.
#     TLSOption `default`의 정본은 모노레포 `infra/bootstrap/traefik-config.yaml`(HelmChartConfig, T038)이고,
#     TLSStore `default`의 정본은 이 파일이다 — 각각 정확히 한 곳. 계약 `gitops-repo.md` §디렉터리는
#     **kind 화이트리스트**이고 같은 줄이 HelmChartConfig를 Traefik 자체 설정의 정본으로 지목하므로 이 배치는 계약과
#     **충돌하지 않는다** — 다만 이름 `default` 중복(R7)이 무증상 보안 회귀이므로 소유권을 여기서 못박는다.
#     현재 차트 값이 `tlsStore: {}`(빈 맵)이라 경쟁 CR이 하나도 없어 깨끗하게 인수한다.
#   · **`sniStrict`는 이 파일이 아니라 모노레포에 있다**(D5 = T042 단계 9) — `infra/bootstrap/traefik-config.yaml`의
#     `valuesContent` → `tlsOptions.default`. 여기서 켤 수 있는 값이 아니다.
#     **2026-09-10 17:24 KST 투입 완료**: 이 파일이 머지된 뒤(gitops main 4f23abd) 노드 A 안에서 판별 실험 ①②(README §9)를
#     통과한 것을 확인하고 켰다. 적용 뒤 SNI 불일치는 `000`(핸드셰이크 거절)이 됐고 파드 롤아웃은 나지 않았다.
#     ⚠ 되돌릴 때는 순서가 반대다 — `sniStrict` 제거(모노레포 → 노드 A)가 **먼저**, TLSStore 삭제가 그다음이다(README §7).
#   · Secret 자체와 Certificate: `platform/cert-manager-issuers/` 소유. Namespace·PSA·NetworkPolicy: `platform/policies/` 소유.
#     Application `platform-traefik`: `clusters/oci-k3s/apps/` 소유(T041 PR-C가 이미 배포 — 이 PR은 건드리지 않는다).
apiVersion: traefik.io/v1alpha1
kind: TLSStore
metadata:
  name: default
  # 이름은 `default`여야 한다 — Traefik v3는 라우터의 TLS 설정을 `tlsManager.Get(DefaultTLSStoreName, …)`로만 조회하므로
  # `default` 외의 TLSStore는 참조할 수단이 없다(CRD 레퍼런스: "only `default` TLSStore can be used"). 이름 선택지가 아니라 유일값이다.
  namespace: kube-system
  # ⚠ ns **명시 필수**. 이 디렉터리에는 전역 `namespace:` 변환기가 없다(kustomization.yaml 머리 주석 · 설계 §8 R4).
  #   Application의 destination도 `kube-system`이라 지금은 생략해도 같은 결과지만, 명시가 위 §6.3 불변식의 근거다.
spec:
  certificates:
    - secretName: wildcard-joshuatech-dev-tls
      # 정본은 모노레포 `tasks.md:121` 문면이고 코드 사본은 `tests/platform/ingress.tests.ps1:66`($WildcardSecretName) 하나뿐이다.
      # PR-3이 이 이름으로 승격을 마쳤다(전이 구간 이름 `…-tls-staging`은 승격 뒤 운영자가 수동 삭제 — 그 README §10).
      # ⚠ **CRD 프루닝 확인**: 머지 뒤 아래가 빈 값이면 설치된 CRD가 이 필드를 잘라낸 것이므로 즉시 중단한다(README §4).
      #     kubectl -n kube-system get tlsstore default -o jsonpath='{.spec.certificates[0].secretName}'
      #   차트 40.1.0의 `crds/traefik.io_tlsstores.yaml`에는 `spec.certificates`(array of `{secretName}`, required)가
      #   실재함을 2026-09-09에 확인했다 — `defaultCertificate`·`defaultGeneratedCert`와 나란히 있는 별개 필드다.
