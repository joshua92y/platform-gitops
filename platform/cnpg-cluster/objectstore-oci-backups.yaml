# platform/cnpg-cluster/objectstore-oci-backups.yaml — ObjectStore `oci-backups`(barmancloud.cnpg.io/v1 · ns data) — 리소스 wave 0 (T053)
#
# 역할: plugin-barman-cloud v0.14.0(T052 · ns cnpg-system)이 `Cluster pg-main`의 WAL 아카이브·베이스 백업을 쓰는 OCI Object Storage(S3 호환) 대상.
#   Cluster는 `spec.plugins[].parameters.barmanObjectName: oci-backups`로 이 객체를, ScheduledBackup은 `method: plugin`으로 같은 플러그인을 가리킨다.
#   플러그인은 이 spec을 읽어 인스턴스 파드에 **사이드카**(`spec.initContainers`의 `plugin-barman-cloud` · restartPolicy Always = native sidecar — plugin v0.14.0 `lifecycle.go`)를 주입하고 S3 호출은 그 사이드카가 한다(operator·플러그인 파드는 버킷에 접속하지 않는다) —
#   그래서 ns `data`의 egress 정책(`allow-egress-external-443` · `allow-kube-api`)이 전제다(kustomization 머리 주석).
#
# 버킷 이름 예외: 계약·과제 문면의 `jt-backup`은 실제 버킷 **`joshuatech-backup`**이다(모노레포 런북 §0 · build-notes 「T050 · T051」 · `infra/oci/iam.tf`) —
#   IAM 사용자 `svc-s3-backup`(그룹 `joshuatech-s3-backup`)이 그 버킷만 접근한다. 이 클러스터는 `pg-main/` 접두 아래에만 쓴다(플랫폼 백업 `k3s/`·`vault/`는 다른 버킷).
# endpointURL: OCI Object Storage 네임스페이스 `axvjykgvo2m1`(비밀 아님 — 모노레포 `infra/*/backend.tf`의 tofu S3 백엔드가 같은 값을 쓴다)의 S3 호환 엔드포인트
#   `https://<namespace>.compat.objectstorage.<region>.oraclecloud.com`. research CNPG-D6의 `oci.customer-oci.com` 표기 대신 tofu 백엔드와 같은 **실측 도메인**을 쓴다.
#   주소 방식: boto3는 커스텀 `endpoint_url`이면 path-style을 강제한다(botocore `args.py` — `force_path_style = addressing_style != 'virtual'`) → OCI 호환 API가
#   요구하는 path-style(research CNPG-D6 함정)과 맞다. 따로 설정할 것이 없다.
# serverName을 **적지 않는다**: 비우면 클러스터 이름(`pg-main`)이 쓰인다(CRD description "the cluster name is used if this parameter is omitted") →
#   오브젝트 접두 `pg-main/pg-main/{base,wals}/`. 모노레포 하네스 `tests/platform/data.tests.ps1` bucket-1·bucket-2가 이 접두를 전제한다(build-notes 「T050 · T051」 인계).
#   복구 클러스터(T058)는 자기 `Cluster.spec.plugins[].parameters.serverName`으로 다른 이름을 쓴다 — 이 객체를 바꾸는 것이 아니다.
# s3Credentials: 셋 다 **Secret 키 참조**(`{name, key}`)다 — `region`도 문자열이 아니라 참조다(CRD 원문 2026-10-13). Secret `oci-s3-backup`(키 `ACCESS_KEY_ID` ·
#   `ACCESS_SECRET_KEY` · `REGION`)은 T053 선행 PR #46의 ExternalSecret(`secrets/data/externalsecret-oci-s3-backup.yaml` · 배달자 `platform/secrets/`)이
#   Vault kv `platform/oci/s3`에서 만든다(2026-10-13 SecretSynced · ES refreshTime 06:10:30Z — 컨트롤러 전달 · `t053-verify.ps1 -Stage pre` 2026-10-13, 운영자 agent-view 세션. 빌더는 라이브 접근 없음) — 여기서는 **이름만** 참조한다. barman-cloud는 region 값을 `AWS_DEFAULT_REGION`으로 export해
#   SigV4 리전 서명에 쓴다(OCI S3 호환 API는 리전 서명이 맞아야 한다 — research CNPG-D6).
#   ⚠ 키 쌍 정합은 **미증명**(2026-09-21 kv 시드 — 대조할 원본이 없었다). 첫 증명 = 이 과제의 첫 Backup completed(README §1). `SignatureDoesNotMatch`·403이면
#     kv 값을 정정한다(Secret 수동 수정은 ≤5분에 kv 값으로 되돌아간다 — ES 머리 주석).
# wal/data 압축: wal `zstd`(CRD enum 안 · 세그먼트 확장자 `.zst` — 하네스 bucket-2 허용 목록 안) · data `lz4`(data.compression enum = bzip2·gzip·lz4·snappy —
#   **zstd 없음**, CRD 원문) · `maxParallel 2`(WAL 병렬 업로드 — 1 CPU 인스턴스에 맞춘 작은 값) · `jobs 1`(베이스 백업 병렬 — 같은 이유). lz4는 2 OCPU에서 CPU 부담이 작다(research CNPG-D6).
#   ⚠ 관문 이력(T053): datreeio 카탈로그의 ObjectStore 스키마가 2025-06-17 사본(enum에 lz4 없음)이라 validate 검사 1이 이 값을 거부했다 — 라이브 CRD(차트 v0.14.0)는
#     받는 값이라 매니페스트가 아니라 관문을 고친다(컨트롤러 결정 D7 · 계약 §validate.yml 1 개정: 저장소 렌더에 나온 CRD에서 **실행 시 파생**한 스키마 1순위 ·
#     datreeio 폴백 — 이 PR의 `tests/**` 변경 = 검사 1 두 패스(렌더 수집 → CRD 스키마 파생 → kubeconform)). 이 값은 바꾸지 않는다.
# retentionPolicy "30d": 과제 문면(research CNPG-D6 초판 14d보다 문면 우선). 패턴 `^[1-9][0-9]*[dwm]$`. 보존은 **이 값이** 맡는다 — Backup 객체 수와 무관하게
#   사이드카가 `retentionPolicyIntervalSeconds`(1800 = CRD 기본값 명시)마다 버킷에서 만료 백업·WAL을 지우고, 이어서 카탈로그에 없는 Backup 객체도 지운다
#   (plugin v0.14.0 `retention.go` `deleteBackupsNotInCatalog` · primary에서만 — K8s Backup 객체 수는 ≈ 30으로 수렴 · README §5 · VD-13).
# instanceSidecarConfiguration.env: boto3 ≥ 1.36의 기본 CRC32 체크섬(`x-amz-checksum-*`)이 OCI S3 호환 API에서 실패한다(알려진 문제) — plugin 문서의 공식 우회 =
#   `AWS_REQUEST_CHECKSUM_CALCULATION` · `AWS_RESPONSE_CHECKSUM_VALIDATION` = `when_required`(README §3 VD-4). 값은 비밀이 아니다.
# resources: 사이드카 requests 50m/128Mi · limits memory 256Mi(CPU limit 없음 — 저장소 관례). 인스턴스 파드의 합산 요청에 더해진다(README §4).
#   ⚠ 이 requests ≠ limits 컨테이너가 `pg-main-1` 파드에 함께 있어 파드 QoS는 Guaranteed가 아니라 **Burstable**이다(K8s QoS는 init 컨테이너 포함 전 컨테이너 조건) →
#     CNPG의 `PG_OOM_ADJUST_VALUE=0`(Guaranteed 조건)은 적용되지 않는다(cluster-pg-main.yaml 머리 주석 · README §4 · VD-14). Guaranteed로 바꾸려면 여기를 requests = limits(cpu 포함)로 —
#     사이드카 CPU 상한이 백업 압축(lz4·zstd는 이 사이드카 안에서 돈다)을 늦추고 requests 상향은 노드 B 예산을 건드리므로 T097에서 VD-6 실측 뒤 결정. 이 PR은 값을 바꾸지 않는다.
#
# 삭제 보호 `Delete=false,Prune=false`: 계약 §삭제 보호 목록의 둘째 항목(`ObjectStore oci-backups` — 2026-10-13 T053 추가 · 모노레포 `a1bf712`). **ObjectStore가 지워지면
#   WAL 아카이브·백업이 즉시 멈추고** Cluster의 ContinuousArchiving 조건이 False로 바뀐다(데이터는 남지만 PITR 체인이 끊기고 백업 카탈로그 접근을 잃는다 · WAL이 PVC에 쌓인다).
#   Argo의 삭제·prune만 막고 `kubectl delete`는 막지 않는다. 되돌리기 순서는 README §5(ScheduledBackup → Cluster → ObjectStore).
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: oci-backups
  namespace: data
  annotations:
    argocd.argoproj.io/sync-wave: "0"               # 리소스 수준 wave — Cluster("1")보다 먼저. Application 표의 숫자가 아니다(kustomization 머리 주석)
    argocd.argoproj.io/sync-options: Delete=false,Prune=false
spec:
  configuration:
    destinationPath: s3://joshuatech-backup/pg-main/   # 버킷 실명(이름 예외) + 접두. serverName 기본값(pg-main)이 뒤에 붙는다 → pg-main/pg-main/{base,wals}/
    endpointURL: https://axvjykgvo2m1.compat.objectstorage.ap-chuncheon-1.oraclecloud.com   # OCI S3 호환(네임스페이스 = tofu 백엔드와 동일 · 비밀 아님)
    s3Credentials:                                     # 셋 다 Secret 키 참조 — Secret은 선행 PR의 ES가 만든다(여기선 이름만)
      accessKeyId:
        name: oci-s3-backup
        key: ACCESS_KEY_ID
      secretAccessKey:
        name: oci-s3-backup
        key: ACCESS_SECRET_KEY
      region:                                          # 문자열 아님 — 참조(CRD). 값 ap-chuncheon-1은 ES template의 상수 → AWS_DEFAULT_REGION
        name: oci-s3-backup
        key: REGION
    wal:
      compression: zstd                                # → 세그먼트 .zst(하네스 bucket-2 허용 목록)
      maxParallel: 2
    data:
      compression: lz4                                 # data enum에 zstd 없음(CRD 원문) — 2 OCPU에서 CPU 부담이 작다(research CNPG-D6)
      jobs: 1
  retentionPolicy: "30d"                               # 과제 문면. 패턴 ^[1-9][0-9]*[dwm]$ — 만료 백업·WAL은 사이드카가 지운다
  instanceSidecarConfiguration:
    retentionPolicyIntervalSeconds: 1800               # CRD 기본값 명시 — 보존 정책 강제 주기(30분)
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 256Mi                                  # CPU limit 없음(저장소 관례) → requests ≠ limits = 파드 QoS Burstable(머리 주석 · README VD-14)
    env:                                               # OCI S3 호환 — boto3 CRC32 체크섬 우회(plugin 문서 공식 값 · README §3 VD-4)
      - name: AWS_REQUEST_CHECKSUM_CALCULATION
        value: when_required
      - name: AWS_RESPONSE_CHECKSUM_VALIDATION
        value: when_required
