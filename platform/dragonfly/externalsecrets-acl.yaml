# platform/dragonfly/externalsecrets-acl.yaml — Dragonfly ACL 파일 Secret 2장의 ExternalSecret(ns data) — 리소스 wave 0 (T057)
#
# 역할: Deployment `dragonfly-<env>`가 `/etc/dragonfly/users.acl`로 마운트하는 Secret `dragonfly-<env>-acl`(키 `users.acl` = aclfile 전문)을 Vault kv에서 만든다
#   (deployment-<env>.yaml의 volume `acl`과 1:1 · 이름 규칙 = 컨트롤러 결정 D1: ES 이름 = Secret 이름(`target.name`) = `dragonfly-<env>-acl`).
#
# store · 경로(모노레포 contracts/denylist.md §Vault 경로 · data-model §8 `kv/{env}/dragonfly/acl` 키 `users.acl`(파일 전문) · 계약 gitops-repo.md §ExternalSecret 규약 · 결정 D7):
#   dev  `dragonfly-dev-acl`  ← store `vault-data` · `dev/dragonfly/acl`  키 `users.acl`
#   prod `dragonfly-prod-acl` ← store `vault-data` · `prod/dragonfly/acl` 키 `users.acl`
#   `remoteRef.key`에 `kv/` 접두를 붙이지 않는다 — store가 `path: kv` + `version: v2`라 ESO가 `kv/data/`를 붙인다(validate 3.1).
#   경로 lint = validate 3.3(이 디렉터리의 ES는 `vault-data` + 열거 접두 `{dev,prod}/dragonfly/…`). Vault 정책 eso-data가 `kv/data/{dev,prod}/dragonfly/*`를 이미 허용한다
#   (모노레포 infra/vault/policies.tf :41 · :46 · :51 · :56 — 인프라 변경 0). store `vault-data`의 `conditions.namespaces`에 `data`가 있다(platform/secret-stores/).
#   사용자별 비밀번호 경로(`kv/{env}/dragonfly/<user>` 키 `password`·`url`)는 이 디렉터리가 읽지 않는다 — 앱 ns의 `<pod>-env`(store `vault-{env}` · T072)와 검사 Job
#   `assert-env`(dev)가 읽고, `admin`은 ESO 소비자가 없다(운영자 런북 전용).
#
# kv 값(키 `users.acl` 하나 — aclfile 전문)은 운영자가 **머지 전** 시드한다(README §0 P1 · 모노레포 런북 bootstrap.md §4 T057). 이 저장소에는 **형식 설명만** 있다(README §0 ·
#   결정 D6): Dragonfly `ACL SAVE` 형식 `USER <이름> ON|OFF #<SHA-256 소문자 hex 64자> <키 패턴> <채널> +@all` · LF만 · 빈 줄 · CR · 탭 없음 · 줄마다 토큰 ≥ 4 ·
#   dev 4줄(default OFF · admin · identity-admin · sample-pod) / prod 3줄(sample-pod 없음). ⚠ 한 줄이라도 파싱 오류면 파일 전체가 적재되지 않고 Dragonfly는 **무인증
#   default(nopass)로 기동한다**(LOG(WARNING)만 — README §1 증상표 첫 행 · §4 소스로 확인한 사실).
#
# target.template을 두지 않는다(T056 결정 D2와 같은 근거 — platform/kafka-topics/externalsecrets-kafka-users.yaml 머리 주석): template이 없으면 Secret 키 =
#   `data[].secretKey` 그대로(`users.acl` 하나 — ESO v2.10.0 externalsecret_controller_template.go :60–64). 대가(받아들인 사실): ESO가 이 ES의 라벨·어노테이션(Argo
#   tracking-id · 아래 sync-wave 포함)을 Secret에 복사한다(:147–152) — Argo CD v3.5.2는 종류·이름이 다른 복사본을 관리 대상으로 세지 않는다(controller/state.go
#   :981–985 · :1282–1337). Deployment는 볼륨 `items: [{key: users.acl, path: users.acl}]`로 이 키 하나만 파일로 둔다.
# creationPolicy Owner(계약 기본 — 새 Secret · 인수 아님) · deletionPolicy 미기재(CRD 기본 Retain — ownerReference GC는 막지 못한다). ES가 지워지면 Secret이 GC되고,
#   이미 뜬 Dragonfly는 적재한 규칙으로 계속 돈다(파일은 기동 · `ACL LOAD` 때만 읽는다) — 다음 기동은 Secret 볼륨이 없어 ContainerCreating(README §5).
#   그래서 객체 삭제 보호 어노테이션은 붙이지 않는다(계약 §삭제 보호 목록 밖 · T054 · T056 ES 선례 · Application은 `prune: false`).
# refreshPolicy Periodic + refreshInterval 5m(계약 §공통 규칙 — CRD 기본값 1h를 쓰지 않는다). 회전 = kv `<user>`와 `acl`을 **함께** 교체 → ≤ 5분 Secret 갱신 → kubelet
#   파일 갱신 → 운영자 `ACL LOAD`(또는 rollout restart) — Reloader는 쓰지 않는다(결정 D9 · README §5).
# 리소스 wave "0" — Deployment("1")보다 먼저. Argo는 wave 0의 ES가 Healthy(Ready=True · SecretSynced)여야 wave 1로 간다(Argo CD v3.5.2
#   resource_customizations/external-secrets.io/ExternalSecret/health.lua: Ready=False → Degraded · Ready=True → Healthy · 그 밖 Progressing).
#   kv가 비거나 키 이름이 다르면 `SecretSyncedError` → Degraded → 그 sync 시도는 Failed. 이 Application은 예외 retry가 없는 표준 syncPolicy라 기본 retry(대기
#   10·20·40·80·160 s ≈ 5분)를 다 쓰면 같은 리비전으로 다시 시작하지 않는다 — 그래서 시드가 **머지 전** 선행 조건 P1이다(늦은 시드 절차는
#   platform/kafka-topics/README.md §1 증상표 첫 행과 같다 — README §1). Application 표의 숫자가 아니다(kustomization 머리 주석).

# --- dev — Deployment `dragonfly-dev` · store vault-data · kv dev/dragonfly/acl ---------------------------------------------
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: dragonfly-dev-acl
  namespace: data
  labels:
    app.kubernetes.io/name: dragonfly
    app.kubernetes.io/instance: dragonfly-dev
    app.kubernetes.io/part-of: platform-dragonfly
  annotations:
    argocd.argoproj.io/sync-wave: "0"          # 리소스 수준 wave — Deployment("1")보다 먼저. Application 표의 숫자가 아니다
spec:
  refreshPolicy: Periodic                      # 기본값에 의존하지 않는다(계약 §공통 규칙)
  refreshInterval: 5m                          # CRD 기본값 1h를 쓰지 않는다
  secretStoreRef: { kind: ClusterSecretStore, name: vault-data }
  target:
    name: dragonfly-dev-acl                    # deployment-dev.yaml volume `acl`의 secretName
    creationPolicy: Owner                      # template 없음(머리 주석 — Secret 키 = data[].secretKey)
  data:
    - { secretKey: users.acl, remoteRef: { key: dev/dragonfly/acl, property: users.acl } }
---
# --- prod — Deployment `dragonfly-prod` · store vault-data · kv prod/dragonfly/acl -------------------------------------------
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: dragonfly-prod-acl
  namespace: data
  labels:
    app.kubernetes.io/name: dragonfly
    app.kubernetes.io/instance: dragonfly-prod
    app.kubernetes.io/part-of: platform-dragonfly
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  refreshPolicy: Periodic
  refreshInterval: 5m
  secretStoreRef: { kind: ClusterSecretStore, name: vault-data }
  target:
    name: dragonfly-prod-acl
    creationPolicy: Owner
  data:
    - { secretKey: users.acl, remoteRef: { key: prod/dragonfly/acl, property: users.acl } }
