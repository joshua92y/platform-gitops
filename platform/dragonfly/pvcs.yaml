# platform/dragonfly/pvcs.yaml — 스냅샷 PVC `dragonfly-dev-data` · `dragonfly-prod-data`(ns data · local-path 2Gi) — 리소스 wave 1 (T057)
#
# 용도: Dragonfly `--dir /data`(deployment-<env>.yaml)의 스냅샷 파일(`--dbfilename=dump` → `dump-summary.dfs` + 샤드 파일 · 5분 cron + 정상 종료 시 저장).
#   거부 목록은 **파생 캐시**다(정본 = DB `session_revocation_log` — 모노레포 contracts/denylist.md · data-model §3). 스냅샷은 정상 종료 → 재기동 사이의 키를
#   이어 주는 장치일 뿐이고, 비정상 종료(OOM · SIGKILL) 뒤 공백은 identity-admin의 30 s 무조건 재적용이 메운다. 그래서 2Gi(과제 문면)면 충분하다(키 수십 건 규모).
#
# storageClassName `local-path`(K3s 기본 SC를 명시 — 기본 SC에 기대지 않는다): K3s v1.36.5+k3s1 manifests/local-storage.yaml :97 `volumeBindingMode: WaitForFirstConsumer` ·
#   :98 `reclaimPolicy: Delete` · :118 `mkdir -m 0777 -p "${VOL_DIR}"`(uid 999가 쓸 수 있다). 확장 불가 · 용량 미강제(2Gi는 명목값 — 실제 한도는 노드 B 디스크).
#   PV는 pod가 처음 놓인 노드(nodeSelector role=data → 노드 B)에 생기고 그 노드에 묶인다. **PVC 삭제 = 스냅샷 삭제**(reclaim Delete — README §5).
#
# 리소스 wave "1" — Deployment와 **같은 wave**인 이유(컨트롤러 결정 D3): `WaitForFirstConsumer`라 pod가 붙기 전 PVC는 `Pending`이고, Argo CD v3.5.2의 PVC health는
#   Pending → **Progressing**(gitops-engine/pkg/health/health_pvc.go :28–41)이라 낮은 wave에 두면 wave가 Healthy가 되지 않아 Deployment wave로 영영 넘어가지 못한다.
#   같은 wave 안의 적용 순서는 kind 순서(gitops-engine/pkg/sync/sync_tasks.go :24–66 — PersistentVolumeClaim :40이 Deployment :55보다 앞)라 PVC가 먼저 생긴다.
#   wave "1"은 마지막 wave라 적용 직후 operation이 Succeeded로 닫힌다(Bound · Available은 그 뒤 — Application health가 Progressing → Healthy · README §1).
#   Application 표의 숫자가 아니다(kustomization 머리 주석).
#
# 삭제 보호(계약 gitops-repo.md §Application 규약 삭제 보호 목록 「Vault/Dragonfly PVC」): `argocd.argoproj.io/sync-options: Delete=false,Prune=false` — 모노레포 하네스
#   cluster.tests.ps1 argo-4-dragonfly가 **정확히 이 문자열**을 대조한다(글자·순서·공백 변경 금지 · 대상 = ns data에서 이름에 dragonfly가 들거나 라벨
#   `app.kubernetes.io/name=dragonfly`인 PVC 전부). 이 PVC는 Argo가 **직접** 관리하는 객체라 어노테이션이 실효다: prune에서 빠지고(Prune=false) Application cascade
#   삭제에서도 빠진다(Argo CD v3.5.2 controller/appcontroller.go :1251–1260 `shouldBeDeleted` — 객체 어노테이션 `Delete=false`가 Application의 `Delete=confirm`보다
#   먼저다). StatefulSet이 만드는 Vault PVC(Argo 관리 밖 — '표식'뿐)와 다르다. `kubectl delete`는 막지 못한다 — 두 번째 겹은 Application의 `Prune=confirm` ·
#   `Delete=confirm`(나머지 6장의 삭제 승인)과 사람의 절차(README §5)다.

# --- dev ------------------------------------------------------------------------------------------------------------------------
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: dragonfly-dev-data
  namespace: data
  labels:
    app.kubernetes.io/name: dragonfly
    app.kubernetes.io/instance: dragonfly-dev
    app.kubernetes.io/part-of: platform-dragonfly
  annotations:
    argocd.argoproj.io/sync-options: Delete=false,Prune=false   # 하네스 argo-4-dragonfly — 글자 그대로
    argocd.argoproj.io/sync-wave: "1"                           # 리소스 수준 wave — Deployment와 같은 wave(머리 주석). Application 표의 숫자가 아니다
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 2Gi
---
# --- prod -----------------------------------------------------------------------------------------------------------------------
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: dragonfly-prod-data
  namespace: data
  labels:
    app.kubernetes.io/name: dragonfly
    app.kubernetes.io/instance: dragonfly-prod
    app.kubernetes.io/part-of: platform-dragonfly
  annotations:
    argocd.argoproj.io/sync-options: Delete=false,Prune=false   # 하네스 argo-4-dragonfly — 글자 그대로
    argocd.argoproj.io/sync-wave: "1"
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 2Gi
