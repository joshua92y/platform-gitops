# clustersecretstore-vault-data.yaml — vault-platform과 같은 형식. 다른 것은 이름·role·SA·참조 ns 네 값뿐이다.
# role `eso-data`는 열거 접두 20개만 읽는다. `data`와 `identity`에는 vault-platform도 함께 걸린다.
# 전체 함정 설명은 `clustersecretstore-vault-platform.yaml` 머리 주석에 있다 — 아래 세 줄이 그 요약이다.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata: { name: vault-data }
spec:
  conditions:
    - namespaces: [data, identity]            # ⚠ Ready 판정과 무관 — ES가 store를 쓸 때만 평가된다
  provider:
    vault:
      server: http://vault.vault.svc:8200     # 평문 8200(T044 `global.tlsDisable: true`)
      path: kv
      version: v2                             # `kv/data/<remoteRef.key>` — ES의 key에 `kv/` 접두 금지(validate 3.1)
      auth:
        kubernetes:
          mountPath: kubernetes
          role: eso-data
          # ⚠ `namespace` 생략 = referent auth = 로그인 없이 `Ready=True / reason=Valid / "store validated"` — 상태로는 구분 불가(진짜 가짜 PASS).
          #   방어선은 렌더 grep(`vault-data external-secrets vault`) · 라이브 spec · Vault 감사 로그다(README §1·§2).
          # ⚠ `audiences: [vault]`는 Vault role `audience="vault"`와 같아야 한다(infra/vault/roles.tf).
          #   틀리거나 비면 403 `invalid audience (aud) claim`이다.
          serviceAccountRef: { name: eso-data, namespace: external-secrets, audiences: [vault] }
