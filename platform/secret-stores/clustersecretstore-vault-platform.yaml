# clustersecretstore-vault-platform.yaml — 플랫폼 ns 12개(network-policy.md 표 14개 − jt-dev − jt-prod, kube-system 포함)
# ⚠ `serviceAccountRef.namespace`를 **반드시** 적는다. 생략해도 스키마·webhook은 통과하지만 'referent auth'가 되어 ESO가 로그인을
#   한 번도 하지 않은 채 `Ready=True / reason=Valid / message "store validated"`가 된다 — **상태로는 진짜와 구분되지 않는다**(진짜 가짜 PASS).
#   vault provider는 `ValidationUnknown`을 내지 않는다(validate.go의 유일한 Unknown 반환이 err=nil이라 컨트롤러가 Valid로 찍는다).
#   방어선은 상태가 아니라 ① 렌더 grep(vault store 4행 전부 `<store> external-secrets vault`) ② 라이브 spec 확인
#   ③ Vault 감사 로그의 role별 login 유무 — 셋 다 README §1·§2. (ESO 2.10.0 소스 판독, 라이브 미실측 VD-2)
# ⚠ `audiences: [vault]` = Vault role `audience="vault"`(infra/vault/roles.tf). 값이 틀리거나 비면 Vault가 TokenReview 전에
#   aud 클레임을 먼저 검사해 403 `invalid audience (aud) claim: audience claim does not match any expected audience`를 준다.
#   (`jwt valid for audience(s) … but wanted …`는 그 뒤 TokenReview 단계의 문면이라 이 배치에서는 드물다.)
# `path: kv` + `version: v2` → `kv/data/<remoteRef.key>`. ES의 key에 `kv/` 접두를 붙이지 않는다(validate 3.1).
# `conditions.namespaces`는 Ready 판정과 무관하다 — ES가 store를 쓸 때만 평가된다('denied by spec.condition').
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata: { name: vault-platform }
spec:
  conditions:
    - namespaces: [kube-system, argocd, vault, external-secrets, cert-manager, cnpg-system, data, identity, monitoring, system-upgrade, cloudflared, reloader]
  provider:
    vault:
      server: http://vault.vault.svc:8200     # 평문 8200(T044 `global.tlsDisable: true`)
      path: kv
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: eso-platform
          serviceAccountRef: { name: eso-platform, namespace: external-secrets, audiences: [vault] }
