# 컨트롤러 Deployment 패치(strategic merge) — controller.yaml(업스트림 사본)은 건드리지 않고 여기서만 바꾼다.
#
# - nodeSelector role=platform: 업스트림 nodeAffinity(control-plane Exists)와 결과는 같다(노드 A). 다른 platform 컴포넌트와 같은 표기로 의도를 드러내고,
#   노드 B가 서버로 승격되는 변경이 있어도 컨트롤러가 플랫폼 노드에 머물게 한다.
# - resources: requests memory 30Mi(T037 문면) + cpu 10m. limit memory 128Mi — Plan/Job/Node 캐시만 드는 작은 wrangler 컨트롤러라 충분하고, CPU limit은 두지
#   않는다(계약 LimitRange 방침과 같은 이유). 실측 항목: `kubectl -n system-upgrade top pod`로 정상 RSS를 보고 상한을 조정한다.
# - securityContext: 업스트림은 컨테이너 수준(runAsNonRoot 65534 · drop ALL · allowPrivilegeEscalation false · seccomp RuntimeDefault)만 두므로 pod 수준에도
#   같은 값을 명시한다(PSA privileged ns라 admission이 강제하지 않는다 — 그래서 더 명시한다). readOnlyRootFilesystem: 업스트림이 /tmp를 emptyDir로 따로 두고
#   CA 경로 3개를 readOnly hostPath로 마운트하므로 루트를 읽기 전용으로 잠근다. **T041 첫 sync에서 확인할 것**: 컨트롤러 로그에 `read-only file system`이 없고
#   Plan 2개가 LatestResolved=True. 문제가 되면 이 한 줄만 빼고 이유를 여기 적는다(라이브 미실행 항목).
# - env: 컨트롤러 설정(SYSTEM_UPGRADE_CONTROLLER_* / SYSTEM_UPGRADE_JOB_*)은 controller.yaml의 ConfigMap `default-controller-env`(업스트림 기본)로 들어간다.
#   이 저장소가 바꾼 값은 SYSTEM_UPGRADE_JOB_KUBECTL_IMAGE(digest 핀) 하나다. 나머지 기본값이 Plan에 미치는 뜻: ACTIVE_DEADLINE_SECONDS 900(Plan의
#   jobActiveDeadlineSecs가 덮어쓴다 — Plan 파일 주석), BACKOFF_LIMIT 99(실패한 pod를 deadline까지 다시 만든다), IMAGE_PULL_POLICY Always(태그 없는 Plan 이미지를
#   매번 다시 해석), TTL_SECONDS_AFTER_FINISH 900(끝난 Job은 15분 뒤 삭제 — 로그는 그 안에 보거나 Loki(T098)에서), PLAN_POLLING_INTERVAL 15m(채널 조회 주기).
#   ConfigMap 변경은 컨트롤러 pod를 다시 만들어야 반영된다(K3s 문서 §Installation).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: system-upgrade-controller
  # 업스트림 사본이 namespace를 명시하므로 패치도 같은 namespace를 적어야 kustomize가 대상을 찾는다(없으면 "no resource matches … [noNs]").
  namespace: system-upgrade
spec:
  template:
    spec:
      nodeSelector:
        role: platform
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: system-upgrade-controller
          resources:
            requests:
              cpu: 10m
              memory: 30Mi
            limits:
              memory: 128Mi
          securityContext:
            readOnlyRootFilesystem: true
