# platform/policies/policies-common.yaml — 공통 정책 세트 5종 + 조건부 2종 (49장)
#
# 정본: 모노레포 specs/003-platform-foundation/contracts/network-policy.md §정책 세트.
#   default-deny 13 · allow-dns 13 · allow-same-namespace 7 · allow-kube-api 10 ·
#   allow-apiserver-webhook 4 · deny-imds 1(kube-system 전용) · allow-imds 1(vault 전용) = 49장.
#   13 = 계약 표 14개 - kube-system. `kube-system`에는 default-deny를 걸지 않는다(K3s 번들 컴포넌트).
#
# 상수: 노드 A private IP `10.0.7.78` — K8s API 6443(`allow-kube-api`)와
#   admission webhook·`kubectl port-forward`의 출발 IP(`allow-apiserver-webhook`).
#   노드 B private IP는 이 파일에 없다(노드 IP 목적지 규칙은 policies-external.yaml).
#
# 되돌리기용 라벨: 모든 객체에 `app.kubernetes.io/part-of: platform-policies`를 직접 기재한다.
#   Argo CD의 추적 방식은 어노테이션이라 `argocd.argoproj.io/instance` 라벨은 존재하지 않는다.
#   비상 되돌리기 = 컨트롤러 freeze(`kubectl -n argocd scale sts argocd-application-controller --replicas=0`)
#   → `kubectl delete networkpolicy -A -l app.kubernetes.io/part-of=platform-policies`.
#   `argocd app sync --prune`은 쓰지 않는다(agent-view RBAC까지 지운다).
#
# 추가 허용 규칙 금지: 계약의 허용 매트릭스가 exhaustive다. 새 경로가 필요하면 계약을 먼저 고친다.
#
# =============================================================================
