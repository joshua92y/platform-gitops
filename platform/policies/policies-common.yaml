  egress:
    - to: [{ ipBlock: { cidr: 10.0.7.78/32 } }]
      ports: [{ protocol: TCP, port: 6443 }]
# =============================================================================
# allow-apiserver-webhook × 4 — ingress ← 노드 A 주소, ns마다 포트
#   cert-manager 10250 · external-secrets 10250 · cnpg-system 9443 = admission webhook.
#   vault 8200은 webhook이 아니라 `kubectl port-forward svc/vault 8200`의 도착 경로다
#   (계약 §정책 세트의 "`allow-apiserver-webhook`의 `vault` 8200 행은 admission webhook이 아니라" 항).
#
# ── VD-W 실측 (2026-09-09, 운영자가 노드에서 직접 실행) ───────────────────────────
#   목적지는 노드 B의 cert-manager-webhook 파드 `10.42.1.14:10250`으로 고정하고 출발지만 바꿨다.
#
#   1) 노드 A에서 그 파드로 가는 경로의 출발 주소 — 노드 private IP가 아니다:
#        $ ssh ssh-a 'ip route get 10.42.1.14'
#          10.42.1.14 dev flannel-wg src 10.42.0.0
#   2) SNAT 없음 — 노드 A 리스 서브넷 → 클러스터 CIDR은 RETURN이라 파드가 보는 소스가 위 src 그대로다:
#        $ ssh ssh-a 'sudo iptables-save -t nat | grep -F FLANNEL-POSTRTG'
#          -A FLANNEL-POSTRTG -s 10.42.0.0/24 -d 10.42.0.0/16 -m comment --comment "flanneld masq" -j RETURN
#   3) egress-selector 모드 = K3s 기본값:
#        $ ssh ssh-a 'sudo journalctl -u k3s -b -o cat | grep "egress proxy mode"'
#          Tunnel server egress proxy mode: agent
#   4) 실패 원문(노드 A k3s 저널) — 타임아웃이 아니라 **즉시 능동 거부**다:
#          Sending HTTP/1.1 502 response to 127.0.0.1:34976:
#          dial tcp 10.42.1.14:10250: connect: connection refused
#   5) A/B/C 대조 실험:
#        A) 노드 A → webhook 10.42.1.14:10250 → exit 7, 0ms, Couldn't connect   ← 실패
#        B) 노드 A → coredns 10.42.1.11:9153  → code=200, 2.6ms                 ← 성공
#           A와 출발지·출력 장치(flannel-wg)가 같다. 목적지 파드·포트·스킴은 함께 달라졌지만,
#           같은 목적지·같은 포트를 노드 B에서 친 C)가 성공하므로 포트·목적지 요인은 배제된다.
#           둘을 합치면 크로스노드 데이터패스는 건강하고 남는 변수는 목적지 ns의 ingress 격리뿐이다.
#        C) 노드 B → webhook 10.42.1.14:10250 → code=404, 6.7ms                 ← 성공
#           kube-router가 파드 방화벽 체인 앞머리에 넣는 LOCAL 예외(파드와 같은 노드에서 출발한
#           트래픽은 무조건 ACCEPT)로 설명된다 — **체인 실물도 확인했다**(2026-09-18, ESO webhook 파드
#           `10.42.0.31` 대상 `KUBE-POD-FW-*` 체인에 `-m addrtype --src-type LOCAL -j ACCEPT` **1행**).
#           **동작도 두 번 실측됐다**: 이 대조 실험 C와 2026-09-17 T045의 ESO 동일 노드 dry-run
#           (이 ns 허용 집합에 flannel `/32`가 없는 상태에서 도달했고, 같은 노드 경로의 출발지는
#           `10.42.0.1`(cni0 브리지 — 2026-09-18 실측)이라 **허용 집합 밖**이었다. 즉 그 도달은
#           LOCAL 예외 덕이다. 노드에 conntrack이 미설치라 실제 dial 소켓의 출발 주소를 conntrack으로
#           따로 확인하지는 못했다).
#           어느 쪽이든 결과를 가르는 것은 포트가 아니라 **출발 노드**다.
#
# ── 메커니즘: 왜 노드 private IP가 아닌가 ────────────────────────────────────────
#   K3s 기본 `--egress-selector-mode: agent`에서 apiserver → **파드 IP** 연결은 에이전트 터널을
#   타지 않는다. 터널 서버는 pod/cluster 모드에서만 파드 CIDR을 등록하므로 파드 IP는 터널 대상이
#   아니고(useTunnel=false), 노드 A 호스트 netns에서 기본 dialer로 **직접 dial**된다.
#   그 소켓의 출발 IP는 커널의 소스 선택 결과다: `flannel-backend: wireguard-native`가
#   `10.42.0.0/16`을 `dev flannel-wg scope link` 라우트로 걸고, 그 장치의 유일한 주소가
#   노드 A 리스 서브넷의 네트워크 주소 /32이므로 → `10.42.0.0`.
#   (`kubectl logs`·`exec`·`port-forward`는 반대로 전부 kubelet(노드 IP:10250) 경유라 터널을 타고
#    목적지가 노드 로컬 loopback으로 재작성된다 — 그래서 이 실패가 그쪽에서는 보이지 않았다.)
#
# ── 정책 작성자는 틀리지 않았다 · 그래서 교체가 아니라 add-only다 (D6 = A1) ──────
#   flannel **host-gw** 백엔드(터널 장치 없이 주 NIC로 라우팅)였다면 출발 IP가 노드 private IP라
#   `10.0.7.78/32`가 정확히 옳다. 깨지는 원인은 오직 wireguard 백엔드의 소스 선택이다.
#   "노드 IP를 잘못 적었다"가 아니므로 기존 /32를 지우거나 교체하지 않고 같은 규칙 안에 **추가**한다.
#   부수 이유: 모노레포 tests/platform/cluster.tests.ps1의 np-set-5가 이 규칙의 모양을 직접 단언한다.
#   그 단언은 2026-09-17 `2f5aacf`로 강화돼 **이제 값까지 검사한다**(그 전에는 "해당 포트 + `/32`로 끝나는
#   ipBlock을 한 규칙 안에서 함께 가진 ingress 규칙이 최소 1개"만 요구했다): webhook 3 ns
#   (cert-manager·external-secrets·cnpg-system)의 출발 cidr 집합이 {노드 A private/32, 노드 A flannel/32}와
#   **정확히 일치**하고, vault 8200은 {노드 A private/32} 하나이며, 각 규칙의 포트 집합도 계약 포트와 정확히
#   일치해야 하고 `endPort`(포트 범위)와 ipBlock 아닌 peer는 금지다. 두 주소는 상수가 아니라 라이브 노드
#   객체(InternalIP · `.spec.podCIDR`의 네트워크 주소)에서 유도하므로 기존 /32를 지우거나 다른 값으로
#   바꾸면 그 단언이 곧바로 깨진다. 저장소 쪽 같은 검사는 `tests/validate.sh`의 5.6 POL-webhook-src이며,
#   차이는 셋이다: 5.6은 **스크립트 상수와 대조**하고(np-set-5는 노드 객체에서 유도), 5.6은 원본 파일에 더해
#   **kustomize 렌더 결과**까지 보며(하네스는 라이브 객체를 본다), 5.6은 `protocol`도 TCP인지 본다(하네스는
#   protocol을 보지 않는다).
#
# ── 10.42.0.0/32의 허용 확대 = 노드 A 호스트 netns 하나 ─────────────────────────
#   이 주소는 노드 A 파드 CIDR `10.42.0.0/24`의 **네트워크 주소**라 어떤 파드에도 할당될 수 없다.
#   따라서 허용 대상은 노드 A **호스트 네임스페이스** 하나뿐이고, 그 노드는 이미 apiserver가 도는 곳이다.
#   ⚠ "호스트 네임스페이스 하나뿐"을 "apiserver 하나뿐"으로 읽지 말 것. 그 netns를 쓰는 것은 더 있다:
#     ① **hostNetwork 파드** — 계약 §hostNetwork · 호스트 네임스페이스 예외표의 node-exporter(`monitoring`)와
#        system-upgrade Plan Job(`system-upgrade`). 노드 A에 뜨면 파드 netns가 아니라 이 호스트 netns를
#        그대로 쓰므로 같은 출발 IP를 낼 수 있다. 두 ns 모두 PSA `privileged`라 아래 NET_RAW 논거도 미치지 않는다.
#     ② **노드 A에 뜨는(스케줄되는) `kube-system` 워크로드**(traefik · coredns · svclb 등). `kube-system`은 PSA
#        `privileged`이고 default-deny도 없다(계약 §네임스페이스 표의 `kube-system` 행 · §정책 세트).
#     즉 바로 아래의 "노드 A의 비-특권 워크로드는 argocd·cloudflared·vault·external-secrets 넷"이라는 문장은
#     **default-deny가 걸린 13 ns 중 PSA `restricted`인 것만 센 것**이다. 위 ①②는 PSA `privileged` ns라
#     그 셈에 들어가지 않는다(`monitoring`·`system-upgrade`는 default-deny 13 ns 안에 있지만 `privileged`다 —
#     노드 A에 뜨는 SUC 컨트롤러도 같은 이유로 이 셈 밖이다).
#   ⚠ 이 값은 "노드 A의" 주소이기 이전에 **apiserver가 도는 노드의 podCIDR 네트워크 주소**다.
#     오늘은 서버(컨트롤 플레인) 노드가 노드 A 하나뿐이라 값 하나로 족하다. 서버 노드를 추가하거나
#     옮기면(HA로 가면 어느 서버가 dial할지 고정되지 않는다) 그 노드의 값도 이 규칙에 **함께** 넣어야 한다.
#   ⚠ 다만 **소스 위조 방어 속성은 기존 값과 다르다.** `10.0.7.78`은 노드 A wg 피어의 AllowedIPs
#     (= 노드 A 리스 서브넷 `10.42.0.0/24`, 위 실측 2) **밖**이라 노드 A의 파드가 그 소스를 위조해도
#     노드 B의 wireguard 크립토키 라우팅이 iptables 이전 단계에서 버린다. 반면 `10.42.0.0`은
#     AllowedIPs **안**이라 그 필터가 더는 걸리지 않는다 — 남는 방벽은 PSA뿐이다.
#     `restricted`는 `capabilities.drop [ALL]`을 강제해 CAP_NET_RAW가 없으므로 raw 소켓 소스 위조가
#     불가능하고, `baseline`은 기본 capability 집합(NET_RAW 포함)을 허용한다.
#     **오늘은 성립한다**: 노드 A의 비-특권 워크로드는 argocd·cloudflared·vault(T044)·external-secrets(T045 G1)
#     넷이고 **넷 다 `restricted`**이며(`namespaces.yaml`의 PSA enforce 라벨),
#     baseline ns 셋(cert-manager·cnpg-system·data)은 노드 A에 없다(cert-manager는
#     `platform/cert-manager/kustomization.yaml`의 `nodeSelector role: data`로 노드 B 고정).
#     **따라서 새 전제가 생긴다 — 노드 A에 배치되는 워크로드 ns는 `restricted`를 유지한다.**
#     baseline ns를 노드 A로 옮기려면 이 규칙을 먼저 재검토한다.
#     (도달 대상이 상태를 바꾸지 않는 admission validator라 영향 자체는 낮다.)
#   ⚠ 이 값은 노드 A의 flannel **리스 결과**다. 노드 재조인·재이미지 시
#     `kubectl get node <노드 A> -o jsonpath='{.spec.podCIDR}'`의 네트워크 주소와 반드시 재대조할 것.
#     리스가 예컨대 `10.42.2.0/24`로 바뀌면 이 규칙은 조용히 무력해지고 webhook이 다시 502로 죽는다.
#     이 실패 유형은 Argo Healthy + 파드 Ready 아래에서 완전히 침묵한다(kubelet readiness는 위 LOCAL
#     예외로 항상 통과한다) — 알림이 아니라 이 각주가 유일한 방어선이다.
#
# ── ns별 적용 범위 ─────────────────────────────────────────────────────────────
#   cert-manager (노드 B, 10250)     : 적용. 실제로 깨져 있던 경로다.
#   cnpg-system  (노드 B, 9443)      : **선제 적용**. T052가 같은 "apiserver → 파드 IP 직접 dial"
#       경로를 쓰므로 지금 넣어 두면 T052에서 같은 사고를 **예방한다 — 단 전제가 유지될 때만이다**:
#       ① CNPG webhook이 9443을 듣는다 ② 파드가 노드 B에 뜬다(tasks.md T052 `nodeSelector role=data`)
#       ③ T052 시점에도 노드 A 리스가 여전히 `10.42.0.0/24`다. 셋 다 미검증이므로 **T052 배포 직후
#       dry-run 도달 프로브로 반드시 재확인한다**(이 실패 유형은 Argo Healthy·파드 Ready 아래에서
#       무증상이라, 확인을 건너뛰는 것이 곧 재발이다).
#       오늘 `platform/cnpg/`는 빈 뼈대(T003, 파드 0개)라 이 규칙의 오늘 노출 델타는 정확히 0이다.
#   external-secrets (노드 A, 10250) : **적용**(T045 D6 = A 확정, 2026-09-17). cert-manager·cnpg-system과
#       같은 add-only — 기존 private `/32` + TCP 10250은 그대로 두고 flannel `/32`만 더한다.
#       이것은 "기능 복구"가 아니라 **계약 준수 + 선제 적용**이다: ESO의 Deployment 3개와 API 서버가
#       모두 노드 A라, 동일 노드에서는 위 대조 실험 C)의 kube-router LOCAL 예외로 flannel 주소가 없어도
#       **통과한다** — 2026-09-17 G1 머지 후·이 PR 머지 전(= 이 ns에 flannel `/32`가 없는 상태)의
#       server-side dry-run 실측(`exit 0` + `created (server dry run)`, 음성 대조 =
#       `admission webhook "validate.externalsecret.external-secrets.io" denied the request`).
#       즉 **오늘의 성공은 이 추가와 무관하게 성립했다.** 이 ns의 flannel `/32`는 오늘 어떤 트래픽으로도
#       실증되지 않았고, **노드 간(ESO) webhook 경로는 여전히 미실측**이다. 파드가 노드 B로 옮겨지는
#       순간 필요한 값이 되므로 미리 넣어 둔다(cnpg-system 행과 같은 취지).
#       노출: G1(gitops `c227d3a`) 머지로 ESO 파드 3개가 노드 A에서 가동 중이다. 이 규칙이 새로 여는 것은
#       노드 A 호스트 netns(`10.42.0.0/32`) → TCP 10250 하나이고, 동일 노드에서는 이 규칙 없이도 도달이
#       이미 성립했으므로(위 실측) **ESO가 노드 A에 있는 동안 오늘의 실효 변화는 없다** — 파드가 노드 B로
#       옮겨질 때 비로소 효력이 생긴다.
#       전제: ① webhook 포트가 10250이다 ② 노드 A 리스가 `10.42.0.0/24`로 유지된다.
#       (ESO가 `nodeSelector role: platform`으로 노드 A에 뜨는 것은 이 값의 **유효 조건이 아니다** —
#        노드 A에 있는 동안은 이 값이 쓰이지 않는다.)
#       값의 검증 수단: **머지 전 노드 A 실측** — `ip -4 -o addr show flannel-wg`의 장치 주소와
#       `ip route get <다른 노드(B)의 파드 IP>`의 `src`(노드 간 경로의 출발 주소) — 과 하네스 `np-set-5`
#       (노드 객체 유도값 대조). **2026-09-18 실측으로 확정됐다: 세 값 일치 = `10.42.0.0`**(장치 주소 ·
#       `ip route get 10.42.1.14`의 `src` · `.spec.podCIDR` `10.42.0.0/24`의 네트워크 주소).
#       기록은 모노레포 런북 `docs/runbooks/bootstrap.md` §3 T045 절이다.
#   vault (8200)                     : **고치지도 지우지도 않는다.** port-forward는 kubelet의 CRI
#       스트리밍 서버가 파드 netns 안 loopback으로 붙는 구조라 이 NetworkPolicy를 아예 거치지 않는다
#       — 어떤 값으로 고쳐도 무효다. 그래도 남기는 것은 np-set-5가 4개 ns의 정책 존재를 요구하기 때문이다.
#       ⚠ 이 행에는 flannel 주소를 넣지 않는다. np-set-5와 validate 5.6은 vault 8200의 출발 집합을
#       {노드 A private/32} **하나로 정확히 일치**시켜 검사하므로, 넣으면 여분으로 FAIL한다.
#
# ── 계약 정정: 해소됨 (모노레포 `d5f8a82`, 이 정책 PR 머지 전) ─────────────────
#   ⚠ 이 절에는 오래도록 "계약 정정은 **대기 중**이고 이 PR의 머지 선행 조건이다"라고 적혀 있었다.
#     그 문면은 낡았다. 정정 커밋 `d5f8a82`(2026-09-09 15:17:57)가 이 매니페스트를 담은 PR #13
#     머지(`cad608a`, 15:21:51)보다 **3분 54초 먼저** 들어갔다 — 선행 조건은 지켜졌고,
#     "매니페스트가 계약을 의도적으로 벗어난 상태"는 **끝났다**.
#   무엇이 고쳐졌나(모두 §정책 세트·§허용 매트릭스 안 — 줄 번호로 찾지 말 것):
#     · `allow-apiserver-webhook` 행(§정책 세트) — 출발지에 "**및**(webhook 행 한정)
#       `ipBlock <노드 A flannel 터널 장치 주소>/32`"가 들어갔다.
#     · "노드 A private IP **및** 노드 A flannel 터널 장치 주소 → `cert-manager`·`external-secrets`·
#       `cnpg-system`" 행(§허용 매트릭스 — 클러스터 밖 · 노드 IP) — 출발 열이 같은 취지로 바뀌었다.
#     · port-forward 근거 문장 — 옛 문면은 "port-forward는 API 서버·kubelet을 거치므로 출발 IP가
#       노드 A private IP다"를 `vault` 행의 근거로 적고 그 추론이 webhook 행에까지 걸려 있었다.
#       그 문장은 삭제되고 "이 정책의 두 행은 메커니즘이 다르다" 항이 새로 들어갔다.
#       이 삽입(5줄)이 계약 줄 번호를 뒤에서 +5 민 장본인이다 — 그래서 위 인용 규약이 있다.
#   **잔여 1건 해소 — `external-secrets`(T045 D6 = A, 2026-09-17).** 계약의 webhook 행이 열거하는
#     `cert-manager`·`external-secrets`·`cnpg-system` 셋 중 `external-secrets`에만 flannel 주소가 없어
#     **미결 결정**으로 남아 있었다. T045에서 add-only로 넣기로 확정했고(근거·전제·증명 범위는 위
#     「ns별 적용 범위」의 external-secrets 항목), 이로써 이 파일의 webhook 3 ns는 계약 문면과 정확히
#     일치한다. 판별자로 남겨 두었던 파드 방화벽 체인의 `--src-type LOCAL` 행은 이제 "넣을지 말지"의
#     조건이 아니라 "동일 노드에서 왜 통과하는가"의 설명으로만 남는다(그 **동작**은 2026-09-17 ESO
#     dry-run으로 한 번 더 실측됐고, **체인 실물도 2026-09-18에 확인했다** — 위 절 머리 주석). 넣지 않을 이유였던
#     "불필요한 허용 확대"는 성립하지 않는다 — 허용 대상은 노드 A 호스트 netns 하나이고(위 참조)
#     도달 대상은 webhook 포트 하나라 노출 델타가 cert-manager·cnpg-system 행과 같은 크기이며,
#     ESO가 노드 A에 있는 동안은 실효 변화가 없다(위 「ns별 적용 범위」 참조).
#   참고: 동결되는 것은 `spec.md`·`plan.md`·`tasks.md` 세 파일이며(모노레포 `.claude/rules/specs.md`의
#     동결 항목), `contracts/`는 동결 대상이 **아니다**. 정정 주체는 converge가 아니었다 —
#     `/speckit-converge`는 tasks.md에 phase를 append하는 것이 유일한 쓰기라 contracts/를 고칠 수 없어
#     실제로도 모노레포 단독 커밋으로 처리했다. 같은 상황이 다시 오면 같은 경로를 쓴다.
# =============================================================================
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-apiserver-webhook
  namespace: cert-manager
  labels: { app.kubernetes.io/part-of: platform-policies }
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    # add-only(D6 = A1). 실측 근거·메커니즘·범위는 이 절 머리 주석 참조.
    - from:
        - ipBlock: { cidr: 10.0.7.78/32 }    # 유지: 계약 webhook 행의 "노드 A private IP"(np-set-5·validate 5.6이 집합을 정확 일치로 검사한다 — 절 머리 주석 참조)
        - ipBlock: { cidr: 10.42.0.0/32 }    # 추가: 계약 webhook 행의 "노드 A flannel 터널 장치 주소" = 파드 IP 직접 dial의 실제 출발 IP
      ports: [{ protocol: TCP, port: 10250 }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-apiserver-webhook
  namespace: external-secrets
  labels: { app.kubernetes.io/part-of: platform-policies }
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    # add-only(T045 D6 = A, 2026-09-17) — 계약 준수 + 선제 적용. ESO와 API 서버가 같은 노드 A인 동안에는
    #   이 `/32`가 **없어도 도달한다**(2026-09-17 실측 — 이 절 머리 주석). 따라서 **동일 노드 dry-run
    #   프로브는 이 값을 검증하지 못한다.** 값의 검증 수단은 머지 전 노드 A 실측
    #   (`ip -4 -o addr show flannel-wg`의 장치 주소 · `ip route get <다른 노드(B)의 파드 IP>`의 `src`
    #    = 노드 간 경로의 출발 주소)과 하네스 `np-set-5`(노드 객체 유도값 대조)이며,
    #   **2026-09-18 실측으로 확정됐다(세 값 일치 = `10.42.0.0`)**.
    #   ESO가 노드 A를 떠나면 이 값이 필요해지므로 그때 dry-run 도달 프로브로 처음 실증한다.
    #   값의 전제: 포트 10250 · 노드 A 리스 `10.42.0.0/24` 유지.
    - from:
        - ipBlock: { cidr: 10.0.7.78/32 }    # 유지: 계약 webhook 행의 "노드 A private IP"
        - ipBlock: { cidr: 10.42.0.0/32 }    # 추가: 계약 webhook 행의 "노드 A flannel 터널 장치 주소"
      ports: [{ protocol: TCP, port: 10250 }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-apiserver-webhook
  namespace: cnpg-system
  labels: { app.kubernetes.io/part-of: platform-policies }
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    # 선제 적용 — T052가 같은 "apiserver → 파드 IP 직접 dial" 경로를 쓴다(이 절 머리 주석 참조).
    #   전제(포트 9443 · 노드 B 배치 · 노드 A 리스 10.42.0.0/24 유지)가 유지될 때만 유효하므로
    #   T052 배포 직후 dry-run 도달 프로브로 반드시 재확인한다(무증상 실패 유형).
    - from:
        - ipBlock: { cidr: 10.0.7.78/32 }    # 유지: 계약 webhook 행의 "노드 A private IP"(np-set-5·validate 5.6이 집합을 정확 일치로 검사한다 — 절 머리 주석 참조)
        - ipBlock: { cidr: 10.42.0.0/32 }    # 추가: 계약 webhook 행의 "노드 A flannel 터널 장치 주소"(VD-W 실측)
      ports: [{ protocol: TCP, port: 9443 }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-apiserver-webhook
  namespace: vault
  labels: { app.kubernetes.io/part-of: platform-policies }
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from: [{ ipBlock: { cidr: 10.0.7.78/32 } }]
      ports: [{ protocol: TCP, port: 8200 }]
# =============================================================================
# 조건부 ① deny-imds — kube-system 전용
#   kube-system에는 default-deny가 없으므로 이 한 장이 IMDS만 막는다:
#   `ports`가 없는 것이 의도다(IMDS를 제외한 전 대역·전 포트를 허용하는 egress 규칙 한 장 =
#   IMDS만 도달 불가). default-deny가 있는 나머지 13 ns의 IMDS 차단은 규칙마다 except로 표현한다.
#
#   [D5 미결 — VD-DNS 실측 대기] 노드 resolv.conf 업스트림이 169.254.169.254(OCI VCN 리졸버)이면
#   이 규칙이 CoreDNS의 외부 이름 해석(53)까지 끊는다. 실측 결과가 IMDS면 D5-A를 채택해
#   **바로 아래 자리**에 `allow-coredns-upstream`(kube-system, podSelector k8s-app=kube-dns →
#   ipBlock 169.254.169.254/32, UDP 53 + TCP 53) 1장을 추가한다. 그 추가는 계약 §정책 세트 개정과
#   validate 5.3 예외·부정 픽스처가 선행 조건이며, T041 S2 범위에서는 넣지 않는다(설계 기본형 유지).
# =============================================================================
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: deny-imds
  namespace: kube-system
  labels: { app.kubernetes.io/part-of: platform-policies }
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to: [{ ipBlock: { cidr: 0.0.0.0/0, except: [169.254.169.254/32] } }]
# --- [D5-A 채택 시 allow-coredns-upstream 1장이 들어갈 자리] ---
# =============================================================================
# 조건부 ② allow-imds — vault 전용(인스턴스 프린시펄, OCI KMS auto-unseal)
#   클러스터에서 IMDS(169.254.169.254:80)에 도달할 수 있는 유일한 ns다.
# =============================================================================
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-imds
  namespace: vault
  labels: { app.kubernetes.io/part-of: platform-policies }
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to: [{ ipBlock: { cidr: 169.254.169.254/32 } }]
      ports: [{ protocol: TCP, port: 80 }]
