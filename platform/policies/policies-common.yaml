# =============================================================================
# allow-same-namespace × 7 — ingress·egress 모두 자기 ns(namespaceSelector = 자기 ns 라벨)
#   근거(계약 §정책 세트의 "`allow-same-namespace`가 필요한 이유" 항): Strimzi operator ↔ broker ↔
#   entity-operator · CNPG operator ↔ instance ·
#   Argo server ↔ repo-server ↔ redis ↔ controller · Alloy 내부 · Authentik server ↔ worker.
# =============================================================================
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-same-namespace
  namespace: argocd
  labels: { app.kubernetes.io/part-of: platform-policies }
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
  ingress:
    - from: [{ namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: argocd } } }]
  egress:
    - to: [{ namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: argocd } } }]
