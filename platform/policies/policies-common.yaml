# platform/policies/policies-common.yaml — 공통 정책 세트 5종 + 조건부 2종 (49장)
#
# 정본: 모노레포 specs/003-platform-foundation/contracts/network-policy.md §정책 세트.
#   default-deny 13 · allow-dns 13 · allow-same-namespace 7 · allow-kube-api 10 ·
#   allow-apiserver-webhook 4 · deny-imds 1(kube-system 전용) · allow-imds 1(vault 전용) = 49장.
#   13 = 계약 표 14개 - kube-system. `kube-system`에는 default-deny를 걸지 않는다(K3s 번들 컴포넌트).
#
# 계약 인용 규약: **줄 번호로 인용하지 않는다.** 계약은 개정되면 줄이 밀린다 — 2026-09-09
#   모노레포 `d5f8a82`가 §정책 세트 아래에 5줄을 끼워 넣어 그 뒤 번호가 전부 +5 밀렸고,
#   그때까지 이 파일에 적혀 있던 `:37`·`:48`·`:121` 인용은 한 번에 전부 다른 줄을 가리키게 됐다.
#   그래서 이 파일은 계약을 **절 이름 + 정책 이름/행 키**로만 가리킨다(검색으로 찾는다).
#
# 상수 ①: 노드 A private IP `10.0.7.78` — K8s API 6443(`allow-kube-api`)의 목적지이자
#   `allow-apiserver-webhook`의 원래 출발 IP 가정. 노드 A 호스트가 주 NIC로 나갈 때의 주소다.
# 상수 ②: 노드 A flannel-wg 주소 `10.42.0.0` — apiserver가 **다른 노드의 파드 IP로 직접 dial**할 때의
#   출발 IP다(VD-W 실측 대상이 노드 B 파드 `10.42.1.14`였다). **같은 노드** 파드로 가는 경로는 `cni0`를 타고
#   src가 `10.42.0.1`(브리지 주소)이라 flannel 주소가 아니다(2026-09-18 실측:
#   `ip route get 10.42.0.31` → `dev cni0 src 10.42.0.1`).
#   admission webhook ingress(`allow-apiserver-webhook`의 cert-manager·cnpg-system·external-secrets)에
#   add-only로 추가했다(cert-manager·cnpg-system = VD-W 실측 2026-09-09, external-secrets = T045 D6 = A
#   확정 2026-09-17. 근거는 아래 allow-apiserver-webhook 절 머리 주석).
#   값은 **머지 전 운영자 실측으로 확정됐다**(2026-09-18 실측: 세 값 일치 = `10.42.0.0` — 장치 주소
#   `ip -4 -o addr show flannel-wg` → `inet 10.42.0.0/32 scope global flannel-wg` · 노드 간 경로
#   `ip route get 10.42.1.14` → `dev flannel-wg src 10.42.0.0` · `.spec.podCIDR` `10.42.0.0/24`의 네트워크 주소.
#   기록은 모노레포 런북 `docs/runbooks/bootstrap.md` §3 T045 절).
#   노드 A 파드 CIDR `10.42.0.0/24`의 네트워크 주소라 어떤 파드에도 할당되지 않는다.
#   노드 B private IP는 이 파일에 없다(노드 IP 목적지 규칙은 policies-external.yaml).
#
# 되돌리기용 라벨: 모든 객체에 `app.kubernetes.io/part-of: platform-policies`를 직접 기재한다.
#   Argo CD의 추적 방식은 어노테이션이라 `argocd.argoproj.io/instance` 라벨은 존재하지 않는다.
#   비상 되돌리기 = 컨트롤러 freeze(`kubectl -n argocd scale sts argocd-application-controller --replicas=0`)
#   → `kubectl delete networkpolicy -A -l app.kubernetes.io/part-of=platform-policies`.
#   `argocd app sync --prune`은 쓰지 않는다(agent-view RBAC까지 지운다).
#
# 추가 허용 규칙 금지: 계약의 허용 매트릭스가 exhaustive다. 새 경로가 필요하면 계약을 먼저 고친다.
#
# =============================================================================
