# =============================================================================
# 조건부 ① deny-imds — kube-system 전용
#   kube-system에는 default-deny가 없으므로 이 한 장이 IMDS만 막는다:
#   `ports`가 없는 것이 의도다(IMDS를 제외한 전 대역·전 포트를 허용하는 egress 규칙 한 장 =
#   IMDS만 도달 불가). default-deny가 있는 나머지 13 ns의 IMDS 차단은 규칙마다 except로 표현한다.
#
#   [D5 미결 — VD-DNS 실측 대기] 노드 resolv.conf 업스트림이 169.254.169.254(OCI VCN 리졸버)이면
#   이 규칙이 CoreDNS의 외부 이름 해석(53)까지 끊는다. 실측 결과가 IMDS면 D5-A를 채택해
#   **바로 아래 자리**에 `allow-coredns-upstream`(kube-system, podSelector k8s-app=kube-dns →
#   ipBlock 169.254.169.254/32, UDP 53 + TCP 53) 1장을 추가한다. 그 추가는 계약 §정책 세트 개정과
#   validate 5.3 예외·부정 픽스처가 선행 조건이며, T041 S2 범위에서는 넣지 않는다(설계 기본형 유지).
# =============================================================================
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: deny-imds
  namespace: kube-system
  labels: { app.kubernetes.io/part-of: platform-policies }
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to: [{ ipBlock: { cidr: 0.0.0.0/0, except: [169.254.169.254/32] } }]
# --- [D5-A 채택 시 allow-coredns-upstream 1장이 들어갈 자리] ---
# =============================================================================
# 조건부 ② allow-imds — vault 전용(인스턴스 프린시펄, OCI KMS auto-unseal)
#   클러스터에서 IMDS(169.254.169.254:80)에 도달할 수 있는 유일한 ns다.
# =============================================================================
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-imds
  namespace: vault
  labels: { app.kubernetes.io/part-of: platform-policies }
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to: [{ ipBlock: { cidr: 169.254.169.254/32 } }]
      ports: [{ protocol: TCP, port: 80 }]
