      ports: [{ protocol: TCP, port: 443 }]
# 계약 §외부 매트릭스 — `monitoring` → 외부 443: Grafana Cloud metrics · logs · traces 전송
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-egress-external-443
  namespace: monitoring
  labels: { app.kubernetes.io/part-of: platform-policies }
spec:
  podSelector: {}
