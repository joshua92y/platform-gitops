# :116 system-upgrade → 외부 443 — `update.k3s.io` 채널 조회
#   계약이 "컨트롤러만"이라고 적는 것과 `podSelector: {}`가 어긋나지 않는 이유: 같은 ns의 Plan Job pod는
#   hostPID·hostIPC·hostNetwork가 SUC에 하드코딩되어 있어 NetworkPolicy 밖이다(계약 :139 예외표,
#   platform/system-upgrade/kustomization.yaml 머리 주석). 즉 이 정책이 실제로 덮는 pod는 컨트롤러뿐이다.
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-egress-external-443
  namespace: system-upgrade
  labels: { app.kubernetes.io/part-of: platform-policies }
spec:
