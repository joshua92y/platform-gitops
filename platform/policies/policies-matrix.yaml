# platform/policies/policies-matrix.yaml — 클러스터 내부 허용 매트릭스 (31장 = ingress 21 + egress 10)
#
# 정본: 모노레포 specs/003-platform-foundation/contracts/network-policy.md
#   `## 허용 매트릭스 — 클러스터 내부 (출발 ns → 도착 ns:포트)` 절.
#   이 표는 exhaustive다 — 표에 없는 허용 규칙을 추가하지 않는다. 새 경로가 필요하면
#   계약을 먼저 고친다(`allow-all`로 푸는 것은 금지).
#   그 표의 마지막 행(전 ns → `kube-system` kube-dns 53)은 `allow-dns`로 policies-common.yaml에 있다.
#
# 계약 인용 규약: **줄 번호로 인용하지 않는다.** 계약은 개정되면 줄이 밀린다 — 2026-09-09
#   모노레포 `d5f8a82`가 §정책 세트 아래에 5줄을 끼워 넣어 그 뒤 번호가 전부 +5 밀렸고,
#   그때까지 이 파일이 정책마다 달고 있던 `:77`~`:96` 인용은 한 번에 전부 다른 줄을 가리키게 됐다.
#   그래서 아래 주석은 **행 키(`<출발> → <도착> <포트>`)**로만 가리킨다 — 계약 안에서 검색으로 찾는다.
#   약칭 `§내부 매트릭스` = 위 절 이름(이 문자열로 검색한다).
#
# 구현 규칙(계약 §내부 매트릭스 머리글 "각 행은 출발 ns의 egress 규칙 + 도착 ns의 ingress 규칙
#   한 쌍으로 구현한다"). 예외 = 출발이 `kube-system`(traefik)인 5행(→ `argocd` 8080 · `vault` 8200 ·
#   `identity` 9000 · `jt-dev`·`jt-prod` 8000 · `monitoring` 4317). `kube-system`에는 default-deny를
#   걸지 않으므로(계약 §정책 세트 `default-deny` 행의 적용 범위 "`kube-system` 제외 13 ns"와
#   그 아래 "`kube-system`에는 default-deny를 걸지 않는다" 항) 그 ns의 egress는 애초에 제한되지 않고,
#   정책은 `deny-imds` 한 장뿐이어야 한다(계약 §네임스페이스 표의 "`kube-system`은 … 라벨만 SSA로
#   패치하고(정책은 `deny-imds`만)" 항 · tests/platform/cluster.tests.ps1 np-1
#   "kube-system policies == {deny-imds}"). 따라서 그 5행은 **도착 ns의 ingress로만** 구현한다.
#   위 "한 쌍" 문언과의 차이는 converge 인계 항목이다(규칙 추가가 아니라 누락 쪽).
#
# 정책 이름 규약:
#   도착 ns ingress — allow-from-traefik · allow-from-apps · allow-from-identity ·
#     allow-from-external-secrets · allow-scrape-from-monitoring ·
#     allow-otlp-from-traefik · allow-otlp-from-apps
#   출발 ns egress  — allow-egress-to-<도착> · allow-egress-scrape
#   공통 세트 이름(default-deny · allow-dns · allow-same-namespace · allow-kube-api ·
#   allow-apiserver-webhook · deny-imds · allow-imds)은 policies-common.yaml 전용이다
#   (같은 ns에 같은 이름을 또 만들면 kustomize 중복 ID + validate 5.2 EXCLUSIVE 위반).
#
# selector 규약: namespaceSelector는 `kubernetes.io/metadata.name` matchLabels만 쓴다.
#   matchExpressions는 cluster.tests.ps1의 정적 파서(Get-IngressSources)가 평가하지 못해
#   np-3·np-4가 unevaluable로 FAIL한다. traefik 출발은 kube-system namespaceSelector +
#   **같은 peer 안의** podSelector `app.kubernetes.io/name=traefik`으로 좁힌다.
#
# 이 파일에는 ipBlock 규칙이 없다 — 클러스터 밖·노드 IP 목적지는 policies-external.yaml,
#   노드 A /32(6443·webhook)는 policies-common.yaml이 맡는다.
#
# 되돌리기용 라벨: 모든 객체에 `app.kubernetes.io/part-of: platform-policies`를 직접 기재한다
#   (Argo CD 추적은 어노테이션 방식이라 `argocd.argoproj.io/instance` 라벨은 존재하지 않는다).
#
# 검산:
#   ingress 21 = argocd 2 · vault 3 · external-secrets 1 · cert-manager 1 · cnpg-system 1 ·
#                data 3 · identity 2 · jt-dev 3 · jt-prod 3 · monitoring 2
#   egress  10 = external-secrets 1 · identity 2 · jt-dev 3 · jt-prod 3 · monitoring 1
#
# =============================================================================
# INGRESS — 도착 ns 21장
# =============================================================================

# --- argocd (2) --------------------------------------------------------------
---
# 계약 §내부 매트릭스 — kube-system(traefik) → argocd 8080: Argo CD UI/API(Ingress `argo.`)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-from-traefik
  namespace: argocd
  labels: { app.kubernetes.io/part-of: platform-policies }
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from: [{ namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: kube-system } }, podSelector: { matchLabels: { app.kubernetes.io/name: traefik } } }]
      ports: [{ protocol: TCP, port: 8080 }]
---
# 계약 §내부 매트릭스 — monitoring → argocd 8082·8083·8084: metrics(application-controller·repo-server·server)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-scrape-from-monitoring
  namespace: argocd
  labels: { app.kubernetes.io/part-of: platform-policies }
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from: [{ namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: monitoring } } }]
      ports: [{ protocol: TCP, port: 8082 }, { protocol: TCP, port: 8083 }, { protocol: TCP, port: 8084 }]

