# --- monitoring (1) ----------------------------------------------------------
---
# 계약 :89–:95 — monitoring → scrape 대상 7 ns. 도착 ingress는 각 ns의
#   allow-scrape-from-monitoring(계약 :98 "namespaceSelector가 monitoring인 것만")이다.
#   :89 argocd 8082·8083·8084 / :90 vault 8200 / :91 external-secrets 8080 /
#   :92 cert-manager 9402 / :93 cnpg-system 8080 / :94 data 9187·9404 /
#   :95 jt-dev·jt-prod 9100·9464.
#   계약 공백(규칙을 추가하지 않는다 — 설계 §5.1, T098 결정 대상): argocd notifications 9001 ·
#   node-exporter 노드 IP 9100(hostNetwork) · traefik 9100(kube-system) · cloudflared 2000.
#   kubelet 10250(계약 :115)은 노드 IP 목적지라 policies-external.yaml이 맡는다.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-egress-scrape
  namespace: monitoring
  labels: { app.kubernetes.io/part-of: platform-policies }
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to: [{ namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: argocd } } }]
      ports: [{ protocol: TCP, port: 8082 }, { protocol: TCP, port: 8083 }, { protocol: TCP, port: 8084 }]
    - to: [{ namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: vault } } }]
      ports: [{ protocol: TCP, port: 8200 }]
    - to: [{ namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: external-secrets } } }]
      ports: [{ protocol: TCP, port: 8080 }]
    - to: [{ namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: cert-manager } } }]
      ports: [{ protocol: TCP, port: 9402 }]
    - to: [{ namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: cnpg-system } } }]
      ports: [{ protocol: TCP, port: 8080 }]
    - to: [{ namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: data } } }]
      ports: [{ protocol: TCP, port: 9187 }, { protocol: TCP, port: 9404 }]
    - to: [{ namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: jt-dev } } }, { namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: jt-prod } } }]
      ports: [{ protocol: TCP, port: 9100 }, { protocol: TCP, port: 9464 }]
