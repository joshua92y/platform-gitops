# --- identity (2) ------------------------------------------------------------
---
# 계약 §내부 매트릭스 — kube-system(traefik) → identity 9000: Authentik(`auth.` Ingress, forward-auth outpost)
#   계약 §내부 매트릭스 아래 "`traefik → identity 8080`(OpenFGA) 행은 **삭제**했다" 항 — OpenFGA는 공개 호스트가 없고
#   클러스터 안(jt-* → identity 8080)에서만 호출한다.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-from-traefik
  namespace: identity
  labels: { app.kubernetes.io/part-of: platform-policies }
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from: [{ namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: kube-system } }, podSelector: { matchLabels: { app.kubernetes.io/name: traefik } } }]
      ports: [{ protocol: TCP, port: 9000 }]
---
# 계약 §내부 매트릭스 — jt-dev·jt-prod → identity 9000·8080: Authentik(JWKS·revoke API, svc DNS) · OpenFGA
#   계약 §공개 호스트 예외(FR-046 예외 2)의 범위 — "pod(identity-admin 등)의 **JWKS는 svc DNS**를 쓴다" 항
#   (`http://authentik-server.identity.svc:9000/application/o/<pod>/jwks/`).
#   공개 호스트로 나가지 않으므로 jt-* 외부 443 규칙에 Authentik은 들어가지 않는다.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-from-apps
  namespace: identity
  labels: { app.kubernetes.io/part-of: platform-policies }
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from: [{ namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: jt-dev } } }, { namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: jt-prod } } }]
      ports: [{ protocol: TCP, port: 9000 }, { protocol: TCP, port: 8080 }]

