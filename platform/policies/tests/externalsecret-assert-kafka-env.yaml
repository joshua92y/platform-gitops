# platform/policies/tests/externalsecret-assert-kafka-env.yaml — 검사 Job `kafka-assert`의 **dev scope 자격증명**(ExternalSecret `assert-kafka-env`)
#
# 문면(tasks.md:120): 검사 Job은 "**dev scope ExternalSecret만** `envFrom`"하며 prod 자격은 갖지 않는다.
# 계약(hostnames-and-access.md :61-73): 검사 Job의 ns는 `jt-dev`뿐이다(dev 자격은 store `vault-dev`에서만 나오고 그 store의
#   `conditions.namespaces`가 `jt-dev` 하나다). ExternalSecret 규약 준수 항목은 `externalsecret-assert-data-env.yaml` 머리 주석과 같다(검사 Job ES 3장 공통).
#
# ES를 Job별로 나눈 이유: 자격 격리 + 부분 실패 격리(한 ES의 경로 하나가 없어도 다른 Job은 돈다 · 2026-10-29 T059 D5 — README 후속 결정 1 채택).
#   kafka-assert는 이 ES의 키 하나(SCRAM 비밀번호)만 받는다 — DB 비밀번호 · Dragonfly URL · OpenFGA 토큰을 보지 않는다.
#
# 리소스 wave "0"(ConfigMap `assert-config`와 같다 · Job은 "1") — 이유는 `externalsecret-assert-data-env.yaml` 머리 주석과 같다
#   (Application 표의 숫자가 아니라 Application `platform-tests` 안의 적용 순서).
#
# 값의 원천(data-model.md §8) — 이 ES의 1키:
#   dev/kafka/identity-admin       password                (KafkaUser `dev-identity-admin`의 SCRAM 비밀번호)
#   같은 kv 경로를 ns data의 ES `kafka-user-dev-identity-admin`(store `vault-data` — `platform/kafka-topics/`)이 KafkaUser 비밀번호의 원천으로 읽는다
#   (한 값 · 두 소비자).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: assert-kafka-env
  namespace: jt-dev
  labels:
    app.kubernetes.io/name: assert-kafka-env
    app.kubernetes.io/component: assert-job
    app.kubernetes.io/part-of: policies-tests
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-dev
  target:
    name: assert-kafka-env
    creationPolicy: Owner
  data:
    # --- Kafka: KafkaUser `dev-identity-admin`(SCRAM-SHA-512) -------------------
    - secretKey: KAFKA_PASSWORD
      remoteRef:
        key: dev/kafka/identity-admin
        property: password
