# platform/policies/tests/externalsecret-assert-authz-env.yaml — 검사 Job `authz-assert`의 **dev scope 자격증명**(ExternalSecret `assert-authz-env`)
#
# **kustomization 밖(T085까지 · T059 결정 D4)**: `kustomization.yaml` resources에 없어 렌더 · Argo 적용 대상이 아니다. kv `dev/openfga/store_id` ·
#   `dev/openfga/preshared`가 아직 시드되지 않았고(OpenFGA = T082 뼈대) 그대로 적용하면 이 ES는 `SecretSyncedError`(Degraded)다. T085(US4 E2E)가
#   OpenFGA 배포와 kv 시드 뒤 이 파일과 `job-authz-assert.yaml`을 resources에 다시 넣는다. 파일로만 남아 있어도 validate 검사 3(파일 단위)은 이 ES를 본다.
#
# 문면(tasks.md:120): 검사 Job은 "**dev scope ExternalSecret만** `envFrom`"하며 prod 자격은 갖지 않는다.
# 계약(hostnames-and-access.md :61-73): 검사 Job의 ns는 `jt-dev`뿐이다(dev 자격은 store `vault-dev`에서만 나오고 그 store의
#   `conditions.namespaces`가 `jt-dev` 하나다). ExternalSecret 규약 준수 항목은 `externalsecret-assert-data-env.yaml` 머리 주석과 같다(검사 Job ES 3장 공통).
#
# ES를 Job별로 나눈 이유: 자격 격리 + 부분 실패 격리(한 ES의 경로 하나가 없어도 다른 Job은 돈다 · 2026-10-29 T059 D5 — README 후속 결정 1 채택).
#   authz-assert는 이 ES의 OpenFGA 값 둘만 받는다 — 이 ES가 실패해도(kv 경로 미시드) data-assert · kafka-assert는 돈다.
#
# 리소스 wave "0"(Job은 "1") — 이유는 `externalsecret-assert-data-env.yaml` 머리 주석과 같다(resources에 포함되는 T085부터 의미가 있다).
#
# 값의 원천(data-model.md §8) — 이 ES의 2키:
#   dev/openfga/store_id           store_id
#   dev/openfga/preshared          key
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: assert-authz-env
  namespace: jt-dev
  labels:
    app.kubernetes.io/name: assert-authz-env
    app.kubernetes.io/component: assert-job
    app.kubernetes.io/part-of: policies-tests
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-dev
  target:
    name: assert-authz-env
    creationPolicy: Owner
  data:
    # --- OpenFGA: dev store + preshared 키 --------------------------------------
    - secretKey: OPENFGA_STORE_ID
      remoteRef:
        key: dev/openfga/store_id
        property: store_id
    - secretKey: OPENFGA_TOKEN
      remoteRef:
        key: dev/openfga/preshared
        property: key
