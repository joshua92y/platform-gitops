# platform/policies/tests/externalsecret-assert-data-env.yaml — 검사 Job `data-assert`의 **dev scope 자격증명**(ExternalSecret `assert-data-env`)
#
# 문면(tasks.md:120): 검사 Job은 "**dev scope ExternalSecret만** `envFrom`"하며 prod 자격은 갖지 않는다.
# 계약(hostnames-and-access.md :61-73): 검사 Job의 ns는 `jt-dev`뿐이다 — dev 자격은 `ClusterSecretStore vault-dev`
#   에서만 나오고 그 store의 `conditions.namespaces`가 `jt-dev` 하나이기 때문이다.
#
# 계약 gitops-repo.md §ExternalSecret 규약 준수(검사 Job ES 3장 공통 — `assert-kafka-env` · `assert-authz-env`도 같다):
#   - `apiVersion: external-secrets.io/v1`(v1beta1 금지)
#   - `secretStoreRef.kind: ClusterSecretStore`, 이름은 5개 store 중 `vault-dev`
#   - `refreshInterval: 5m`(전 ExternalSecret 공통)
#   - `remoteRef.key`는 전부 `dev/` 접두(정규식 `^(platform|dev|prod)/[a-z0-9_./-]+$`) — prod·platform 경로 0개
#   - `dataFrom` 없음(경로 lint 우회 금지) · 항목별 `sourceRef` 없음
#   - `auth.kubernetes.serviceAccountRef`는 store(ClusterSecretStore `vault-dev`) 쪽 설정이며 여기서는 쓰지 않는다
#     (store 정의는 T045 G2의 `platform/secret-stores/`; 거기서 `namespace: external-secrets`를 반드시 적는다)
#
# ES를 Job별로 나눈 이유: 자격 격리 + 부분 실패 격리(한 ES의 경로 하나가 없어도 다른 Job은 돈다 · 2026-10-29 T059 D5 — README 후속 결정 1 채택).
#   그 전에는 세 Job이 ES `assert-env` 하나(8키 · kv 6경로 — 설계 §6.3)를 공유했다. 그 모양으로는 kv 경로 하나만 비어도(지금 `dev/openfga/*` 두
#   경로가 미시드다) ES 전체가 `SecretSyncedError`라 Secret이 생기지 않고 세 Job이 모두 뜨지 못한다. 나눈 뒤 data-assert는 DB 자격과 Dragonfly URL만,
#   kafka-assert는 SCRAM 비밀번호만(`externalsecret-assert-kafka-env.yaml`), authz-assert는 OpenFGA 값만(`externalsecret-assert-authz-env.yaml` — T085까지
#   kustomization 밖) 본다.
#
# 리소스 wave "0"(ConfigMap `assert-config`와 같다 · Job은 "1"): Argo는 이 ES가 Healthy(Ready=True = SecretSynced — Argo CD v3.5.2
#   resource_customizations/external-secrets.io/ExternalSecret/health.lua)가 된 뒤 Job을 적용한다 — Secret이 생기기 전에 뜬 Job 파드가
#   `CreateContainerConfigError`로 기다리며 `activeDeadlineSeconds`를 쓰지 않게. Application 표의 숫자가 아니라 Application `platform-tests` 안의
#   적용 순서다. target.template이 없어 ESO가 이 ES의 라벨 · 어노테이션(이 sync-wave · Argo tracking-id 포함)을 Secret에 복사한다 — 받아들인 사실
#   (`platform/dragonfly/externalsecrets-acl.yaml` 머리 주석과 같다 — 종류가 다른 복사본은 Argo 관리 대상으로 세지 않는다).
#
# 값의 원천(data-model.md §8) — 이 ES의 5키:
#   dev/db/dev_identity_admin/app  username·password·url   (url에 `sslmode=verify-full&sslrootcert=/etc/pg/ca.crt` 포함)
#   dev/dragonfly/identity-admin   url                     (`ACL LIST` 조회용 — `+@all` 사용자)
#   dev/dragonfly/sample-pod       url                     (dev 전용 검사 계정 — NOPERM 프로브용, T057)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: assert-data-env
  namespace: jt-dev
  labels:
    app.kubernetes.io/name: assert-data-env
    app.kubernetes.io/component: assert-job
    app.kubernetes.io/part-of: policies-tests
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-dev
  target:
    name: assert-data-env
    creationPolicy: Owner
  data:
    # --- pg-main: dev app role(`dev_identity_admin_app`) ------------------------
    - secretKey: DATABASE_URL
      remoteRef:
        key: dev/db/dev_identity_admin/app
        property: url
    - secretKey: PGUSER
      remoteRef:
        key: dev/db/dev_identity_admin/app
        property: username
    - secretKey: PGPASSWORD
      remoteRef:
        key: dev/db/dev_identity_admin/app
        property: password
    # --- Dragonfly: ACL 조회용(identity-admin) · NOPERM 프로브용(sample-pod) ----
    - secretKey: DRAGONFLY_URL
      remoteRef:
        key: dev/dragonfly/identity-admin
        property: url
    - secretKey: DRAGONFLY_SAMPLE_URL
      remoteRef:
        key: dev/dragonfly/sample-pod
        property: url
