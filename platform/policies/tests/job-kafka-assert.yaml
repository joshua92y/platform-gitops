# platform/policies/tests/job-kafka-assert.yaml — Kafka 왕복·교차 env 거부 검사 Job
#
# 계약 hostnames-and-access.md §자격이 필요한 검사: `kcat` 같은 자격 필요 검사는 tester가 실행하지 않는다.
# tester는 `kubectl -n jt-dev logs job/kafka-assert`만 읽는다.
#
# 검사 id(quickstart §US3): roundtrip · cross-env-denied — 로그 계약은 README.md §로그 계약.
#
# 클라이언트 선택: `edenhill/kcat:1.7.1`은 Docker Hub 매니페스트가 **단일 아키텍처(amd64)**라 arm64 노드
#   2대에서 실행되지 않는다(registry v2 API 실측). 그래서 공식 `apache/kafka` 이미지의 콘솔 도구
#   (`/opt/kafka/bin/kafka-console-{producer,consumer}.sh`, bash 포함 — 이미지 히스토리 실측)를 쓴다.
#   이미지 버전은 브로커(T055 Kafka 4.3.1)와 같은 4.3.1이다.
#
# 자격: SASL_SSL / SCRAM-SHA-512(사용자 `dev-identity-admin`) + Strimzi 클러스터 CA(`jt-kafka-cluster-ca-cert`
#   미러)를 PEM truststore로 쓴다. 비밀번호는 ExternalSecret `assert-env`에서만 오고, 런타임에 만드는
#   client.properties는 emptyDir(`/tmp`)에만 쓰며 로그에 찍지 않는다(Kafka 클라이언트는 설정 덤프에서
#   비밀번호를 [hidden]으로 마스킹한다). 비밀번호가 base64url 형식이 아니면 client.properties를 쓰기 전에 두 검사를
#   FAIL로 닫고, 로그에 싣는 진단 줄(safe_tail 다섯 곳 + cross-env PASS 근거)은 전부 `password` · `jaas`가 든 줄을 거른다(리뷰 r2 K5 · O11 · r3 A1).
apiVersion: batch/v1
kind: Job
metadata:
  name: kafka-assert
  namespace: jt-dev
  labels:
    app.kubernetes.io/name: kafka-assert
    app.kubernetes.io/component: assert-job
    app.kubernetes.io/part-of: policies-tests
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 300
  ttlSecondsAfterFinished: 604800
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kafka-assert
        app.kubernetes.io/component: assert-job
        app.kubernetes.io/part-of: policies-tests
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        # 이미지의 config User가 이름(`appuser`)이라 kubelet이 비루트 여부를 판정할 수 없다 — 숫자로 못박는다.
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: tmp
          emptyDir: {}
        - name: kafka-ca
          secret:
            # Strimzi 클러스터 CA 미러(ESO store `k8s-data-ca`, key `ca.crt`) — T056 산출물.
            secretName: jt-kafka-cluster-ca-cert
            items:
              - key: ca.crt
                path: ca.crt
      containers:
        - name: kafka-assert
          image: apache/kafka:4.3.1@sha256:77e3df9054047a88b520d0cc46e16696d3b22022e1d580aeccd2632df6532837
          workingDir: /tmp
          command: [/bin/bash, -c]
          args:
            - |
              set -u
              # 읽기 전용 루트 파일시스템에서 도구가 쓰는 경로를 전부 emptyDir(/tmp)로 돌린다.
              export LOG_DIR=/tmp/logs
              export HOME=/tmp
              export KAFKA_HEAP_OPTS="-Xms64m -Xmx256m"
              mkdir -p "$LOG_DIR"
              pass=0
              fail=0
              ok() { pass=$((pass + 1)); printf 'RESULT: PASS %s\n' "$*"; }
              ng() { fail=$((fail + 1)); printf 'RESULT: FAIL %s\n' "$*"; }

              miss=''
              for v in KAFKA_BOOTSTRAP KAFKA_USERNAME KAFKA_PASSWORD KAFKA_DEV_TOPIC KAFKA_PROD_TOPIC KAFKA_GROUP KAFKA_CA KAFKA_CONSUME_TIMEOUT_MS KAFKA_ROUNDTRIP_DEADLINE_S; do
                eval "val=\${$v:-}"
                [ -n "$val" ] || miss="$miss $v"
              done
              if [ ! -r "${KAFKA_CA:-/nonexistent}" ]; then
                miss="$miss ${KAFKA_CA:-KAFKA_CA}(파일 없음)"
              fi
              if [ -n "$miss" ]; then
                ng "roundtrip 필수 값 없음:$miss"
                ng "cross-env-denied 필수 값 없음:$miss"
                printf 'SUMMARY: pass=%d fail=%d\n' "$pass" "$fail"
                exit 1
              fi
              # 비밀번호 형식(리뷰 r2 K5) — 시드 블록이 만드는 값은 base64url(`A–Z a–z 0–9 _ -`)뿐이다. 그 밖의 문자(따옴표 · 역슬래시 · 공백 · 개행 등)가 하나라도
              #    있으면 아래 JAAS 문자열(`password="…"`)을 안전하게 만들 수 없고, Kafka가 JAAS 파싱 오류 문구에 비밀번호 조각을 실어 stderr에 찍는다
              #    (Kafka 4.3.1 JaasConfig.java :113–116 · ConsoleConsumer.java :66–68). 그래서 CFG를 쓰기 전에(JVM 기동 0) 두 검사를 FAIL로 닫는다 — 값 · 길이 ·
              #    조각은 출력하지 않는다. 빈 값은 위 필수 값 확인이 잡는다. 문자를 범위(`A-Z`) 대신 나열한다: bash는 비ASCII 문자를 범위와 비교할 때 로캘
              #    정렬(wcscoll)을 써서 glibc식 정렬에서는 전각 A(U+FF21) · Kelvin 기호(U+212A)가 `A-Z` 안으로 들어간다(Alpine musl에서는 두 표기의 결과가 같다 —
              #    로컬 Alpine 3.24.1 확인 · tests README 「검증 기록 (T056)」).
              case "$KAFKA_PASSWORD" in
                *[!ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789_-]*)
                  why='KAFKA_PASSWORD 형식이 base64url이 아니다(값 미출력 — 시드 블록 밖 kv 쓰기 의심 · JAAS 문자열을 안전하게 만들 수 없다)'
                  ng "roundtrip $why"
                  ng "cross-env-denied $why"
                  printf 'SUMMARY: pass=%d fail=%d\n' "$pass" "$fail"
                  exit 1
                  ;;
              esac

              CFG=/tmp/kafka-client.properties
              umask 077
              {
                echo "security.protocol=SASL_SSL"
                echo "sasl.mechanism=SCRAM-SHA-512"
                printf 'sasl.jaas.config=org.apache.kafka.common.security.scram.ScramLoginModule required username="%s" password="%s";\n' "$KAFKA_USERNAME" "$KAFKA_PASSWORD"
                echo "ssl.truststore.type=PEM"
                echo "ssl.truststore.location=$KAFKA_CA"
              } > "$CFG"

              marker="policies-assert-$(date -u +%Y%m%dT%H%M%SZ)-$$"

              # ① roundtrip — dev 토픽 왕복 + 메시지 경로 지연 `latency=<n>ms`(T056 · 모노레포 하네스 kafka.tests.ps1 job-k-3이 ≤ 5000 ms로 판정 — README §로그 계약).
              #    ⓐ 컨슈머 선기동(수신 줄마다 수신 시각 ms를 앞에 붙인다) → ⓑ 파티션 할당 확인(상한 60 s) → ⓒ produce → ⓓ 마커 줄 폴링(produce 시작부터
              #    KAFKA_ROUNDTRIP_DEADLINE_S) → ⓔ 컨슈머 종료(kill + wait — 스스로 끝났어도 된다) → ⓕ RESULT 1줄(앞에 EVIDENCE ≤ 2줄 — 마커 미수신 · produce 실패 경로만).
              #    latency = 마커 수신 시각 − 레코드 CreateTime(프로듀서가 send 때 찍는다 — 둘 다 이 파드의 시계). 벽시계 `<n>s` = produce 시작 ~ 마커 수신
              #    (프로듀서 JVM 기동 포함 — Job 자체 상한 판정용이고 하네스 판정값이 아니다). 실패 줄에는 latency 토큰을 넣지 않는다.
              #    `date +%s%3N`은 GNU coreutils다(이미지 = Alpine 3.23.4 + eclipse-temurin 레이어가 설치한 coreutils의 `/bin/date` — README 「검증 기록 (T056)」).
              TAB=$(printf '\t')
              # 이 실행의 컨슈머 client.id — ⓑ가 **자기 멤버**의 할당 행만 준비로 보게 한다. 지정하지 않으면 실행마다 같은 `console-consumer`다
              #    (Kafka 4.3.1 ConsoleConsumerOptions.java :285–287). 파드 안 `$$`는 실행마다 같을 수 있어 초 단위 epoch를 붙인다.
              cid="kafka-assert-$$-$(date +%s)"
              m_recv=''; m_ts=''; m_val=''; cpid=''
              rm -f /tmp/consume.log /tmp/consumer.err /tmp/consumer.pid /tmp/groups.log
              find_marker() {
                [ -f /tmp/consume.log ] || return 1
                while IFS="$TAB" read -r m_recv m_ts m_val; do
                  [ "$m_val" = "$marker" ] && return 0
                done </tmp/consume.log
                return 1
              }
              consumer_alive() {
                [ -n "$cpid" ] || cpid=$(cat /tmp/consumer.pid 2>/dev/null)
                [ -n "$cpid" ] && kill -0 "$cpid" 2>/dev/null
              }
              stop_consumer() {
                consumer_alive && kill "$cpid" 2>/dev/null
                wait
              }
              # 진단 한 줄 `safe_tail <파일> <n자>`(리뷰 r2 K5 · O11) — 진단 다섯 곳이 이 규칙 하나다(consumer_err · groups_note ·
              #    producer EVIDENCE · produce rc≠0 RESULT · cross-env 실패 꼬리 · cross-env PASS 근거는 같은 두 필터를 직접 건다 — r3 A1): 오류 · 상태 줄(대소문자 무시 error · exception · caused by · denied ·
              #    not authorized · timeout · timed out + describe 상태 문구 active members · rebalancing · does not exist) 가운데 들여쓴 줄(스택 프레임
              #    `\tat …` · `\t... N more`)과 `password` · `jaas`가 든 줄(대소문자 무시)을 버린 뒤 마지막 줄의 뒤 n자(Kafka 로그 줄은 원인이 끝에 온다) ·
              #    남는 줄이 없으면 빈 문자열(부르는 쪽이 nodiag 문구로 바꾼다 — producer EVIDENCE는 줄을 내지 않는다).
              safe_tail() {
                sd=$(grep -iE 'error|exception|caused by|denied|not authorized|timeout|timed out|active members|rebalancing|does not exist' "$1" 2>/dev/null |
                  grep -v '^[[:space:]]' | grep -viE 'password|jaas' | tail -n 1)
                [ "${#sd}" -le "$2" ] || sd="…${sd: -$(( $2 - 1 ))}"
                printf '%s' "$sd"
              }
              nodiag='(진단 줄 없음 — 오류 · 상태 줄이 없거나 password · jaas가 든 줄뿐)'
              consumer_err() { ce=$(safe_tail /tmp/consumer.err 140); printf '%s' "${ce:-$nodiag}"; }
              groups_note() { gn=$(safe_tail /tmp/groups.log 140); printf '%s' "${gn:-$nodiag}"; }
              # 프로듀서 진단 한 줄 — 4.3.1 ConsoleProducer는 기본이 비동기 send라(ConsoleProducer.java :107–111 — 실패는 ErrorLoggingCallback이 로그로만 남긴다)
              #    인증 · ACL · 타임아웃으로 send가 실패해도 rc 0으로 끝난다(:79). 그래서 마커 미수신 · produce 실패 경로에서 /tmp/produce.log의 safe_tail을
              #    싣는다 — 남는 줄이 없으면 EVIDENCE 줄을 내지 않는다.
              producer_evidence() {
                pe=$(safe_tail /tmp/produce.log 140)
                [ -z "$pe" ] || printf 'EVIDENCE: producer 마지막 오류: %s\n' "$pe"
              }
              is_num() { case "$1" in ''|*[!0-9]*) return 1 ;; esac; return 0; }
              # ⓐ 유휴 상한(--timeout-ms) = ⓑ 상한 60 s + ⓓ 상한 + KAFKA_CONSUME_TIMEOUT_MS. ConsoleConsumer의 유휴 타이머는 첫 poll(그룹 가입 포함)부터 흐르므로
              #    (Kafka 4.3.1 tools ConsoleConsumer.java :211–217) 20 s만 주면 할당이 늦을 때 마커 전에 스스로 끝난다. 정상 경로는 ⓔ의 kill로 끝난다.
              #    옵션은 4.2+ 이름(--command-config · --formatter-property · --command-property(:99–102)): 옛 이름(--consumer.config · --property ·
              #    --consumer-property)은 폐기 안내를 **stdout**에 찍어(ConsoleConsumerOptions.java :216–223 · :379–382) 수신 기록에 섞인다.
              #    --command-property는 --command-config 파일 값보다 우선한다(:109 · :281–282). 출력 줄 = `CreateTime:<ms>\t<값>`(DefaultMessageFormatter.java :131–138 · :186–188).
              #    그룹이 있으면 offset 기본값 latest(:328–331) — 할당 뒤 쓴 마커만 읽는다(이전 실행의 커밋이 있으면 그 뒤부터 — 마커는 실행마다 다르다).
              ctimeout=$(( (60 + KAFKA_ROUNDTRIP_DEADLINE_S) * 1000 + KAFKA_CONSUME_TIMEOUT_MS ))
              {
                echo "$BASHPID" >/tmp/consumer.pid
                exec /opt/kafka/bin/kafka-console-consumer.sh \
                  --bootstrap-server "$KAFKA_BOOTSTRAP" \
                  --command-config "$CFG" \
                  --topic "$KAFKA_DEV_TOPIC" \
                  --group "$KAFKA_GROUP" \
                  --command-property "client.id=$cid" \
                  --formatter-property print.timestamp=true \
                  --timeout-ms "$ctimeout"
              } 2>/tmp/consumer.err | while IFS= read -r line; do
                printf '%s\t%s\n' "$(date +%s%3N)" "$line"
              done >/tmp/consume.log &
              # ⓑ 할당 확인 — describe에 이 토픽의 파티션을 가진 **자기** 멤버 행(CONSUMER-ID ≠ "-" · CLIENT-ID = $cid)이 보이면 준비 끝(2 s 간격 · 상한 60 s).
              #    CLIENT-ID까지 보는 이유: 직전 실행이 비정상 종료해 옛 멤버가 session.timeout 동안 그룹에 남아 있으면 그 할당 행을 준비로 오인한다
              #    (멤버 행의 CLIENT-ID = 그 멤버의 client.id · 할당 없는 커밋 행은 "-" — ConsumerGroupCommand.java :841–855 · :859–868). 열 위치는 머리 행에서
              #    찾는다(--verbose면 LEADER-EPOCH 열이 끼어든다 — :340–342). 컨슈머와 동시에 뜨는 두 번째 JVM이라 힙 상한을 낮춘다.
              #    컨슈머가 먼저 끝나면(인증 실패 등) 60 s를 기다리지 않는다.
              assigned=0
              rstart=$(date +%s)
              while :; do
                KAFKA_HEAP_OPTS="-Xms32m -Xmx128m" /opt/kafka/bin/kafka-consumer-groups.sh \
                  --bootstrap-server "$KAFKA_BOOTSTRAP" \
                  --command-config "$CFG" \
                  --describe --group "$KAFKA_GROUP" >/tmp/groups.log 2>&1
                if awk -v t="$KAFKA_DEV_TOPIC" -v c="$cid" '
                    $1 == "GROUP" { ti = 0; ci = 0; li = 0; for (i = 1; i <= NF; i++) { if ($i == "TOPIC") ti = i; if ($i == "CONSUMER-ID") ci = i; if ($i == "CLIENT-ID") li = i }; next }
                    ti > 0 && ci > 0 && li > 0 && $ti == t && $ci != "-" && $li == c { ok = 1 }
                    END { if (ok) exit 0; exit 1 }' /tmp/groups.log; then
                  assigned=1
                  break
                fi
                consumer_alive || break
                [ $(( $(date +%s) - rstart )) -lt 60 ] || break
                sleep 2
              done
              if [ "$assigned" -ne 1 ]; then
                if consumer_alive; then
                  stop_consumer
                  ng "roundtrip consumer not assigned within 60s: $(groups_note)"
                else
                  stop_consumer
                  ng "roundtrip consumer exited before assignment: $(consumer_err)"
                fi
              else
                # ⓒ produce — 옵션은 기존 그대로
                start_ms=$(date +%s%3N)
                start=$(( start_ms / 1000 ))
                printf '%s\n' "$marker" | /opt/kafka/bin/kafka-console-producer.sh \
                  --bootstrap-server "$KAFKA_BOOTSTRAP" \
                  --producer.config "$CFG" \
                  --producer-property max.block.ms=20000 \
                  --producer-property delivery.timeout.ms=25000 \
                  --topic "$KAFKA_DEV_TOPIC" >/tmp/produce.log 2>&1
                prc=$?
                # ⓓ 마커 줄 폴링(1 s 간격 · 상한 KAFKA_ROUNDTRIP_DEADLINE_S — produce 시작부터). 줄 = <수신 ms>\tCreateTime:<생성 ms>\t<값>
                found=0
                if [ "$prc" -eq 0 ]; then
                  while :; do
                    if find_marker; then found=1; break; fi
                    consumer_alive || break
                    [ $(( $(date +%s) - start )) -lt "$KAFKA_ROUNDTRIP_DEADLINE_S" ] || break
                    sleep 1
                  done
                fi
                # ⓔ 컨슈머 종료 — 기록이 닫힌 뒤 한 번 더 찾는다(마지막 폴링과 종료 사이에 도착한 줄)
                stop_consumer
                if [ "$found" -ne 1 ] && [ "$prc" -eq 0 ] && find_marker; then found=1; fi
                # ⓕ RESULT
                if [ "$prc" -ne 0 ]; then
                  producer_evidence
                  # RESULT 줄에는 스택 꼬리(`\t... N more` — ConsoleProducer.java :75–77 printStackTrace)가 아니라 safe_tail이 고른 원인 줄을 싣는다(리뷰 r2 O11).
                  pcause=$(safe_tail /tmp/produce.log 140)
                  ng "roundtrip produce 실패(rc=$prc): ${pcause:-$nodiag}"
                elif [ "$found" -ne 1 ]; then
                  printf 'EVIDENCE: consumer 수신 %s줄 · stderr: %s\n' "$(wc -l 2>/dev/null </tmp/consume.log | tr -d ' ')" "$(consumer_err)"
                  producer_evidence
                  ng "roundtrip ${KAFKA_DEV_TOPIC}에서 마커를 ${KAFKA_ROUNDTRIP_DEADLINE_S}s 안에 받지 못함($(( $(date +%s) - start ))s 경과)"
                else
                  create_ms=${m_ts#CreateTime:}
                  if [ "$create_ms" != "$m_ts" ] && is_num "$create_ms" && is_num "$m_recv" && [ "$m_recv" -ge "$create_ms" ]; then
                    latency=$(( m_recv - create_ms ))
                    elapsed=$(( (m_recv - start_ms) / 1000 ))
                    if [ "$elapsed" -le "$KAFKA_ROUNDTRIP_DEADLINE_S" ]; then
                      ok "roundtrip ${KAFKA_DEV_TOPIC} produce→consume ${elapsed}s latency=${latency}ms (상한 ${KAFKA_ROUNDTRIP_DEADLINE_S}s, JVM 기동 포함)"
                    else
                      ng "roundtrip 마커는 수신했으나 ${elapsed}s > 상한 ${KAFKA_ROUNDTRIP_DEADLINE_S}s"
                    fi
                  else
                    ng "roundtrip 마커는 수신했으나 지연을 잴 수 없음(수신 '$(printf '%s' "$m_recv" | cut -c1-20)' · 타임스탬프 '$(printf '%s' "$m_ts" | cut -c1-40)' — 기대 <ms> · CreateTime:<ms>)"
                  fi
                fi
              fi

              # ② cross-env-denied — 같은 dev 자격으로 prod 토픽에 write 시도 → 인가 거부여야 한다.
              #    (T055 `auto.create.topics.enable=false`이므로 토픽 자동 생성으로 통과하는 경로는 없다.)
              printf '%s\n' "${marker}-cross" | /opt/kafka/bin/kafka-console-producer.sh \
                --bootstrap-server "$KAFKA_BOOTSTRAP" \
                --producer.config "$CFG" \
                --producer-property max.block.ms=20000 \
                --producer-property delivery.timeout.ms=25000 \
                --topic "$KAFKA_PROD_TOPIC" >/tmp/cross.log 2>&1
              crc=$?
              if grep -qE 'TopicAuthorizationException|Not authorized to access topics|AuthorizationException' /tmp/cross.log; then
                ok "cross-env-denied ${KAFKA_USERNAME} -> ${KAFKA_PROD_TOPIC}: $(grep -E 'TopicAuthorizationException|Not authorized to access topics' /tmp/cross.log | grep -v '^[[:space:]]' | grep -viE 'password|jaas' | head -n 1 | cut -c1-140)"
              elif [ "$crc" -eq 0 ] && ! grep -qiE 'error|exception' /tmp/cross.log; then
                ng "cross-env-denied dev 자격으로 prod 토픽 ${KAFKA_PROD_TOPIC} write가 성공했다(ACL 회귀)"
              else
                ccause=$(safe_tail /tmp/cross.log 140)
                ng "cross-env-denied 인가 거부가 아닌 실패(rc=$crc): ${ccause:-$nodiag}"
              fi

              rm -f "$CFG"
              printf 'SUMMARY: pass=%d fail=%d\n' "$pass" "$fail"
              [ "$fail" -eq 0 ] || exit 1
          envFrom:
            - secretRef:
                name: assert-env
            - configMapRef:
                name: assert-config
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: kafka-ca
              mountPath: /etc/kafka-ca
              readOnly: true
          resources:
            # JVM 동시 최대 2개(선기동 컨슈머 `-Xmx256m` + describe `-Xmx128m` 또는 프로듀서 `-Xmx256m`) · 힙 상한 합 ≤ 512Mi — limit 640Mi 안인지는
            #   T059 첫 실행에서 실측(README 「확인이 필요한 값」). requests 명시(FR-033).
            requests:
              cpu: 100m
              memory: 320Mi
            limits:
              memory: 640Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
