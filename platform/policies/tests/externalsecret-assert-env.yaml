# platform/policies/tests/externalsecret-assert-env.yaml — 검사 Job 3종이 쓰는 **dev scope 자격증명 하나**
#
# 문면(tasks.md:120): 검사 Job은 "**dev scope ExternalSecret만** `envFrom`"하며 prod 자격은 갖지 않는다.
# 계약(hostnames-and-access.md :61-73): 세 Job의 ns는 `jt-dev`뿐이다 — dev 자격은 `ClusterSecretStore vault-dev`
#   에서만 나오고 그 store의 `conditions.namespaces`가 `jt-dev` 하나이기 때문이다.
#
# 계약 gitops-repo.md §ExternalSecret 규약 준수:
#   - `apiVersion: external-secrets.io/v1`(v1beta1 금지)
#   - `secretStoreRef.kind: ClusterSecretStore`, 이름은 5개 store 중 `vault-dev`
#   - `refreshInterval: 5m`(전 ExternalSecret 공통)
#   - `remoteRef.key`는 전부 `dev/` 접두(정규식 `^(platform|dev|prod)/[a-z0-9_./-]+$`) — prod·platform 경로 0개
#   - `dataFrom` 없음(경로 lint 우회 금지) · 항목별 `sourceRef` 없음
#   - `auth.kubernetes.serviceAccountRef`는 store(ClusterSecretStore `vault-dev`) 쪽 설정이며 여기서는 쓰지 않는다
#     (store 정의는 T045 `secrets/`; 거기서 `namespace: external-secrets`를 반드시 적는다)
#
# 이 Secret은 세 Job이 공유한다(설계 §6.3 "`envFrom` = ES `assert-env` **하나**"). Job마다 ES를 쪼개면
# Job 사이의 자격 격리가 한 단계 더 생기지만(예: kafka-assert가 DB 비밀번호를 보지 않음), 설계 결정은
# 단일 ES다 — 분할 안은 README §후속 결정에 남겼다.
#
# 값의 원천(data-model.md §8):
#   dev/db/dev_identity_admin/app  username·password·url   (url에 `sslmode=verify-full&sslrootcert=/etc/pg/ca.crt` 포함)
#   dev/kafka/identity-admin       password                (KafkaUser `dev-identity-admin`의 SCRAM 비밀번호)
#   dev/dragonfly/identity-admin   url                     (`ACL LIST` 조회용 — `+@all` 사용자)
#   dev/dragonfly/sample-pod       url                     (dev 전용 검사 계정 — NOPERM 프로브용, T057)
#   dev/openfga/store_id           store_id
#   dev/openfga/preshared          key
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: assert-env
  namespace: jt-dev
  labels:
    app.kubernetes.io/name: assert-env
    app.kubernetes.io/component: assert-job
    app.kubernetes.io/part-of: policies-tests
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-dev
  target:
    name: assert-env
    creationPolicy: Owner
  data:
    # --- pg-main: dev app role(`dev_identity_admin_app`) ------------------------
    - secretKey: DATABASE_URL
      remoteRef:
        key: dev/db/dev_identity_admin/app
        property: url
    - secretKey: PGUSER
      remoteRef:
        key: dev/db/dev_identity_admin/app
        property: username
    - secretKey: PGPASSWORD
      remoteRef:
        key: dev/db/dev_identity_admin/app
        property: password
    # --- Kafka: KafkaUser `dev-identity-admin`(SCRAM-SHA-512) -------------------
    - secretKey: KAFKA_PASSWORD
      remoteRef:
        key: dev/kafka/identity-admin
        property: password
    # --- Dragonfly: ACL 조회용(identity-admin) · NOPERM 프로브용(sample-pod) ----
    - secretKey: DRAGONFLY_URL
      remoteRef:
        key: dev/dragonfly/identity-admin
        property: url
    - secretKey: DRAGONFLY_SAMPLE_URL
      remoteRef:
        key: dev/dragonfly/sample-pod
        property: url
    # --- OpenFGA: dev store + preshared 키 --------------------------------------
    - secretKey: OPENFGA_STORE_ID
      remoteRef:
        key: dev/openfga/store_id
        property: store_id
    - secretKey: OPENFGA_TOKEN
      remoteRef:
        key: dev/openfga/preshared
        property: key
