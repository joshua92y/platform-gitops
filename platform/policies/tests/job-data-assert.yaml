# platform/policies/tests/job-data-assert.yaml — pg-main·Dragonfly 자격 검사 Job
#
# 계약 hostnames-and-access.md §자격이 필요한 검사: `psql`·`redis-cli`가 필요한 검사는 tester가 직접
# 실행하지 않는다. 이 Job이 클러스터 안에서 실행하고 tester는 `kubectl -n jt-dev logs job/data-assert`만 읽는다.
#
# 검사 id(quickstart §US3 ①–④ + VD-4): pg-cross-db-denied · catalog-connect-false · revoke-public ·
#   ssl-verify-full · acl-list · noperm  — 로그 계약(줄 형식·종료 코드)은 README.md §로그 계약.
#
# 컨테이너 2단 구성 이유: 하나의 로그 스트림에 6개 판정을 모으기 위해서다. `kubectl logs job/<name>`은
#   컨테이너가 여러 개면 컨테이너를 골라야 하므로(tester 계약은 `logs job/…` 한 줄), Dragonfly 검사는
#   **initContainer**가 수행해 결과 줄을 emptyDir 파일에 적고, 본 컨테이너(psql)가 자기 판정과 함께 그 줄을
#   다시 출력한다. initContainer는 실패해도 exit 0으로 끝난다(판정은 FAIL 줄로 남기고 파드를 죽이지 않는다).
#
# 이미지: 태그 + digest 병기(계약 §이미지·승격, validate 검사 4b). digest는 Docker Hub registry v2 API로
#   조회한 manifest index sha256(2026-09-08)이며 linux/arm64 항목을 포함한다(노드 2대 = Ampere A1, arm64).
#
# 비루트 UID를 숫자로 못박는 이유: 두 이미지의 config `User`가 비어 있거나(postgres·redis = root)
#   이름 형식이라, `runAsNonRoot: true`만 두면 kubelet이 비루트 여부를 판정하지 못해 파드가 뜨지 않는다.
#   psql·redis-cli 바이너리는 모두 world-readable/executable이라 임의 비루트 UID로 실행된다.
#
# 실행 시점: 이 매니페스트는 T041에서 만들지만 **Argo Application은 아직 없다**(설계 D3-A). 검사 대상
#   (pg-main·Dragonfly·CA 미러 Secret)이 US3 산출물이라 지금 배포하면 즉시 실패하기 때문이다 — README §왜 지금 Application이 없나.
apiVersion: batch/v1
kind: Job
metadata:
  name: data-assert
  namespace: jt-dev
  labels:
    app.kubernetes.io/name: data-assert
    app.kubernetes.io/component: assert-job
    # 되돌리기 라벨 선택자(`app.kubernetes.io/part-of=platform-policies`)와 겹치지 않게 별도 값을 쓴다 —
    # 비상 시 정책 일괄 삭제가 검사 Job까지 지우거나 그 반대가 되지 않도록.
    app.kubernetes.io/part-of: policies-tests
spec:
  # 재시도하지 않는다: 실패는 대상 시스템의 상태 증거이므로 조용히 재시도해 가리지 않는다.
  backoffLimit: 0
  activeDeadlineSeconds: 300
  # 로그 보존과 무한 적재 사이의 절충: 7일. tester(T049·T102)는 적용 직후에 읽고, 그 뒤에는 GC가 정리한다.
  # 설계 §6.3은 "미지정(로그 보존)"이었고 T041 슬라이스 문면은 "ttlSecondsAfterFinished 명시"였다 —
  # 둘을 함께 만족시키는 값이며, 재실행 모델을 확정하는 태스크(T102 계열)에서 다시 정한다.
  ttlSecondsAfterFinished: 604800
  template:
    metadata:
      labels:
        app.kubernetes.io/name: data-assert
        app.kubernetes.io/component: assert-job
        app.kubernetes.io/part-of: policies-tests
    spec:
      restartPolicy: Never
      # 이 Job은 K8s API를 쓰지 않는다(계약 gitops-repo.md §워크로드 강화).
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: work
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        - name: pg-ca
          secret:
            # CA 미러 Secret(ESO store `k8s-data-ca`, `remoteRef.property: ca.crt`만 — `ca.key`는 오지 않는다).
            # T056이 만들기 전에는 이 Job이 뜨지 않는다(ContainerCreating) — 의도한 선행 조건이다.
            secretName: pg-main-ca
            items:
              - key: ca.crt
                path: ca.crt
      initContainers:
        - name: dragonfly-assert
          image: redis:8.8.2-alpine@sha256:96cb544fa0af5aa898d160cffb7dae70c3df117190fc123831c64712cda425ff
          workingDir: /tmp
          command: [/bin/sh, -c]
          args:
            - |
              set -u
              out=/work/dragonfly.result
              : > "$out"
              emit() { printf '%s\n' "$*" >>"$out"; }

              if [ -z "${DRAGONFLY_URL:-}" ] || [ -z "${DRAGONFLY_SAMPLE_URL:-}" ]; then
                emit "FAIL acl-list ExternalSecret assert-env에 DRAGONFLY_URL 또는 DRAGONFLY_SAMPLE_URL이 없다"
                emit "FAIL noperm ExternalSecret assert-env에 DRAGONFLY_SAMPLE_URL이 없다"
                exit 0
              fi

              # ① acl-list — ACL LIST 응답에서 비밀번호 해시(#<hex>)를 지운 뒤 증거로 남긴다.
              #    (quickstart는 `logs job/data-assert | grep -A5 'ACL LIST'`로 이 블록을 읽는다.)
              acl=$(redis-cli -u "$DRAGONFLY_URL" -t 5 ACL LIST 2>&1 | sed 's/#[0-9a-f]\{16,\}/#<redacted>/g')
              emit "EVIDENCE: ACL LIST (dev, 비밀번호 해시 제거)"
              printf '%s\n' "$acl" | head -n 6 | while IFS= read -r l; do emit "EVIDENCE:   $l"; done
              user_line=$(printf '%s\n' "$acl" | grep "^user ${DRAGONFLY_ACL_USER} " || true)
              if [ -n "$user_line" ] && printf '%s' "$user_line" | grep -qF "$DRAGONFLY_ACL_PATTERN"; then
                emit "PASS acl-list user ${DRAGONFLY_ACL_USER} 행에 ${DRAGONFLY_ACL_PATTERN}(읽기 전용 revoked 패턴)이 있다"
              else
                emit "FAIL acl-list user ${DRAGONFLY_ACL_USER} 행에서 ${DRAGONFLY_ACL_PATTERN}를 찾지 못함 — 응답 첫 줄: $(printf '%s' "$acl" | head -n 1 | cut -c1-100)"
              fi

              # ② noperm — 읽기 전용 패턴을 가진 dev 검사 계정으로 revoked 키 DEL 시도 → NOPERM 이어야 한다.
              del=$(redis-cli -u "$DRAGONFLY_SAMPLE_URL" -t 5 DEL "$REVOKED_PROBE_KEY" 2>&1)
              if printf '%s' "$del" | grep -q 'NOPERM'; then
                emit "PASS noperm DEL ${REVOKED_PROBE_KEY} -> $(printf '%s' "$del" | head -n 1 | cut -c1-100)"
              else
                emit "FAIL noperm DEL ${REVOKED_PROBE_KEY} 가 NOPERM으로 거부되지 않음 -> $(printf '%s' "$del" | head -n 1 | cut -c1-100)"
              fi
              exit 0
          envFrom:
            - secretRef:
                name: assert-env
            - configMapRef:
                name: assert-config
          volumeMounts:
            - name: work
              mountPath: /work
            - name: tmp
              mountPath: /tmp
          resources:
            # requests 명시(FR-033) — LimitRange `default.memory` 512Mi가 요청값으로 승계되는 것을 막는다(설계 R11).
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              # memory limit만 둔다(FR-008: CPU limit 없음 — cluster.tests limits-1/2).
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
      containers:
        - name: pg-assert
          image: postgres:18.6-alpine@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2
          workingDir: /tmp
          command: [/bin/sh, -c]
          args:
            - |
              set -u
              export HOME=/tmp
              pass=0
              fail=0
              ok() { pass=$((pass + 1)); printf 'RESULT: PASS %s\n' "$*"; }
              ng() { fail=$((fail + 1)); printf 'RESULT: FAIL %s\n' "$*"; }

              # fail-closed: 필요한 값이 하나라도 비면 네 검사 모두 FAIL로 기록한다(조용한 통과 금지).
              miss=''
              for v in DATABASE_URL PGUSER PGPASSWORD PGHOST PGPORT PGSSLROOTCERT DEV_DB PROD_DB SHARED_DBS PROD_APP_ROLE; do
                eval "val=\${$v:-}"
                [ -n "$val" ] || miss="$miss $v"
              done
              if [ -n "$miss" ]; then
                ng "pg-cross-db-denied 필수 값 없음:$miss"
                ng "catalog-connect-false 필수 값 없음:$miss"
                ng "revoke-public 필수 값 없음:$miss"
                ng "ssl-verify-full 필수 값 없음:$miss"
              else
                CONN="host=$PGHOST port=$PGPORT user=$PGUSER sslmode=verify-full sslrootcert=$PGSSLROOTCERT connect_timeout=10"

                # ① pg-cross-db-denied — dev app role로 prod DB·공유 DB 실접속 시도 → permission denied for database
                bad=''
                for db in $PROD_DB $SHARED_DBS; do
                  o=$(psql "$CONN dbname=$db" -tAc 'SELECT 1' 2>&1)
                  rc=$?
                  if [ "$rc" -eq 0 ]; then
                    bad="$bad ${db}=connected"
                  elif printf '%s' "$o" | grep -qi 'permission denied for database'; then
                    :
                  else
                    bad="$bad ${db}=$(printf '%s' "$o" | head -n 1 | cut -c1-80)"
                  fi
                done
                if [ -z "$bad" ]; then
                  ok "pg-cross-db-denied ${PGUSER} -> ${PROD_DB} ${SHARED_DBS}: 전부 permission denied for database"
                else
                  ng "pg-cross-db-denied 기대(permission denied for database)와 다름:$bad"
                fi

                # ② catalog-connect-false — 로그인 없이 카탈로그로 prod role의 CONNECT 권한 확인(전부 false)
                q="SELECT has_database_privilege('$PROD_APP_ROLE','$DEV_DB','CONNECT')::text"
                for db in $SHARED_DBS; do
                  q="$q || ' ' || has_database_privilege('$PROD_APP_ROLE','$db','CONNECT')::text"
                done
                o=$(psql "$DATABASE_URL" -tAc "$q" 2>&1)
                rc=$?
                if [ "$rc" -ne 0 ]; then
                  ng "catalog-connect-false 카탈로그 조회 실패: $(printf '%s' "$o" | head -n 1 | cut -c1-120)"
                elif printf '%s' "$o" | grep -q 'true'; then
                  ng "catalog-connect-false has_database_privilege(${PROD_APP_ROLE}, {${DEV_DB} ${SHARED_DBS}}, CONNECT) = $o (전부 false 여야 함)"
                else
                  ok "catalog-connect-false has_database_privilege(${PROD_APP_ROLE}, {${DEV_DB} ${SHARED_DBS}}, CONNECT) = $o"
                fi

                # ③ revoke-public — 네 DB 전부 PUBLIC의 CONNECT가 회수되어 있어야 한다.
                #    datacl IS NULL이면 기본 권한(PUBLIC CONNECT 허용)이 살아 있다는 뜻이라 FAIL이다.
                dbs="$DEV_DB $PROD_DB $SHARED_DBS"
                inlist=$(for d in $dbs; do printf "'%s'," "$d"; done | sed 's/,$//')
                q="SELECT d.datname || '=' || CASE WHEN d.datacl IS NULL THEN 'default-public-connect' WHEN EXISTS (SELECT 1 FROM unnest(d.datacl) a WHERE a::text LIKE '=%c/%') THEN 'public-connect' ELSE 'revoked' END FROM pg_database d WHERE d.datname IN ($inlist) ORDER BY 1"
                o=$(psql "$DATABASE_URL" -tAc "$q" 2>&1)
                rc=$?
                got=$(printf '%s\n' "$o" | grep -c '=' || true)
                want=$(printf '%s\n' $dbs | grep -c . || true)
                line=$(printf '%s' "$o" | tr '\n' ' ')
                if [ "$rc" -ne 0 ]; then
                  ng "revoke-public 카탈로그 조회 실패: $(printf '%s' "$o" | head -n 1 | cut -c1-120)"
                elif [ "$got" -ne "$want" ]; then
                  ng "revoke-public pg_database에서 ${want}개 중 ${got}개만 조회됨: $line"
                elif printf '%s' "$o" | grep -q 'public-connect'; then
                  ng "revoke-public PUBLIC의 CONNECT가 남아 있음: $line"
                else
                  ok "revoke-public $line"
                fi

                # ④ ssl-verify-full — dev app role의 정본 URL(sslmode=verify-full)로 붙은 세션이 실제 TLS인지
                case "$DATABASE_URL" in
                  *sslmode=verify-full*)
                    o=$(psql "$DATABASE_URL" -tAc "SELECT ssl::text || ' ' || coalesce(version,'-') || ' ' || coalesce(cipher,'-') FROM pg_stat_ssl WHERE pid = pg_backend_pid()" 2>&1)
                    rc=$?
                    case "$o" in
                      true*) ok "ssl-verify-full pg_stat_ssl(self) = $o (DATABASE_URL sslmode=verify-full, CA ${PGSSLROOTCERT})" ;;
                      *) ng "ssl-verify-full pg_stat_ssl 확인 실패(rc=$rc): $(printf '%s' "$o" | head -n 1 | cut -c1-120)" ;;
                    esac
                    ;;
                  *)
                    ng "ssl-verify-full DATABASE_URL에 sslmode=verify-full 이 없다(Vault dev/db/dev_identity_admin/app.url 확인)"
                    ;;
                esac
              fi

              # ⑤⑥ initContainer(Dragonfly)의 판정 줄을 같은 로그 스트림으로 옮긴다.
              if [ -r /work/dragonfly.result ]; then
                while IFS= read -r l; do
                  case "$l" in
                    'PASS '*) pass=$((pass + 1)); printf 'RESULT: %s\n' "$l" ;;
                    'FAIL '*) fail=$((fail + 1)); printf 'RESULT: %s\n' "$l" ;;
                    *) printf '%s\n' "$l" ;;
                  esac
                done < /work/dragonfly.result
              else
                ng "acl-list initContainer 결과 파일(/work/dragonfly.result)이 없다"
                ng "noperm initContainer 결과 파일(/work/dragonfly.result)이 없다"
              fi

              printf 'SUMMARY: pass=%d fail=%d\n' "$pass" "$fail"
              [ "$fail" -eq 0 ] || exit 1
          envFrom:
            - secretRef:
                name: assert-env
            - configMapRef:
                name: assert-config
          volumeMounts:
            - name: work
              mountPath: /work
              readOnly: true
            - name: tmp
              mountPath: /tmp
            - name: pg-ca
              mountPath: /etc/pg
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
