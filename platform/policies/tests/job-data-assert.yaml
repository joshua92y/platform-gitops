# platform/policies/tests/job-data-assert.yaml — pg-main·Dragonfly 자격 검사 Job
#
# 계약 hostnames-and-access.md §자격이 필요한 검사: `psql`·`redis-cli`가 필요한 검사는 tester가 직접
# 실행하지 않는다. 이 Job이 클러스터 안에서 실행하고 tester는 `kubectl -n jt-dev logs job/data-assert`만 읽는다.
#
# 검사 id(quickstart §US3 ①–④ + VD-4 · 출력 순서): pg 6 = pg-cross-db-denied · catalog-connect-false · revoke-public ·
#   ssl-verify-full · role-attrs · app-session-timeouts · Dragonfly 7 = noauth · acl-list · writer-set · reader-get · reader-set-denied ·
#   reader-cross-denied · noperm(+ NOTE: 정리 1줄)  — 로그 계약(줄 형식·종료 코드)은 README.md §로그 계약.
#   role-attrs · app-session-timeouts는 T054가 더했다(모노레포 build-notes 「T050 · T051」 T054 몫 · 하네스 tests/platform/data.tests.ps1 job-2).
#   noauth · writer-set · reader-get · reader-set-denied · reader-cross-denied는 T057이 더했다(같은 build-notes T057 몫 · 하네스 tests/platform/kafka.tests.ps1
#   job-d-2 · data.tests.ps1 job-2는 추적 밖 id의 FAIL도 문제로 본다 → Dragonfly 7개도 전부 PASS여야 한다).
#
# 컨테이너 2단 구성 이유: 하나의 로그 스트림에 13개 판정을 모으기 위해서다. `kubectl logs job/<name>`은
#   컨테이너가 여러 개면 컨테이너를 골라야 하므로(tester 계약은 `logs job/…` 한 줄), Dragonfly 검사는
#   **initContainer**가 수행해 결과 줄을 emptyDir 파일에 적고, 본 컨테이너(psql)가 자기 판정과 함께 그 줄을
#   다시 출력한다. initContainer는 실패해도 exit 0으로 끝난다(판정은 FAIL 줄로 남기고 파드를 죽이지 않는다).
#
# 이미지: 태그 + digest 병기(계약 §이미지·승격, validate 검사 4b). digest는 Docker Hub registry v2 API로
#   조회한 manifest index sha256(2026-09-08)이며 linux/arm64 항목을 포함한다(노드 2대 = Ampere A1, arm64).
#
# 비루트 UID를 숫자로 못박는 이유: 두 이미지의 config `User`가 비어 있거나(postgres·redis = root)
#   이름 형식이라, `runAsNonRoot: true`만 두면 kubelet이 비루트 여부를 판정하지 못해 파드가 뜨지 않는다.
#   psql·redis-cli 바이너리는 모두 world-readable/executable이라 임의 비루트 UID로 실행된다.
#
# 실행 시점: 이 매니페스트는 T041에서 만들지만 **Argo Application은 아직 없다**(설계 D3-A). 검사 대상
#   (pg-main·Dragonfly·CA 미러 Secret)이 US3 산출물이라 지금 배포하면 즉시 실패하기 때문이다 — README §왜 지금 Application이 없나.
apiVersion: batch/v1
kind: Job
metadata:
  name: data-assert
  namespace: jt-dev
  labels:
    app.kubernetes.io/name: data-assert
    app.kubernetes.io/component: assert-job
    # 되돌리기 라벨 선택자(`app.kubernetes.io/part-of=platform-policies`)와 겹치지 않게 별도 값을 쓴다 —
    # 비상 시 정책 일괄 삭제가 검사 Job까지 지우거나 그 반대가 되지 않도록.
    app.kubernetes.io/part-of: policies-tests
spec:
  # 재시도하지 않는다: 실패는 대상 시스템의 상태 증거이므로 조용히 재시도해 가리지 않는다.
  backoffLimit: 0
  activeDeadlineSeconds: 300
  # 로그 보존과 무한 적재 사이의 절충: 7일. tester(T049·T102)는 적용 직후에 읽고, 그 뒤에는 GC가 정리한다.
  # 설계 §6.3은 "미지정(로그 보존)"이었고 T041 슬라이스 문면은 "ttlSecondsAfterFinished 명시"였다 —
  # 둘을 함께 만족시키는 값이며, 재실행 모델을 확정하는 태스크(T102 계열)에서 다시 정한다.
  ttlSecondsAfterFinished: 604800
  template:
    metadata:
      labels:
        app.kubernetes.io/name: data-assert
        app.kubernetes.io/component: assert-job
        app.kubernetes.io/part-of: policies-tests
    spec:
      restartPolicy: Never
      # 이 Job은 K8s API를 쓰지 않는다(계약 gitops-repo.md §워크로드 강화).
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: work
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        - name: pg-ca
          secret:
            # CA 미러 Secret(ESO store `k8s-data-ca`, `remoteRef.property: ca.crt`만 — `ca.key`는 오지 않는다).
            # T056이 만들기 전에는 이 Job이 뜨지 않는다(ContainerCreating) — 의도한 선행 조건이다.
            secretName: pg-main-ca
            items:
              - key: ca.crt
                path: ca.crt
      initContainers:
        - name: dragonfly-assert
          image: redis:8.8.2-alpine@sha256:96cb544fa0af5aa898d160cffb7dae70c3df117190fc123831c64712cda425ff
          workingDir: /tmp
          command: [/bin/sh, -c]
          args:
            - |
              set -u
              out=/work/dragonfly.result
              : > "$out"
              emit() { printf '%s\n' "$*" >>"$out"; }
              # 가림(T057): 출력에 실리는 redis-cli 응답은 전부 mask를 거친다 — URL(자격 포함) → redis://<redacted> ·
              #   `#` 뒤 hex 8자 이상 → #<redacted>(ACL LIST는 해시를 15자로 줄여 보여 주므로 옛 규칙 "16자 이상"은 한 번도 매치되지 않았다).
              mask() { sed -E 's#redis://[^[:space:]]*#redis://<redacted>#g; s/#[0-9a-f]{8,}/#<redacted>/g'; }
              # 응답 조각 = 가린 첫 줄 100자. 빈 응답은 표시 문구로 바꾼다(GET의 nil은 redis-cli raw 출력에서 빈 문자열이다).
              show() { s=$(printf '%s\n' "$1" | mask | head -n 1 | cut -c1-100); printf '%s' "${s:-(빈 응답)}"; }
              # redis-cli 1회 = stdout+stderr 문자열. 판정은 종료 코드가 아니라 이 문자열로 한다(-e 없이는 오류 응답도 종료 코드 0).
              #   --no-auth-warning: -u URL에 비밀번호가 있으면 stderr 경고 줄이 붙어 정확 일치(OK · probe)를 깨뜨린다(README §검증 기록 T057).
              rc() { redis-cli --no-auth-warning -t 5 "$@" 2>&1; }

              # fail-closed: 필요한 값이 하나라도 비면 Dragonfly 7검사를 전부 FAIL로 남긴다(id 수 불변 · 비어 있는 변수의 이름만 — 값은 찍지 않는다).
              miss=''
              for v in DRAGONFLY_URL DRAGONFLY_SAMPLE_URL DRAGONFLY_HOST DRAGONFLY_PORT REVOKED_PROBE_KEY DRAGONFLY_ACL_USER DRAGONFLY_ACL_PATTERN; do
                eval "val=\${$v:-}"
                [ -n "$val" ] || miss="$miss $v"
              done
              if [ -n "$miss" ]; then
                for id in noauth acl-list writer-set reader-get reader-set-denied reader-cross-denied noperm; do
                  emit "FAIL $id 필수 값 없음(ExternalSecret assert-env · ConfigMap assert-config):$miss"
                done
                exit 0
              fi

              # 기동 유예 wait_ready(T057 수정 라운드 r2 · F13): 새 pod의 첫 1–2초에는 NetworkPolicy(kube-router) 규칙이 아직 반영되지 않아
              #   Dragonfly 연결이 REJECT(= `Connection refused`)될 수 있다 — VD-4 1차 실측(2026-10-22 06:39:50Z)에서 첫 세 호출만 거부됐고
              #   Dragonfly 재시작 0 · 엔드포인트 ready였다(서버 쪽 아님). 비인증 PING(-t 2) 응답에 `Could not connect`가 없으면(NOAUTH도 연결
              #   성공이다) 바로 끝내고, 있으면 1초 쉬고 다시 — 최대 15회. 15회 뒤에도 거부면 그대로 진행해 아래 noauth가 FAIL로 드러낸다
              #   (조용한 통과 0). n = 거부된 시도 수 = sleep 초 → noauth RESULT 근거 끝 ` wait=<n>s`(PASS · FAIL 모두 · 줄 수 불변).
              n=0
              while [ "$n" -lt 15 ]; do
                case "$(redis-cli -h "$DRAGONFLY_HOST" -p "$DRAGONFLY_PORT" -t 2 PING 2>&1)" in
                  *'Could not connect'*) n=$((n + 1)); sleep 1 ;;
                  *) break ;;
                esac
              done

              # ① noauth — 자격 없이 PING → NOAUTH(aclfile의 `USER default OFF +auth +hello`). PONG이면 aclfile이 적재되지 않아 default(nopass)로 기동한 것이다.
              r=$(rc -h "$DRAGONFLY_HOST" -p "$DRAGONFLY_PORT" PING)
              case "$r" in
                *NOAUTH*) emit "PASS noauth 미인증 PING -> NOAUTH(default 사용자 OFF) wait=${n}s" ;;
                *PONG*) emit "FAIL noauth 미인증 PING이 통과(PONG) — aclfile 미적재(default nopass) 의심 wait=${n}s" ;;
                *) emit "FAIL noauth 미인증 PING이 NOAUTH로 거부되지 않음 -> $(show "$r") wait=${n}s" ;;
              esac

              # ② acl-list — ACL LIST를 가린 뒤 증거로 남기고, dev 검사 계정 행에 읽기 전용 패턴이 있는지 본다.
              #    (quickstart는 `logs job/data-assert | grep -A5 'ACL LIST'`로 이 블록을 읽는다.)
              acl=$(rc -u "$DRAGONFLY_URL" ACL LIST | mask)
              emit "EVIDENCE: ACL LIST (dev, 비밀번호 해시 제거)"
              printf '%s\n' "$acl" | head -n 6 | while IFS= read -r l; do emit "EVIDENCE:   $l"; done
              user_line=$(printf '%s\n' "$acl" | grep "^user ${DRAGONFLY_ACL_USER} " || true)
              if [ -n "$user_line" ] && printf '%s' "$user_line" | grep -qF "$DRAGONFLY_ACL_PATTERN"; then
                emit "PASS acl-list user ${DRAGONFLY_ACL_USER} 행에 ${DRAGONFLY_ACL_PATTERN}(읽기 전용 revoked 패턴)이 있다"
              else
                emit "FAIL acl-list user ${DRAGONFLY_ACL_USER} 행에서 ${DRAGONFLY_ACL_PATTERN}를 찾지 못함 — 응답 첫 줄: $(show "$acl")"
              fi

              # ③ writer-set — identity-admin(DRAGONFLY_URL)으로 프로브 키 SET(EX 120 — 아래 정리 DEL이 실패해도 2분 뒤 사라진다).
              r=$(rc -u "$DRAGONFLY_URL" SET "$REVOKED_PROBE_KEY" probe EX 120)
              if [ "$r" = OK ]; then
                emit "PASS writer-set identity-admin으로 SET ${REVOKED_PROBE_KEY} probe EX 120 -> OK"
              else
                emit "FAIL writer-set identity-admin으로 SET ${REVOKED_PROBE_KEY} probe EX 120 이 OK가 아님 -> $(show "$r")"
              fi

              # ④ reader-get — 검사 계정(읽기 전용 패턴)으로 같은 키 GET → 정확히 probe.
              r=$(rc -u "$DRAGONFLY_SAMPLE_URL" GET "$REVOKED_PROBE_KEY")
              if [ "$r" = probe ]; then
                emit "PASS reader-get ${DRAGONFLY_ACL_USER}로 GET ${REVOKED_PROBE_KEY} -> probe(읽기 전용 패턴의 읽기 허용)"
              else
                emit "FAIL reader-get ${DRAGONFLY_ACL_USER}로 GET ${REVOKED_PROBE_KEY} 가 probe가 아님(nil = 빈 응답) -> $(show "$r")"
              fi

              # ⑤–⑦ NOPERM 판정(G9): PASS = 응답에 정확히 `NOPERM <검사 계정> ` 접두(Dragonfly 문구는 `-NOPERM <user> has no ACL permissions` 하나 — main_service.cc :1340) · 그 앞 `AUTH failed`는 FAIL — VD-4 1차 실측(2026-10-22) 거짓 양성 3건(`AUTH failed: NOPERM default …`가 옛 `*NOPERM*`을 통과).
              # ⑤ reader-set-denied — 검사 계정으로 revoked 키 SET → NOPERM(읽기 전용 패턴은 쓰기를 막는다).
              r=$(rc -u "$DRAGONFLY_SAMPLE_URL" SET "$REVOKED_PROBE_KEY" x)
              case "$r" in
                *'AUTH failed'*) emit "FAIL reader-set-denied ${DRAGONFLY_ACL_USER}로 SET ${REVOKED_PROBE_KEY} 인증 실패(AUTH failed) — NOPERM 판정 불가 · aclfile default 줄 또는 비밀번호 확인 -> $(show "$r")" ;;
                *"NOPERM ${DRAGONFLY_ACL_USER} "*) emit "PASS reader-set-denied ${DRAGONFLY_ACL_USER}로 SET ${REVOKED_PROBE_KEY} -> $(show "$r")" ;;
                OK) emit "FAIL reader-set-denied ${DRAGONFLY_ACL_USER}로 SET ${REVOKED_PROBE_KEY} 가 성공(OK) — %R~ 패턴이 쓰기를 막지 않음" ;;
                *) emit "FAIL reader-set-denied ${DRAGONFLY_ACL_USER}로 SET ${REVOKED_PROBE_KEY} 가 NOPERM으로 거부되지 않음 -> $(show "$r")" ;;
              esac

              # ⑥ reader-cross-denied — 검사 계정으로 다른 사용자의 접두(identity-admin:) SET → NOPERM(자기 접두 밖).
              #    EX 120: ACL이 깨져 SET이 성공하는 FAIL 경로에서도 키가 120 s 뒤 사라진다 — 정상 경로(NOPERM)에서는 키가 생기지 않는다.
              r=$(rc -u "$DRAGONFLY_SAMPLE_URL" SET identity-admin:assert-probe 1 EX 120)
              case "$r" in
                *'AUTH failed'*) emit "FAIL reader-cross-denied ${DRAGONFLY_ACL_USER}로 SET identity-admin:assert-probe 1 EX 120 인증 실패(AUTH failed) — NOPERM 판정 불가 · aclfile default 줄 또는 비밀번호 확인 -> $(show "$r")" ;;
                *"NOPERM ${DRAGONFLY_ACL_USER} "*) emit "PASS reader-cross-denied ${DRAGONFLY_ACL_USER}로 SET identity-admin:assert-probe 1 EX 120 -> $(show "$r")" ;;
                OK) emit "FAIL reader-cross-denied ${DRAGONFLY_ACL_USER}로 SET identity-admin:assert-probe 1 EX 120 이 성공(OK) — 자기 접두 밖 쓰기가 허용됨" ;;
                *) emit "FAIL reader-cross-denied ${DRAGONFLY_ACL_USER}로 SET identity-admin:assert-probe 1 EX 120 이 NOPERM으로 거부되지 않음 -> $(show "$r")" ;;
              esac

              # ⑦ noperm — 같은 계정으로 revoked 키 DEL → NOPERM(키 패턴과 명령 카테고리는 짝지어지지 않으므로 %R~로만 막힌다 — denylist.md).
              del=$(rc -u "$DRAGONFLY_SAMPLE_URL" DEL "$REVOKED_PROBE_KEY")
              if printf '%s' "$del" | grep -qF 'AUTH failed'; then
                emit "FAIL noperm DEL ${REVOKED_PROBE_KEY} 인증 실패(AUTH failed) — NOPERM 판정 불가 · aclfile default 줄 또는 비밀번호 확인 -> $(show "$del")"
              elif printf '%s' "$del" | grep -qF "NOPERM ${DRAGONFLY_ACL_USER} "; then
                emit "PASS noperm DEL ${REVOKED_PROBE_KEY} -> $(show "$del")"
              else
                emit "FAIL noperm DEL ${REVOKED_PROBE_KEY} 가 NOPERM으로 거부되지 않음 -> $(show "$del")"
              fi

              # 정리(판정 아님) — identity-admin으로 프로브 키 DEL. 실패해도 writer-set의 EX 120이 2차 안전망이다.
              r=$(rc -u "$DRAGONFLY_URL" DEL "$REVOKED_PROBE_KEY")
              emit "NOTE: cleanup DEL ${REVOKED_PROBE_KEY} -> $(show "$r")"
              exit 0
          envFrom:
            - secretRef:
                name: assert-env
            - configMapRef:
                name: assert-config
          volumeMounts:
            - name: work
              mountPath: /work
            - name: tmp
              mountPath: /tmp
          resources:
            # requests 명시(FR-033) — LimitRange `default.memory` 512Mi가 요청값으로 승계되는 것을 막는다(설계 R11).
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              # memory limit만 둔다(FR-008: CPU limit 없음 — cluster.tests limits-1/2).
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
      containers:
        - name: pg-assert
          image: postgres:18.6-alpine@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2
          workingDir: /tmp
          command: [/bin/sh, -c]
          args:
            - |
              set -u
              export HOME=/tmp
              pass=0
              fail=0
              ok() { pass=$((pass + 1)); printf 'RESULT: PASS %s\n' "$*"; }
              ng() { fail=$((fail + 1)); printf 'RESULT: FAIL %s\n' "$*"; }

              # fail-closed: 필요한 값이 하나라도 비면 pg 여섯 검사 모두 FAIL로 기록한다(조용한 통과 금지).
              miss=''
              for v in DATABASE_URL PGUSER PGPASSWORD PGHOST PGPORT PGSSLROOTCERT DEV_DB PROD_DB SHARED_DBS PROD_APP_ROLE PROD_OWNER_ROLE DEV_OWNER_ROLE DEV_APP_ROLE; do
                eval "val=\${$v:-}"
                [ -n "$val" ] || miss="$miss $v"
              done
              if [ -n "$miss" ]; then
                ng "pg-cross-db-denied 필수 값 없음:$miss"
                ng "catalog-connect-false 필수 값 없음:$miss"
                ng "revoke-public 필수 값 없음:$miss"
                ng "ssl-verify-full 필수 값 없음:$miss"
                ng "role-attrs 필수 값 없음:$miss"
                ng "app-session-timeouts 필수 값 없음:$miss"
              else
                CONN="host=$PGHOST port=$PGPORT user=$PGUSER sslmode=verify-full sslrootcert=$PGSSLROOTCERT connect_timeout=10"

                # ① pg-cross-db-denied — dev app role로 prod DB·공유 DB 실접속 시도 → permission denied for database
                bad=''
                for db in $PROD_DB $SHARED_DBS; do
                  o=$(psql "$CONN dbname=$db" -tAc 'SELECT 1' 2>&1)
                  rc=$?
                  if [ "$rc" -eq 0 ]; then
                    bad="$bad ${db}=connected"
                  elif printf '%s' "$o" | grep -qi 'permission denied for database'; then
                    :
                  else
                    bad="$bad ${db}=$(printf '%s' "$o" | head -n 1 | cut -c1-80)"
                  fi
                done
                if [ -z "$bad" ]; then
                  ok "pg-cross-db-denied ${PGUSER} -> ${PROD_DB} ${SHARED_DBS}: 전부 permission denied for database"
                else
                  ng "pg-cross-db-denied 기대(permission denied for database)와 다름:$bad"
                fi

                # ② catalog-connect-false — 로그인 없이 카탈로그로 prod role의 CONNECT 권한 확인(전부 false)
                q="SELECT has_database_privilege('$PROD_APP_ROLE','$DEV_DB','CONNECT')::text"
                for db in $SHARED_DBS; do
                  q="$q || ' ' || has_database_privilege('$PROD_APP_ROLE','$db','CONNECT')::text"
                done
                o=$(psql "$DATABASE_URL" -tAc "$q" 2>&1)
                rc=$?
                if [ "$rc" -ne 0 ]; then
                  ng "catalog-connect-false 카탈로그 조회 실패: $(printf '%s' "$o" | head -n 1 | cut -c1-120)"
                elif printf '%s' "$o" | grep -q 'true'; then
                  ng "catalog-connect-false has_database_privilege(${PROD_APP_ROLE}, {${DEV_DB} ${SHARED_DBS}}, CONNECT) = $o (전부 false 여야 함)"
                else
                  ok "catalog-connect-false has_database_privilege(${PROD_APP_ROLE}, {${DEV_DB} ${SHARED_DBS}}, CONNECT) = $o"
                fi

                # ③ revoke-public — 네 DB 전부 PUBLIC의 CONNECT가 회수되어 있어야 한다.
                #    datacl IS NULL이면 기본 권한(PUBLIC CONNECT 허용)이 살아 있다는 뜻이라 FAIL이다.
                dbs="$DEV_DB $PROD_DB $SHARED_DBS"
                inlist=$(for d in $dbs; do printf "'%s'," "$d"; done | sed 's/,$//')
                q="SELECT d.datname || '=' || CASE WHEN d.datacl IS NULL THEN 'default-public-connect' WHEN EXISTS (SELECT 1 FROM unnest(d.datacl) a WHERE a::text LIKE '=%c/%') THEN 'public-connect' ELSE 'revoked' END FROM pg_database d WHERE d.datname IN ($inlist) ORDER BY 1"
                o=$(psql "$DATABASE_URL" -tAc "$q" 2>&1)
                rc=$?
                got=$(printf '%s\n' "$o" | grep -c '=' || true)
                want=$(printf '%s\n' $dbs | grep -c . || true)
                line=$(printf '%s' "$o" | tr '\n' ' ')
                if [ "$rc" -ne 0 ]; then
                  ng "revoke-public 카탈로그 조회 실패: $(printf '%s' "$o" | head -n 1 | cut -c1-120)"
                elif [ "$got" -ne "$want" ]; then
                  ng "revoke-public pg_database에서 ${want}개 중 ${got}개만 조회됨: $line"
                elif printf '%s' "$o" | grep -q 'public-connect'; then
                  ng "revoke-public PUBLIC의 CONNECT가 남아 있음: $line"
                else
                  ok "revoke-public $line"
                fi

                # ④ ssl-verify-full — dev app role의 정본 URL(sslmode=verify-full)로 붙은 세션이 실제 TLS인지
                case "$DATABASE_URL" in
                  *sslmode=verify-full*)
                    o=$(psql "$DATABASE_URL" -tAc "SELECT ssl::text || ' ' || coalesce(version,'-') || ' ' || coalesce(cipher,'-') FROM pg_stat_ssl WHERE pid = pg_backend_pid()" 2>&1)
                    rc=$?
                    case "$o" in
                      true*) ok "ssl-verify-full pg_stat_ssl(self) = $o (DATABASE_URL sslmode=verify-full, CA ${PGSSLROOTCERT})" ;;
                      *) ng "ssl-verify-full pg_stat_ssl 확인 실패(rc=$rc): $(printf '%s' "$o" | head -n 1 | cut -c1-120)" ;;
                    esac
                    ;;
                  *)
                    ng "ssl-verify-full DATABASE_URL에 sslmode=verify-full 이 없다(Vault dev/db/dev_identity_admin/app.url 확인)"
                    ;;
                esac

                # ⑤ role-attrs(T054) — 로그인 없이 카탈로그(pg_roles)로 DatabaseRole 선언이 PG에 실제로 적용됐는지:
                #    app 2 = bypassrls f · super f, pod owner 2 = bypassrls t · super f(build-notes 「T050 · T051」) +
                #    넷 다 createdb f · createrole f(과제 문면) · login t(gitops platform/cnpg-databases — 결정 D4).
                q="SELECT rolname || ' super=' || CASE WHEN rolsuper THEN 't' ELSE 'f' END || ' bypassrls=' || CASE WHEN rolbypassrls THEN 't' ELSE 'f' END || ' createdb=' || CASE WHEN rolcreatedb THEN 't' ELSE 'f' END || ' createrole=' || CASE WHEN rolcreaterole THEN 't' ELSE 'f' END || ' login=' || CASE WHEN rolcanlogin THEN 't' ELSE 'f' END FROM pg_roles WHERE rolname IN ('$PROD_APP_ROLE','$DEV_APP_ROLE','$PROD_OWNER_ROLE','$DEV_OWNER_ROLE') ORDER BY 1"
                o=$(psql "$DATABASE_URL" -tAc "$q" 2>&1)
                rc=$?
                if [ "$rc" -ne 0 ]; then
                  ng "role-attrs 카탈로그 조회 실패: $(printf '%s' "$o" | head -n 1 | cut -c1-120)"
                else
                  bad=''
                  for r in "$PROD_APP_ROLE:f" "$DEV_APP_ROLE:f" "$PROD_OWNER_ROLE:t" "$DEV_OWNER_ROLE:t"; do
                    n=${r%:*}
                    if ! printf '%s\n' "$o" | grep -qxF "$n super=f bypassrls=${r##*:} createdb=f createrole=f login=t"; then
                      got=$(printf '%s\n' "$o" | awk -v n="$n" '$1 == n' | head -n 1)
                      bad="$bad [${got:-$n 없음}]"
                    fi
                  done
                  if [ -z "$bad" ]; then
                    ok "role-attrs app(${PROD_APP_ROLE},${DEV_APP_ROLE}) bypassrls=f super=f · owner(${PROD_OWNER_ROLE},${DEV_OWNER_ROLE}) bypassrls=t super=f · 넷 다 createdb=f createrole=f login=t (pg_roles)"
                  else
                    ng "role-attrs pg_roles가 기대와 다름:$bad"
                  fi
                fi

                # ⑥ app-session-timeouts(T054) — pg_roles.rolconfig(DB 무관 role 설정)에 app 2 모두 statement_timeout=15s **그리고**
                #    idle_in_transaction_session_timeout=30s. 적용 주체 = gitops platform/cnpg-databases의 PostSync Job(app role 자신의 ALTER ROLE CURRENT_USER SET).
                q="SELECT r.rolname || ' ' || coalesce((SELECT c FROM unnest(r.rolconfig) AS c WHERE split_part(c, '=', 1) = 'statement_timeout'), 'statement_timeout=<unset>') || ' ' || coalesce((SELECT c FROM unnest(r.rolconfig) AS c WHERE split_part(c, '=', 1) = 'idle_in_transaction_session_timeout'), 'idle_in_transaction_session_timeout=<unset>') FROM pg_roles AS r WHERE r.rolname IN ('$PROD_APP_ROLE','$DEV_APP_ROLE') ORDER BY 1"
                o=$(psql "$DATABASE_URL" -tAc "$q" 2>&1)
                rc=$?
                if [ "$rc" -ne 0 ]; then
                  ng "app-session-timeouts 카탈로그 조회 실패: $(printf '%s' "$o" | head -n 1 | cut -c1-120)"
                else
                  bad=''
                  for n in "$PROD_APP_ROLE" "$DEV_APP_ROLE"; do
                    if ! printf '%s\n' "$o" | grep -qxF "$n statement_timeout=15s idle_in_transaction_session_timeout=30s"; then
                      got=$(printf '%s\n' "$o" | awk -v n="$n" '$1 == n' | head -n 1)
                      bad="$bad [${got:-$n 없음}]"
                    fi
                  done
                  if [ -z "$bad" ]; then
                    ok "app-session-timeouts ${PROD_APP_ROLE} · ${DEV_APP_ROLE}: statement_timeout=15s idle_in_transaction_session_timeout=30s (pg_roles.rolconfig)"
                  else
                    ng "app-session-timeouts rolconfig가 기대와 다름:$bad"
                  fi
                fi
              fi

              # ⑦–⑬ initContainer(Dragonfly)의 판정 줄 7개를 같은 로그 스트림으로 옮긴다.
              #    결과 파일이 없으면 Dragonfly 7개 id를 전부 FAIL 1줄씩 남긴다(id 수 불변 · 출력 순서 그대로 — initContainer의 fail-closed와 같은 원칙).
              if [ -r /work/dragonfly.result ]; then
                while IFS= read -r l; do
                  case "$l" in
                    'PASS '*) pass=$((pass + 1)); printf 'RESULT: %s\n' "$l" ;;
                    'FAIL '*) fail=$((fail + 1)); printf 'RESULT: %s\n' "$l" ;;
                    *) printf '%s\n' "$l" ;;
                  esac
                done < /work/dragonfly.result
              else
                for id in noauth acl-list writer-set reader-get reader-set-denied reader-cross-denied noperm; do
                  ng "$id initContainer 결과 파일(/work/dragonfly.result)이 없다"
                done
              fi

              printf 'SUMMARY: pass=%d fail=%d\n' "$pass" "$fail"
              [ "$fail" -eq 0 ] || exit 1
          envFrom:
            - secretRef:
                name: assert-env
            - configMapRef:
                name: assert-config
          volumeMounts:
            - name: work
              mountPath: /work
              readOnly: true
            - name: tmp
              mountPath: /tmp
            - name: pg-ca
              mountPath: /etc/pg
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
