# T042에서 운영자가 만든 수동 Secret `cloudflare-dns-token`(키 `api-token`)을 **인수**한다(T045 G3).
#   소비자는 ClusterIssuer `letsencrypt-staging`·`letsencrypt-prod`의 DNS-01 solver다(`platform/cert-manager-issuers/`).
# 인수는 **삭제 없이** 된다(ESO v2.10.0 소스: `applyOwnership`은 **다른 ExternalSecret**이 controller owner일 때만 거부한다).
#   **첫 동기화에서** 일어난다(ES status에 동기화 이력이 없어 refresh가 걸린다. Orphan에서는 managed 라벨·data-hash가
#   유효성 판정에 쓰이지 않는다 — ESO 2.10.0 `isSecretValid`). ⚠ 인수 시 `secret.Data`가 비워졌다가 다시 채워지고,
#   **ES가 매핑하지 않은 키는 그때 삭제된다**(2026-09-21 DR1 드릴 실측 — 이 Secret은 T042 절차상 `api-token` 1개뿐이다).
#   **kv 값 = 라이브 값**이 전제다(T045 OP1 시드 — 2026-09-21 완료).
#   provider 조회가 실패하면 Secret의 **data·UID는** 변경되지 않는다(`SecretSyncedError` 뒤 return) —
#   다만 그 전에 `reconcile.external-secrets.io/managed=true` 라벨 1개는 붙는다(메타데이터 PATCH · resourceVersion 변경).
# 키 매핑: Vault 필드 = `token`(정본은 모노레포 data-model §8), K8s Secret 키 = ClusterIssuer가 참조하는 `api-token`.
#   `remoteRef.key`에 `kv/` 접두를 붙이지 않는다 — store가 `path: kv` + `version: v2`라 ESO가 `kv/data/`를 붙인다(validate 3.1).
# `creationPolicy: Orphan`(설계 D4 = B′ 확정 · 계약 예시 `Owner`의 명시적 예외): ownerReference를 만들지 않는다.
#   `Owner`였다면 **ES가 지워지는 어떤 경로에서든**(`kubectl delete externalsecret` · `Delete=false`가 빠진 Application cascade)
#   Secret이 GC된다(`deletionPolicy: Retain`은 ownerRef GC를 막지 못한다 — 공식 매트릭스 "No (GC via ownerRef)").
#   ⚠ 아래 `Delete=false` 어노테이션 때문에 **지금은 Application cascade가 이 ES를 지우지 않는다** — 인수 해제는
#     `platform/secrets/README.md` §5의 절차(revert → 반영 확인 → `kubectl delete externalsecret`)뿐이다.
#   DNS·터널 두 ES에 **같은 인수 해제 절차**(revert 머지 → Argo 반영 확인 → ES 삭제 → Secret 잔존 확인)를 쓰기 위해
#   DNS도 Orphan으로 통일했다. 대가: ownerRef가 없으므로 Argo의 고아(orphaned) 리소스 목록에 계속 뜬다 — 드리프트가 아니다.
# ⚠ Orphan이어도 **값은 kv에서 덮어쓴다**(`Retain`은 잘못된 값의 덮어쓰기를 막지 않는다 — D4-③). 값 문제의 복구 1순위는 kv 정정이다.
#   Secret이 삭제되면 **ESO·Vault가 정상일 때 다음 주기 refresh(5분)에서** 재생성된다 — 즉시가 아니다
#   (2026-09-21 DR1 드릴 실측 302초: 직전 refreshTime 03:28:25Z → 새 Secret 03:33:25Z. VD-20 해소).
# `refreshPolicy: Periodic`을 함께 명시한다(2.10.0 CRD enum = `CreatedOnce`·`Periodic`·`OnChange`) — 정책 필드를 기본값에 맡기지 않는다.
# `target.template.metadata: {}`: template이 없으면 ESO가 이 ES의 라벨·어노테이션(Argo tracking-id 포함)을 **전부** Secret에 복사한다.
#   `template.data`가 비어도 키 매핑 동작은 그대로다. `template.type`은 적지 않고(Secret type 불변) `target.immutable`도 쓰지 않는다.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloudflare-dns-token
  namespace: cert-manager
  annotations:
    # ⚠ 범위 한정: **Argo의 삭제·prune만** 막는다(`kubectl delete`와 ESO 동작에는 영향이 없다 — D4-⑤).
    argocd.argoproj.io/sync-options: Delete=false,Prune=false
spec:
  refreshPolicy: Periodic      # D4-① — 기본값에 의존하지 않는다
  refreshInterval: 5m          # 계약 §공통 규칙. ⚠ CRD 기본값은 1h — 하네스 reboot-4(마감 300초)가 확정 FAIL한다
  secretStoreRef: { kind: ClusterSecretStore, name: vault-platform }
  target:
    name: cloudflare-dns-token
    creationPolicy: Orphan
    deletionPolicy: Retain
    template:
      metadata: {}
  data:
    - secretKey: api-token
      remoteRef: { key: platform/cloudflare/dns-token, property: token }
