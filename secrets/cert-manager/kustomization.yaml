# secrets/cert-manager/kustomization.yaml — ns `cert-manager`의 ExternalSecret 원본 (T045 G3).
#   이 디렉터리를 클러스터에 적용하는 것은 `platform/secrets/kustomization.yaml`(Application `platform-secrets`)이다 —
#   그 파일이 `../../secrets/cert-manager`를 base로 끌어간다. 여기에 Application은 없다(`../README.md`).
# ⚠ 전역 `namespace:` 변환기를 두지 않는다 — ExternalSecret이 `metadata.namespace: cert-manager`를 직접 적는다.
#   (배달자 `platform/secrets/`가 ns가 다른 ES를 함께 담기 때문이다.)
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - externalsecret-cloudflare-dns-token.yaml
