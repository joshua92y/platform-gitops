# T039에서 운영자가 만든 수동 Secret `cloudflared-tunnel`(키 `TUNNEL_TOKEN`)을 **인수**한다(T045 G4).
#   소비자는 Deployment `cloudflared`의 env `secretKeyRef`다(`platform/cloudflared/deployment.yaml`).
# ⚠⚠ **잠금 위험 리소스.** 이 Secret은 **SSH(노드 A·B)와 K8s API의 유일한 경로**인 터널 커넥터의 자격이다(공개 22는 닫혀 있다).
#   틀린 값으로 덮인 채 컨테이너가 다시 시작되면 운영자가 클러스터와 노드에서 함께 잠긴다.
#   env(`secretKeyRef`)는 **컨테이너가 시작할 때마다** kubelet이 Secret을 다시 읽어 채운다 — 파드 교체뿐 아니라 같은 파드 안의
#   제자리 재시작(liveness 실패 · OOMKill · 크래시 · 노드 재부팅 = 파드 이름은 그대로이고 `restartCount`만 증가)도 포함이다.
#   따라서 "실행 중 컨테이너가 옛 값을 들고 있다"는 안전망은 **재시작되지 않는 동안만** 유효하다 — 값이 틀린 상태는 안전 상태가
#   아니라 **시한 상태**다(이 Deployment의 liveness는 `/ready` 10s × 6이라 edge 단절이 ≈60초 이어지면 두 커넥터가 파드 교체
#   없이 거의 동시에 재시작한다). 복구(kv 정정)를 미루지 않고, 그동안 노드 재부팅·SUC Plan·drain을 하지 않는다.
#   그래서 인수 뒤에 `rollout restart`를 **하지 않고**, 파드를 **1개만** 교체하는 드릴로 확인한다(반대쪽 커넥터가 살아 있다).
#   이 Deployment에는 reloader 어노테이션이 없고 T046 감시 대상에도 넣지 않는다 — 그 수동성이 안전장치다.
# 인수는 **삭제 없이** 된다(ESO v2.10.0 소스: `applyOwnership`은 **다른 ExternalSecret**이 controller owner일 때만 거부한다).
#   **첫 동기화에서** 일어난다(ES status에 동기화 이력이 없어 refresh가 걸린다). ⚠ 인수 시 `secret.Data`가 비워졌다가 다시 채워지고,
#   **ES가 매핑하지 않은 키는 그때 삭제된다**(2026-09-21 DR1 드릴 실측 — 라이브 키는 `TUNNEL_TOKEN` 하나뿐이고,
#   머지 전 기준값 캡처가 그 전제를 확인한다. 키가 더 있으면 전부 열거하기 전에는 머지하지 않는다 —
#   판정 항목은 `../../platform/secrets/README.md` §2, 실행 블록의 정본은 그 절이 가리키는 G4 블록이다).
#   **kv 값 = 라이브 값**이 전제다(T045 OP1 시드 — 2026-09-21 완료: 라이브 Secret에서 파이프 복사 · 되읽기 해시 일치).
#   provider 조회가 실패하면 Secret의 **data·UID는** 변경되지 않는다(`SecretSyncedError` 뒤 return) —
#   다만 그 전에 `reconcile.external-secrets.io/managed=true` 라벨 1개는 붙는다(메타데이터 PATCH · resourceVersion 변경).
#   실패 문면별 원인 표는 `../../platform/secrets/README.md` §1.
# 키 매핑: Vault 필드 = `token`(정본은 모노레포 data-model §8), K8s Secret 키 = Deployment가 참조하는 `TUNNEL_TOKEN`.
#   `remoteRef.key`에 `kv/` 접두를 붙이지 않는다 — store가 `path: kv` + `version: v2`라 ESO가 `kv/data/`를 붙인다(validate 3.1).
# `creationPolicy: Orphan`(설계 D4 = B′ 확정 · 계약 §공통 규칙이 이 Secret을 이름으로 지목한 `Owner`의 명시적 예외):
#   ownerReference를 만들지 않는다. `Owner`였다면 **ES가 지워지는 어떤 경로에서든**(`kubectl delete externalsecret` ·
#   `Delete=false`가 빠진 Application cascade) Secret이 GC되고(`deletionPolicy: Retain`은 ownerRef GC를 막지 못한다 —
#   공식 매트릭스 "No (GC via ownerRef)"), 그 뒤 파드가 교체되면 커넥터가 자격 없이 떠서 접근 경로가 사라진다.
#   ⚠ Owner로 바꾸지 말 것 — 모노레포 하네스 `eso-4`가 이 회귀를 본다(라이브 검사라 **적용된 뒤에만** 보인다 —
#   머지 전 방어선은 `../../platform/secrets/README.md` §2의 렌더 체크다).
#   대가: ownerRef가 없으므로 Argo의 고아(orphaned) 리소스 목록에 계속 뜬다 — 드리프트가 아니다.
#   DNS 토큰 ES(`../cert-manager/`)도 같은 이유로 `Orphan`이다 — 두 ES의 인수 해제 절차가 같아진다.
# ⚠ Orphan이어도 **값은 kv에서 덮어쓴다**(D4-③ — `Retain`은 잘못된 값의 덮어쓰기를 막지 않는다). 값 문제의 복구 1순위는
#   Secret 수동 복구가 아니라 **kv 값 정정**이다(수동 복구는 다음 주기 ≤5분에 ESO가 되돌린다. 컨트롤러 scale 0도
#   `platform-external-secrets`의 selfHeal이 되돌린다 — 런북 `bootstrap.md` §3 T045 되돌리기).
#   Secret이 삭제되면 **ESO·Vault가 정상일 때 다음 주기 refresh(5분)에서** 재생성된다 — 즉시가 아니다
#   (2026-09-21 DR1 드릴 실측 302초). 그 창에서 실행 중 컨테이너는 영향이 없지만(**재시작되지 않는 한** — 재시작하면 Secret이
#   재생성될 때까지 `CreateContainerConfigError`), **새 파드는 시작하지 못한다**(최대 5분).
# ⚠ 콜드 부트스트랩: 터널 Secret과 cloudflared는 **T039 절차대로 수동으로 먼저** 올린다(그것이 운영자의 유일한 접근 경로다).
#   이 ES에 의한 인수는 Vault init·시드가 끝난 뒤다 — ExternalSecret은 부트스트랩의 시작점이 아니라 인수 단계다
#   (`../../platform/secrets/README.md` §4 · `../../platform/cloudflared/README.md` ⑨).
# 인수 절차: 수동 Secret을 **지우지 않는다**(`platform/cloudflared/README.md` ⑨의 옛 지시는 폐기됐다 —
#   스스로 잠금 창을 만드는 지시였다). 값이 같으면 실행 중 컨테이너에도, 그 뒤의 재시작에도 영향이 0이다.
# `refreshPolicy: Periodic`을 함께 명시한다(2.10.0 CRD enum = `CreatedOnce`·`Periodic`·`OnChange`) — 정책 필드를 기본값에 맡기지 않는다.
# `target.template.metadata: {}`: template이 없으면 ESO가 이 ES의 라벨·어노테이션(Argo tracking-id 포함)을 **전부** Secret에 복사한다.
#   `template.data`가 비어도 키 매핑 동작은 그대로다. `template.type`은 적지 않고(Secret type 불변) `target.immutable`도 쓰지 않는다.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloudflared-tunnel
  namespace: cloudflared
  annotations:
    # ⚠ 범위 한정(D4-⑤): **Argo의 삭제·prune만** 막는다(`kubectl delete`와 ESO 동작에는 영향이 없다).
    #   그래서 Application `platform-secrets`를 지워도 이 ES는 cascade에서 빠져 **남는다** — 인수 해제는
    #   `../../platform/secrets/README.md` §5의 절차(revert → 반영 확인 → `kubectl delete externalsecret`)뿐이다.
    argocd.argoproj.io/sync-options: Delete=false,Prune=false
spec:
  refreshPolicy: Periodic      # D4-① — 기본값에 의존하지 않는다
  refreshInterval: 5m          # 계약 §공통 규칙. ⚠ CRD 기본값은 1h — 하네스 reboot-4(마감 300초)가 확정 FAIL한다
  secretStoreRef: { kind: ClusterSecretStore, name: vault-platform }
  target:
    name: cloudflared-tunnel
    creationPolicy: Orphan
    deletionPolicy: Retain
    template:
      metadata: {}
  data:
    - secretKey: TUNNEL_TOKEN
      remoteRef: { key: platform/cloudflare/tunnel, property: token }
