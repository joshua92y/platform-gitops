# secrets/cloudflared/kustomization.yaml — ns `cloudflared`의 ExternalSecret 원본 (T045 G4).
#   이 디렉터리를 클러스터에 적용하는 것은 `platform/secrets/kustomization.yaml`(Application `platform-secrets`)이다 —
#   그 파일이 `../../secrets/cloudflared`를 base로 끌어간다. 여기에 Application은 없다(`../README.md`).
# ⚠ 전역 `namespace:` 변환기를 두지 않는다 — ExternalSecret이 `metadata.namespace: cloudflared`를 직접 적는다.
#   (배달자 `platform/secrets/`가 ns가 다른 ES를 함께 담기 때문이다.)
# ⚠ 커넥터 Deployment는 여기 없다 — `platform/cloudflared/`가 소유한다. 이 디렉터리는 그 Deployment가 읽는
#   Secret의 **인수 선언 한 장**만 담는다(소비자 배포와 ExternalSecret 적용의 분리 — `../../platform/secrets/README.md` §0).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - externalsecret-cloudflared-tunnel.yaml
