# ns `data`의 S3 백업 자격 — CNPG barman-cloud 플러그인이 OCI Object Storage(S3 호환)에 WAL 아카이브·베이스 백업을 쓸 때 읽는
#   Secret `oci-s3-backup`을 **새로 만든다**(T053 선행 · 인수형이 아니다 — 인수할 수동 Secret이 없다).
#   소비자는 T053의 `ObjectStore oci-backups`(`platform/cnpg-cluster/`)의 `s3Credentials`다 — Secret 키 `ACCESS_KEY_ID` ·
#   `ACCESS_SECRET_KEY` · `REGION`을 **이름으로** 참조한다(키 이름을 바꾸면 그 매니페스트도 함께 바꾼다). 엔드포인트 URL·버킷 이름은
#   비밀이 아니라 ObjectStore spec에 적는다(여기 없다).
# 키 매핑(정본은 모노레포 data-model §8 `kv/platform/oci/s3`): Vault 필드 `access_key` → Secret 키 `ACCESS_KEY_ID` ·
#   `secret_key` → `ACCESS_SECRET_KEY`. 값은 IAM 사용자 `svc-s3-backup`의 Customer Secret Key(S3 호환 자격)이고 버킷은
#   `joshuatech-backup` 하나다(설계 표기 `jt-backup` = 실명 `joshuatech-backup` — 모노레포 `infra/oci/backend.tf` 머리 주석 · `iam.tf`).
#   `REGION`은 비밀이 아니라 상수 `ap-chuncheon-1`(모노레포 `infra/oci/backend.tf`·`iam.tf`의 region) — barman-cloud가
#   `s3Credentials.region`을 `AWS_DEFAULT_REGION`으로 넘겨 SigV4 리전 서명에 쓴다.
#   `remoteRef.key`에 `kv/` 접두를 붙이지 않는다 — store가 `path: kv` + `version: v2`라 ESO가 `kv/data/`를 붙인다(validate 3.1).
# `target.template.data`(ESO 2.10.0 · 기본 `mergePolicy: Replace`): Secret의 키는 template의 **셋만**이고, `data[]`의 `secretKey`
#   (`access_key`·`secret_key`)는 템플릿 변수(`{{ .access_key }}`)로만 쓰여 Secret에 남지 않는다 — 렌더가 아니라 ESO 런타임 동작이라
#   **라이브 확인 VD**다(T053 머지 뒤 운영자 — **키 이름만** 출력한다. 값은 화면·파일·argv에 두지 않는다(`-o jsonpath`로 `.data` 전체를 찍는 형태는 base64 값까지 나오므로 금지):
#     `kubectl -n data get secret oci-s3-backup -o 'go-template={{range $k,$v := .data}}{{$k}}{{"\n"}}{{end}}'`
#   기대 = 키 집합 `ACCESS_KEY_ID` · `ACCESS_SECRET_KEY` · `REGION` 셋(그 밖의 키 0 — template.data Replace의 증명).
#   `access_key`·`secret_key`가 함께 보이면 Merge로 동작한 것 — 소비자는 그래도 동작하지만 문면과 어긋나므로 기록한다).
# `creationPolicy: Owner`(계약 §ExternalSecret 규약의 기본값 — 인수형 2장의 `Orphan` 예외에 해당하지 않는다). 대가: **ES가 지워지면
#   ownerReference GC로 Secret도 사라지고** WAL 아카이브·백업이 멈춘다(`deletionPolicy`는 적지 않는다 = 기본 `Retain`인데, `Retain`은
#   ownerRef GC를 막지 못한다 — 공식 매트릭스). 그래서 아래 `Delete=false,Prune=false`로 **Argo의 삭제·prune만** 막는다
#   (`kubectl delete`와 ESO 동작에는 영향이 없다). T053 `Cluster`가 이 Secret을 참조하는 동안 ES를 지우지 않는다.
#   모노레포 하네스 `eso-4`(인수형 2장의 Orphan/Retain 회귀)는 **이름 범위**라 이 ES를 보지 않는다 — 여기서 Owner는 의도다.
# ⚠ 키 쌍 정합은 **미증명**이다(이 저장소에는 값이 없다). 첫 증명 = T053 첫 백업(`Backup` phase completed · 버킷에 객체 생성).
#   `SignatureDoesNotMatch` · 403이면 kv 값 ≠ 콘솔의 Customer Secret Key다 — 운영자가 Customer Secret Key를 회전해 **kv를 갱신**하면
#   ESO가 ≤5분에 Secret에 반영한다. 값 문제의 복구 1순위는 Secret 수동 수정이 아니라 **kv 정정**이다(수동 수정은 다음 주기 ≤5분에
#   kv 값으로 되돌아간다). kv 경로가 비어 있으면 ES는 `SecretSyncedError`(Events `Secret does not exist` — vault provider 문면,
#   `../../platform/secrets/README.md` §1 표)이고 Secret은 **만들어지지 않는다**(Owner라 인수 지연이 아니라 부재다) — 머지 전 시드 확인.
# `refreshPolicy: Periodic`을 함께 명시한다(2.10.0 CRD enum = `CreatedOnce`·`Periodic`·`OnChange`) — 정책 필드를 기본값에 맡기지 않는다.
# `target.template.metadata: {}`: template의 metadata가 비어 있어야 ESO가 이 ES의 라벨·어노테이션(Argo tracking-id 포함)을 Secret에
#   복사하지 않는다. `template.type`은 적지 않고(Secret type `Opaque` 기본) `target.immutable`도 쓰지 않는다(회전 반영이 필요하다).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: oci-s3-backup
  namespace: data
  annotations:
    # ⚠ 범위 한정: **Argo의 삭제·prune만** 막는다(`kubectl delete`와 ESO 동작에는 영향이 없다).
    #   Owner라 ES 삭제 = Secret GC = WAL 아카이브·백업 중단 — Application cascade에서 이 ES를 빼는 것이 이 어노테이션의 목적이다.
    argocd.argoproj.io/sync-options: Delete=false,Prune=false
spec:
  refreshPolicy: Periodic      # 기본값에 의존하지 않는다
  refreshInterval: 5m          # 계약 §공통 규칙. ⚠ CRD 기본값은 1h — 하네스 reboot-4(마감 300초)가 확정 FAIL한다
  secretStoreRef: { kind: ClusterSecretStore, name: vault-platform }
  target:
    name: oci-s3-backup
    creationPolicy: Owner          # 새 Secret(인수 아님) — 계약 기본값
    template:
      metadata: {}                 # ES 라벨·어노테이션(Argo tracking)을 Secret에 복사하지 않는다
      data:                        # ESO template.data는 Replace — Secret 키는 아래 셋만(라이브 확인 VD · 머리 주석)
        ACCESS_KEY_ID: "{{ .access_key }}"
        ACCESS_SECRET_KEY: "{{ .secret_key }}"
        REGION: ap-chuncheon-1     # barman-cloud s3Credentials.region → AWS_DEFAULT_REGION(SigV4 리전 서명) — 비밀이 아니라 상수
  data:
    - secretKey: access_key
      remoteRef: { key: platform/oci/s3, property: access_key }
    - secretKey: secret_key
      remoteRef: { key: platform/oci/s3, property: secret_key }
