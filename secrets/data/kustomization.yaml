# secrets/data/kustomization.yaml — ns `data`의 ExternalSecret 원본 (T053 선행 — S3 백업 자격).
#   이 디렉터리를 클러스터에 적용하는 것은 `platform/secrets/kustomization.yaml`(Application `platform-secrets`)이다 —
#   그 파일이 `../../secrets/data`를 base로 끌어간다. 여기에 Application은 없다(`../README.md`).
# ⚠ 전역 `namespace:` 변환기를 두지 않는다 — ExternalSecret이 `metadata.namespace: data`를 직접 적는다.
#   (배달자 `platform/secrets/`가 ns가 다른 ES를 함께 담기 때문이다.)
# ⚠ 소비자(CNPG `ObjectStore oci-backups` · `Cluster pg-main`)는 여기 없다 — `platform/cnpg-cluster/`(T053)가 소유한다.
#   이 디렉터리는 그 ObjectStore가 `s3Credentials`로 읽는 Secret의 **선언 한 장**만 담는다(소비자 배포와 ExternalSecret 적용의
#   분리 — `../../platform/secrets/README.md` §0). 인수형(수동 Secret 인수)이 아니라 **신규** Secret(`creationPolicy: Owner`)이다.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - externalsecret-oci-s3-backup.yaml
